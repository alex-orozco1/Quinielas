name: Verificación de secretos (SEC-14.2)

# Reutiliza exactamente scripts/security/pre-commit-secret-check.sh — el
# mismo archivo que corre como hook local — sin reescribir ni duplicar
# ninguna de sus reglas aquí. Este workflow solo se encarga de poner el
# índice de git en el estado correcto para que el script (que internamente
# lee `git diff --cached`) vea exactamente los archivos añadidos/modificados
# en el PR o en el push, y de fallar el job si el script termina con código
# distinto de 0 — lo cual ya hace por sí solo, GitHub Actions no necesita
# ningún paso adicional para eso.
#
# Costo de mantenimiento: prácticamente cero. No hay reglas nuevas que
# mantener aquí — cualquier patrón nuevo se agrega una sola vez, en el
# script, y automáticamente aplica tanto al hook local como a este workflow.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio con historial suficiente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar el índice de git para reflejar exactamente lo que cambió
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            # En un push a una rama nueva o el primer commit del repo,
            # "before" viene en ceros — en ese caso no hay un commit previo
            # real contra el cual comparar, así que se usa el padre directo
            # de HEAD (o, si tampoco existe, no se compara nada y el script
            # simplemente no encontrará archivos "staged" que revisar).
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo "")"
            fi
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Reutilizar scripts/security/pre-commit-secret-check.sh sin cambios
        run: |
          if [ -n "$BASE_SHA" ]; then
            # Mueve HEAD a la base sin tocar el índice/working tree (que ya
            # tienen el contenido actual del PR/push) — así
            # `git diff --cached` dentro del script ve exactamente el diff
            # base→head, que es lo mismo que ve el hook local con los
            # archivos recién agregados al stage.
            git reset --soft "$BASE_SHA"
          fi
          bash scripts/security/pre-commit-secret-check.sh

