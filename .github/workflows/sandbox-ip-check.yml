name: sandbox-validate (temporal, PR #28)

# Prueba temporal contra el SANDBOX (qracks-mon003-sandbox), nunca producción.
# Valida el commit 33809d4 del PR #28 desplegado como 93d906f. Rama temporal; el
# workflow se quita al terminar. No forma parte del PR. No usa secretos y no
# imprime PINs ni contraseñas (son aleatorios y desechables).
on:
  push:
    branches: [ci/sandbox-ip-check]

permissions:
  contents: read

env:
  SANDBOX: https://qracks-mon003-sandbox.onrender.com
  EXPECTED_INDEX_SHA256: 253070adca5ec616651b5634add15948b3505acbd55c5e092d542f3d94d28e8c

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: El sandbox sirve el index.html de 33809d4
        run: |
          curl -sS "$SANDBOX/a/x" -o served.html
          echo "served   $(sha256sum served.html | cut -d' ' -f1)"
          echo "expected $EXPECTED_INDEX_SHA256"
          test "$(sha256sum served.html | cut -d' ' -f1)" = "$EXPECTED_INDEX_SHA256" && echo "MATCH"
      - name: Logins frecuentes no reinician la espera; IP falsificada no evade el límite
        run: node ci/sbx-validate.js all
      - name: Navegador (375 px) — aviso de espera junto al formulario
        run: |
          mkdir -p shots
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          node ci/sbx-ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-ui-screenshots
          path: shots/
          retention-days: 3
