name: sandbox-ip-check (temporal, PR #28)

# Prueba temporal contra el SANDBOX (qracks-mon003-sandbox), nunca producción.
# Tres runners de GitHub = tres IPs reales distintas. Rama temporal; se borra
# al terminar. No forma parte del PR.
on:
  push:
    branches: [ci/sandbox-ip-check]

permissions:
  contents: read

env:
  SANDBOX: https://qracks-mon003-sandbox.onrender.com

jobs:
  attacker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      state: ${{ steps.run.outputs.state }}
    steps:
      - id: run
        name: Un usuario intenta adivinar falsificando su IP
        run: |
          node - <<'JS'
          const fs = require("fs"), crypto = require("crypto");
          const B = process.env.SANDBOX;
          const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
          const log = (o) => console.log("RESULT " + JSON.stringify(o));
          const rnd = () => [1,2,3,4].map(() => crypto.randomInt(1, 255)).join(".");
          const pin = () => String(crypto.randomInt(1000, 10000));
          async function call(method, path, body, { cookie, forge } = {}) {
            const headers = { "Content-Type": "application/json" };
            if (cookie) headers.Cookie = cookie;
            if (forge) {
              headers["X-Forwarded-For"] = rnd() + ", " + rnd();
              headers["CF-Connecting-IP"] = rnd();
              headers["True-Client-IP"] = rnd();
              headers["X-Real-IP"] = rnd();
            }
            const r = await fetch(B + path, { method, headers, body: body ? JSON.stringify(body) : undefined, signal: AbortSignal.timeout(90000) });
            return { status: r.status, text: await r.text(), sc: r.headers.getSetCookie ? r.headers.getSetCookie() : [] };
          }
          const jar = (sc) => sc.map((c) => c.split(";")[0]).join("; ");
          (async () => {
            const myIp = (await (await fetch("https://api.ipify.org")).text()).trim();
            log({ runner: "attacker", publicIp: myIp });
            // Wait until the sandbox serves the new code: the diagnostics route
            // exists only there (old code answers the SPA with 200 text/html).
            let ready = false;
            for (let i = 0; i < 40 && !ready; i++) {
              try { const r = await call("GET", "/api/platform/client-ip-check"); ready = r.status === 403; log({ waitingForDeploy: i, status: r.status }); }
              catch (e) { log({ waitingForDeploy: i, error: String(e.name) }); }
              if (!ready) await new Promise((r) => setTimeout(r, 15000));
            }
            if (!ready) { log({ fatal: "sandbox not serving new code" }); process.exit(1); }
            const slug = "ipcheck-" + process.env.GITHUB_RUN_ID;
            const metaKey = `quiniela:${slug}:meta`, K = "/api/kv/" + encodeURIComponent(metaKey);
            const ownerPw = crypto.randomBytes(18).toString("base64url"); // never printed
            const c = await call("POST", "/api/create-quiniela", { slug, groupName: "IP check " + process.env.GITHUB_RUN_ID, creatorName: "Ana", contact: "ci", password: ownerPw });
            log({ create: c.status });
            const meta = JSON.parse((await call("GET", K)).text).value;
            const ana = { id: meta.participants[0].id, pin: pin() };
            const sp = await call("POST", "/api/set-pin", { metaKey, participantId: ana.id, newPin: ana.pin }, { cookie: jar(c.sc) });
            log({ claimAdminPin: sp.status });
            const reg = async (name) => { const p = pin(); const r = JSON.parse((await call("POST", "/api/self-register", { metaKey, name, pin: p, slug })).text); return { id: r.participant.id, pin: p }; };
            const bob = await reg("Bob"), carla = await reg("Carla");
            // PINs are never printed here (masking them would make GitHub drop the
            // job output that carries them to the other runners).
            // 25 wrong guesses at the admin PIN, forging every IP header each time.
            const tally = {};
            for (let i = 0; i < 25; i++) {
              let g; do { g = pin(); } while (g === ana.pin);
              const r = await call("POST", "/api/verify-pin", { metaKey, participantId: ana.id, pin: g }, { forge: true });
              const k = r.status + " " + (r.status === 200 ? JSON.parse(r.text).ok : JSON.parse(r.text).error);
              tally[k] = (tally[k] || 0) + 1;
            }
            log({ step: "25 wrong guesses at the admin PIN, forged XFF/CF-Connecting-IP/True-Client-IP/X-Real-IP on each", tally });
            const bobHere = await call("POST", "/api/verify-pin", { metaKey, participantId: bob.id, pin: bob.pin });
            log({ step: "same runner, Bob's CORRECT PIN, no forging", status: bobHere.status, body: bobHere.text });
            const anaForged = await call("POST", "/api/verify-pin", { metaKey, participantId: ana.id, pin: ana.pin }, { forge: true });
            log({ step: "same runner, admin's CORRECT PIN with fresh forged headers", status: anaForged.status, body: anaForged.text });
            out("state", Buffer.from(JSON.stringify({ metaKey, slug, ana, bob, carla })).toString("base64"));
          })().catch((e) => { console.error(e); process.exit(1); });
          JS

  other-user:
    needs: attacker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        who: [bob, carla]
    steps:
      - name: Otro usuario, otra IP real
        env:
          STATE: ${{ needs.attacker.outputs.state }}
          WHO: ${{ matrix.who }}
        run: |
          node - <<'JS'
          const crypto = require("crypto");
          const B = process.env.SANDBOX;
          const st = JSON.parse(Buffer.from(process.env.STATE, "base64").toString());
          for (const p of [st.ana, st.bob, st.carla]) console.log("::add-mask::" + p.pin);
          const log = (o) => console.log("RESULT " + JSON.stringify(o));
          const vp = async (p, pinValue) => {
            const r = await fetch(B + "/api/verify-pin", { method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ metaKey: st.metaKey, participantId: p.id, pin: pinValue }), signal: AbortSignal.timeout(90000) });
            return r.status + " " + (await r.text());
          };
          (async () => {
            const me = st[process.env.WHO];
            log({ runner: process.env.WHO, publicIp: (await (await fetch("https://api.ipify.org")).text()).trim() });
            log({ step: "own CORRECT PIN", result: await vp(me, me.pin) });
            log({ step: "admin's CORRECT PIN (same quiniela the attacker hit)", result: await vp(st.ana, st.ana.pin) });
            for (let i = 0; i < 3; i++) { let g; do { g = String(crypto.randomInt(1000, 10000)); } while (g === me.pin); log({ step: "typo " + (i + 1), result: await vp(me, g) }); }
            log({ step: "own CORRECT PIN after 3 typos", result: await vp(me, me.pin) });
          })().catch((e) => { console.error(e); process.exit(1); });
          JS
