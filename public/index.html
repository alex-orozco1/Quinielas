  function blankMatch(){ return {id: uid("m"), teamA:"", teamB:""}; }

  // null, undefined and true/false are never a close, even if new Date() gives
  // them an instant (new Date(null) is 1970) — the same rule as the server.
  function realCloseValue(v){ return v !== null && v !== undefined && typeof v !== "boolean"; }
  function toLocalInputValue(iso){
    // No readable close (null, «pendiente»): the field starts empty, not 1970.
    if(!realCloseValue(iso) || !Number.isFinite(new Date(iso).getTime())) return "";
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  // MS2 · D4-02: the close a deadline field means. The field holds minutes and
  // a stored close may carry seconds; if the field still shows the stored one
  // (nobody edited it, also after going back or reloading), the stored ISO is
  // kept exactly — rounding it would change a question's close nobody touched.
  function deadlineIsoFromInput(value, originalIso){
    if(realCloseValue(originalIso) && Number.isFinite(new Date(originalIso).getTime()) && value === toLocalInputValue(originalIso)) return originalIso;
    return new Date(value).toISOString();
  }

  // UX fix: when the admin taps "Editar" on a round far down the list, the
  // editor re-renders at the TOP of `body`, but the viewport itself never
  // moved — the button looked like it did nothing, especially on mobile
  // with many imported jornadas. Scrolling only happens AFTER the async
  // re-render actually finishes (awaited, not timing-guessed), directly to
  // the editor card itself, so "Editando jornada N" always ends up visible.
  // UX-ADM-007: shared by both "Eliminar jornada" entry points (the
  // payment-blocked early-return branch and the normal branch) so a failed
  // delete never silently commits in the UI. The round object itself holds
  // its own matches/results/resultsPublished/customBetResults inline — no
  // separate structure elsewhere in meta references it by id — so
  // restoring the exact same object at its original array position is a
  // complete rollback, not a partial one.
  // MS2 · D3/D4: the tournament questions that close with a round. Changing
  // or reopening that round's deadline moves their closing too; deleting the
  // round leaves them without one. Said before it happens; nothing is blocked.
  // MS2 · D4: the tournament questions linked to a round — by its id; an old
  // question not migrated yet, by its number. Each keeps its own close: editing,
  // reopening or deleting the round never moves it by itself, and one that
  // already closed never reopens (the server refuses it, betCloses.js).
  function betsClosingWith(round){
    return (meta.customBets || []).filter(b => {
      if(!b || b.scope !== "temporada") return false;
      const c = betCloseInfo(b);
      return c.kind === "own" ? b.closesRoundId === round.id : (c.kind === "legacy" && b.closesAtRound === round.number);
    });
  }
  const quotedLabels = (bets) => bets.map(b => "«" + b.label + "»").join(", ");
  // An old question (not migrated yet) still closes by round number. Before
  // that round moves or goes, it records the close it has today as its own,
  // in the same save: an open one only if the admin chooses so (or when the
  // round is deleted); a closed one always, so it never reopens. The server
  // accepts only that exact time (betCloses.js).
  function closedLegacyBets(round){
    return betsClosingWith(round).filter(b => betCloseInfo(b).kind === "legacy" && customBetsLocked(b));
  }
  function linkedBetsNote(round, what){
    const bets = betsClosingWith(round);
    if(!bets.length) return "";
    const closed = bets.filter(b => customBetsLocked(b));
    const open = bets.filter(b => !customBetsLocked(b));
    let note = "";
    if(closed.length) note += `\n\n${closed.length === 1 ? "Esta pregunta del torneo ya cerró y sigue cerrada" : "Estas preguntas del torneo ya cerraron y siguen cerradas"}: ${quotedLabels(closed)}.`;
    const timed = open.filter(b => !noReadableClose(b)), untimed = open.filter(noReadableClose);
    if(timed.length && what === "delete"){
      note += `\n\n${timed.length === 1 ? "Esta pregunta del torneo conserva su cierre" : "Estas preguntas del torneo conservan su cierre"}: ${timed.map(b => "«" + b.label + "» (" + fmtWhenTz(new Date(betCloseInfo(b).at).toISOString()) + ")").join(", ")}. Si quieres otro, elígelo en Admin → Tus reglas.`;
    }
    if(untimed.length && what === "delete"){
      note += `\n\n${untimed.length === 1 ? "Esta pregunta del torneo no tiene una hora de cierre válida y sigue abierta" : "Estas preguntas del torneo no tienen una hora de cierre válida y siguen abiertas"}: ${quotedLabels(untimed)}. Elige su cierre en Admin → Tus reglas.`;
    }
    return note;
  }
  // D3/D4: what happens to the open questions that close with this round when
  // its close moves. null: the admin went back (nothing is saved); else what
  // to write with the round, in the same save (applyLinkedChoice): `move` —
  // their close follows the round; `relink` — an old question (not migrated)
  // gets this round as its own, by id, and so its new close; `freeze` — an
  // old one keeps the close it has today, now as its own (`keepAt`). All
  // empty when there is nothing to decide. The server refuses any other
  // change to an old question's close (bet_close_legacy).
  async function chooseLinkedBetsClose(round, nextIso, intro){
    const nextMs = new Date(nextIso).getTime();
    const none = { move: [], relink: [], freeze: [], keepAt: round.deadline };
    const linked = betsClosingWith(round);
    if(!linked.length || nextMs === new Date(round.deadline).getTime()) return none;
    none.freeze = closedLegacyBets(round);
    const closed = linked.filter(b => customBetsLocked(b));
    const open = linked.filter(b => !customBetsLocked(b) && (betCloseInfo(b).kind === "own" || betCloseInfo(b).kind === "legacy"));
    // An old question whose round has no readable close (null, «pendiente»)
    // has no current close to keep: it can only close with this round, from
    // its first real close. Nothing is invented for it (no 1970).
    const unknown = open.filter(noReadableClose);
    const own = open.filter(b => !unknown.includes(b));
    const newWhen = fmtWhenTz(new Date(nextMs).toISOString());
    let msg = intro || `El nuevo cierre de la Jornada ${round.number} será ${newWhen}.`;
    if(closed.length) msg += `\n\n${closed.length === 1 ? "Esta pregunta del torneo ya cerró y sigue cerrada" : "Estas preguntas del torneo ya cerraron y siguen cerradas"}: ${quotedLabels(closed)}. No se vuelven a abrir.${closed.some(noReadableClose) ? " Como su jornada no tenía una hora de cierre válida, queda cerrada desde ahora." : ""}`;
    if(unknown.length) msg += `\n\n${unknown.length === 1 ? "Esta pregunta del torneo no tenía una hora de cierre válida y cerrará" : "Estas preguntas del torneo no tenían una hora de cierre válida y cerrarán"} con esta jornada, el ${newWhen}: ${quotedLabels(unknown)}.`;
    if(!own.length){
      const ok = await qzConfirm(msg, { title: `¿Cambiar el cierre de la Jornada ${round.number}?`, confirmLabel: "Guardar cambios", cancelLabel: "Volver", destructive: false });
      return ok ? { ...none, relink: unknown } : null;
    }
    msg += `\n\n${own.length === 1 ? "Esta pregunta del torneo cierra con esta jornada" : "Estas preguntas del torneo cierran con esta jornada"}: ${own.map(b => "«" + b.label + "» (cierre actual: " + fmtWhenTz(new Date(betCloseInfo(b).at).toISOString()) + ")").join(", ")}.`;
    const choice = await qzChoose(msg, {
      title: `¿Cambiar el cierre de la Jornada ${round.number}?`,
      legend: own.length === 1 ? "¿Y el cierre de esa pregunta?" : "¿Y el cierre de esas preguntas?",
      options: [
        { value: "move", label: `Moverlo también: ${own.length === 1 ? "cierra" : "cierran"} el ${newWhen}` },
        { value: "keep", label: `Dejarlo como está: ${own.length === 1 ? "conserva su" : "conservan su"} cierre actual` },
      ],
      confirmLabel: "Guardar cambios", cancelLabel: "Volver",
    });
    if(choice === null) return null;
    const isOwn = (b) => betCloseInfo(b).kind === "own";
    return choice === "move"
      ? { ...none, move: own.filter(isOwn), relink: own.filter(b => !isOwn(b)).concat(unknown) }
      : { ...none, relink: unknown, freeze: none.freeze.concat(own.filter(b => !isOwn(b))) };
  }
  // Writes that choice onto the questions, next to the round's new close.
  // A real close, as the server reads it (realDeadlineMs in betCloses.js).
  function validInstantIso(v){ return realCloseValue(v) && Number.isFinite(new Date(v).getTime()); }
  // An old question (not migrated) whose round has no readable close.
  function noReadableClose(b){ const c = betCloseInfo(b); return c.kind === "legacy" && c.at == null && !!c.round; }
  function applyLinkedChoice(choice, round, nextIso){
    choice.move.forEach(b => { b.closesAt = nextIso; });
    choice.relink.forEach(b => { b.closesRoundId = round.id; });
    // Only a readable close is kept; without one nothing is written and the
    // server says what it protects (new Date(null) would be 1970).
    if(validInstantIso(choice.keepAt)) choice.freeze.forEach(b => { b.closesAt = new Date(choice.keepAt).toISOString(); });
  }
  async function deleteRoundWithRollback(btn, roundId){
    const roundToDelete = meta.rounds.find(r => r.id === roundId);
    const linkedNote = roundToDelete ? linkedBetsNote(roundToDelete, "delete") : "";
    if(!(await qzConfirm(`Se van a borrar los partidos y cualquier resultado capturado en esta jornada. Esta acción no se puede deshacer.${linkedNote}`, { title: "¿Eliminar esta jornada?", confirmLabel: "Eliminar" }))) return;
    const snapshot = meta.rounds.slice();
    // MS2 · D4: an old question (not migrated) that closes with this round
    // keeps that close, now as its own; without it the server refuses the
    // delete (bet_close_legacy) instead of leaving it without a close.
    const betsSnapshot = JSON.parse(JSON.stringify(meta.customBets || []));
    if(roundToDelete && validInstantIso(roundToDelete.deadline)) betsClosingWith(roundToDelete).filter(b => betCloseInfo(b).kind === "legacy")
      .forEach(b => { b.closesAt = new Date(roundToDelete.deadline).toISOString(); });
    // Payment-penalty persistence (P1, QA-corrected): deleting a round must
    // not silently erase a penalty it already caused -- reconcile
    // (promote it into each unpaid participant's permanent ledger) BEFORE
    // it's removed from meta.rounds. penaltyPointsFor() already knows how
    // to keep counting a ledgered round even after it's gone from
    // meta.rounds entirely.
    const participantsSnapshot = JSON.parse(JSON.stringify(meta.participants));
    reconcilePenaltyLedger(meta);
    btn.disabled = true;
    meta.rounds = meta.rounds.filter(r => r.id !== roundId);
    const result = await setMetaWithError(meta);
    if(result.ok){
      clearRoundDraft("edit:" + roundId); // #35: an unsaved edit of a round that is gone
      renderAdmin(document.getElementById("qz-main"));
    }else{
      btn.disabled = false;
      // Tras un 409 la pestaña ya tiene el estado del servidor (ver
      // setMetaWithError): reponer el arreglo viejo revertiría cualquier jornada.
      if(!result.reconciled){
        meta.rounds = snapshot;
        meta.participants = participantsSnapshot;
        meta.customBets = betsSnapshot;
      }
      toast(humanizeError(result.error, result));
    }
  }

  async function openRoundEditor(body, roundId){
    // #35: moving to another round abandons the edit in progress, as it
    // always did, and its saved copy goes with it.
    const previousId = renderAdminRondas._editingId;
    if(previousId && previousId !== roundId) clearRoundDraft("edit:" + previousId);
    renderAdminRondas._editingId = roundId;
    renderAdminRondas._draft = null;
    await renderAdminRondas(body);
    const formEl = document.getElementById("qz-round-form");
    if(!formEl) return;
    // scrollIntoView({block:"start"}) alone landed the editor's top edge
    // exactly where the viewport's top edge is — but .qz-header is
    // position:sticky, so it stays pinned on top of that same spot,
    // covering "Editando jornada N" and however many pixels of the form
    // below it the real (not assumed) header height happens to be. Measured
    // live via getBoundingClientRect() (forces an accurate layout read, no
    // stale/zero values, no requestAnimationFrame needed) so this stays
    // correct across desktop/mobile header heights without a magic number
    // for the offset itself — only a small fixed breathing-room margin.
    const headerEl = document.querySelector("#quiniela-root .qz-header");
    const headerHeight = headerEl ? headerEl.getBoundingClientRect().height : 0;
    const BREATHING_ROOM_PX = 12;
    const targetTop = formEl.getBoundingClientRect().top + window.scrollY - headerHeight - BREATHING_ROOM_PX;
    window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
  }

    // MON-002B: the form is always offered. The limit is the server's to

    // the paywall is rendered from ITS answer (see showUpgradeSheet).
    const createCardHtml = `
      <div class="card" id="qz-round-form">
        <div class="eyebrow">${editingRound ? `Editando jornada ${esc(editingRound.number)}` : `Crear jornada ${nextNumber}`}</div>

        ${editingRound && editingRound.resultsPublished ? `<p class="muted" style="color:var(--red);">Esta jornada ya tiene resultados publicados. Si cambias los equipos, los resultados guardados podrían dejar de tener sentido — revísalos después de guardar.</p>` : ``}

        const row = Array.from(document.querySelectorAll("#qz-match-rows [data-mid]")).find(r => r.dataset.mid === rowsCheck.partial.id);
        showRowError(row, "qz-rm-err-" + rowsCheck.partial.id, rowsCheck.missing, PARTIAL_ROW_MESSAGE);
        return;
      }
      const clean = rowsCheck.clean;
      if(!rowsCheck.complete){ toast("Agrega al menos un partido con ambos equipos"); return; }
      if(!draft.deadline){ toast("Selecciona la fecha y hora límite"); return; }
      // Same rule, same helper as Admin Setup Continuity's own screens --
      // reused directly rather than duplicated. `min` above is a UX hint
      // only; this is the real guard, checked at the moment of the click
      // against serverNow() (not the value `min` had when the form first

      // CASE F).
      const deadlineErrorEl = document.getElementById("qz-deadline-error");
      if(!isSetupDeadlineValid(draft.deadline, serverNow())){
        deadlineErrorEl.textContent = "Elige una fecha y hora a partir de ahora.";
        deadlineErrorEl.style.display = "block";
        return;
      }
      deadlineErrorEl.style.display = "none";

      // MS2 · D3/D4: an explicit choice for the questions that close with it.
      const linkedChoice = editingRound ? await chooseLinkedBetsClose(editingRound, deadlineIsoFromInput(draft.deadline, editingRound.deadline)) : null;
      if(editingRound && !linkedChoice) return;
      if(editingRound){
        const saveBtn = document.getElementById("qz-publish-round");
        // Deep snapshot of the ENTIRE round object -- not just matches/
        // deadline. Whatever other fields it carries (published, provider,
        // externalRoundId, results, resultsPublished, customBetResults,
        // kickoffAt/externalEventId on individual matches, etc.) must all
        // come back exactly as they were if the save fails. A shallow
        // matches+deadline-only rollback would silently lose any of that.
        const roundSnapshot = JSON.parse(JSON.stringify(editingRound));
        // reconcilePenaltyLedger() (payment-penalty persistence) can mutate
        // MULTIPLE participants' permanent ledgers before the deadline
        // moves -- a full rollback on failure needs the whole participants
        // array too, so the round-edit + its related reconciliation is
        // atomic from the admin's point of view: either both persist, or
        // neither does.
        const participantsSnapshot = JSON.parse(JSON.stringify(meta.participants));
        const betsSnapshot = JSON.parse(JSON.stringify(meta.customBets || []));
        saveBtn.disabled = true;
        // Payment-penalty persistence (P1, QA-corrected): editing a round's
        // deadline could move it back into the future, exactly the kind of
        // non-monotonic change that must never retroactively erase an
        // already-caused penalty -- reconcile BEFORE the deadline moves.
        reconcilePenaltyLedger(meta);
        editingRound.matches = clean;
        editingRound.deadline = deadlineIsoFromInput(draft.deadline, editingRound.deadline);
        lgApplyEditor(editingRound, lgEditorState(editingRound));
        applyLinkedChoice(linkedChoice, editingRound, editingRound.deadline);
        const result = await setMetaWithError(meta);
        if(result.ok){
          clearRoundDraft(draftKind);
          if(isLg(editingRound)) toast("✅ Listo, " + roundTitle(editingRound) + " quedó actualizada.");
          else toast("✅ Listo, la Jornada " + editingRound.number + " quedó actualizada.");
          renderAdminRondas._editingId = null;
          renderAdminRondas._draft = null;
          renderAdminRondas._lgForm = null;
          renderAdmin(document.getElementById("qz-main"));
        } else {
          // Full rollback: the round goes back to its exact pre-edit
          // snapshot (every field, not just matches/deadline), and the
          // participants array goes back too (undoing whatever
          // reconciliation just did) -- never a partial revert.
          if(!result.reconciled){ meta.rounds = meta.rounds.map(r => r.id === editingRound.id ? roundSnapshot : r); meta.participants = participantsSnapshot; meta.customBets = betsSnapshot; }
          // Force the form to rebuild from the restored round on the next
          // render, instead of showing the failed edit as if it had stuck.
          renderAdminRondas._draft = null;
          clearRoundDraft(draftKind); // #35: or the rebuild would bring it back
          showPlanBlock(result);
          if(!result.reconciled) renderAdminRondas(body); // stay in edit mode (_editingId untouched) -- fresh, re-enabled button, ready to retry
          else renderAdmin(document.getElementById("qz-main"));
        }
        return;
      }

      // Onboarding B: only a NEW round publishes; editing never does.
      const publishRow = document.getElementById("qz-publish-round").parentElement;
      // Liguilla: «Guardar borrador» crea la jornada sin publicarla; publicar
      // pasa por las reglas de liguilla (un solo flujo, lgPublishGate).
      const lgNew = lgNewRoundFields(nextNumber, clean);
      if(!(await lgNew.gate)) return;
      if(!(await gateFirstPublish(publishRow, "before"))) return;
      if(dropIfAlreadyPublished(clean)){ renderAdminRondas._draft = null; renderAdmin(document.getElementById("qz-main")); return; } // #35
      const isFirstRoundEver = meta.rounds.length === 0;
      const round = {
        id: uid("r"),
        number: nextNumber,
        matches: clean,
        deadline: new Date(draft.deadline).toISOString(),
        results: {},
        resultsPublished: false,
        published: true // manual rounds are visible to participants immediately, same as always — see AUTO-001
      };
      lgNew.apply(round);
      meta.rounds.push(round);
      // MON-001A: upgraded from the boolean-only setMeta() to
      // setMetaWithError() -- this is the primary way an admin creates
      // rounds 2+ (round 1 goes through Admin Setup Continuity's own
      // already-upgraded handlers), so it's the main real-world place a
      // plan's round limit gets hit day to day. A generic "No se pudo
      // guardar" with no rollback was already a latent gap; closing it
      // here is what lets the new limit rejection show a precise,
      // friendly message instead of a dead-end retry loop.
      const result = await setMetaWithError(meta);
      if(result.ok){
        if(lgNew.publishing) await lgAfterPublish();
        renderAdminRondas._lgForm = null;
        toast(lgNew.draftOnly ? "✅ Borrador guardado. Publícalo desde la lista cuando esté listo."
          : "✅ " + (lgNew.publishing ? roundTitle(round) : "La Jornada " + nextNumber) + " está abierta. Cierra el " + fmtWhenTz(round.deadline) + ".", 5000);
        if(isFirstRoundEver){
          trackOnceConfirmed(
            "first_round_" + SLUG,
            () => hasTrackedFirstRound(SLUG),
            () => markFirstRoundTracked(SLUG),
            "first_round_published",
            { source: "admin_rondas" }
          );
        }
        clearRoundDraft("new");
        renderAdminRondas._draft = null;
        renderAdmin(document.getElementById("qz-main"));
      } else {
        // Roll back the optimistic push -- the admin's typed matches/
        // deadline stay in the (still-open) form via renderAdminRondas._draft,
        // exactly like every other failure path in this same function.
        meta.rounds = meta.rounds.filter(r => r.id !== round.id);
        if(result.error === "admin_password_required"){
          meta.ownerPasswordSet = false;
          await gateFirstPublish(publishRow, "before");
          return;
        }
        // MON-002B: a real paywall, built from the server's own refusal,
        // instead of a toast that named a number and offered no way forward.
        showPlanBlock(result);
      }
    });

    const lgDraftBtn = document.getElementById("qz-lg-save-draft");
    if(lgDraftBtn) lgDraftBtn.addEventListener("click", () => { renderAdminRondas._lgDraftOnly = true; document.getElementById("qz-publish-round").click(); });
    body.querySelectorAll("[data-del-round]").forEach(btn => {
      btn.addEventListener("click", () => deleteRoundWithRollback(btn, btn.dataset.delRound));
    });

  let sportsdbTeamsCache = null; // {leagueId, teams}
  async function fetchSportsdbTeams(leagueId){
    if(!leagueId) return [];
    if(sportsdbTeamsCache && sportsdbTeamsCache.leagueId === leagueId) return sportsdbTeamsCache.teams;
    const fallback = SPORTSDB_FALLBACK_TEAMS[leagueId] || [];
    const leagueName = SPORTSDB_LEAGUE_NAMES[leagueId];
    if(!leagueName){
      // A league id we don't have a name mapping for — nothing to query by
      // name, so go straight to whatever local fallback exists (if any).
      sportsdbTeamsCache = { leagueId, teams: fallback };
      return fallback;
    }
    try{
      const url = `https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l=${encodeURIComponent(leagueName)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if(!data || !Array.isArray(data.teams)) throw new Error("respuesta sin lista de equipos");
      // Belt-and-suspenders: only keep teams the API itself tags as belonging
      // to the league we asked about — a name search can occasionally surface
      // near-matches from a differently-numbered league.
      const teams = data.teams
        .filter(t => t && t.strTeam && String(t.idLeague) === String(leagueId))
        .map(t => t.strTeam)
        .sort((a,b) => a.localeCompare(b, "es"));
      if(!teams.length) throw new Error("ningún equipo válido para esta liga");
      sportsdbTeamsCache = { leagueId, teams };
      return teams;
    }catch(e){
      console.error("fetchSportsdbTeams failed, usando respaldo local", e);
      sportsdbTeamsCache = { leagueId, teams: fallback };
      return fallback;
    }
  }

  // DATA-001: this used to call TheSportsDB V1 directly from the browser
  // with the public free key "123" (eventsseason.php), which truncates to
  // 15 events regardless of season size — any jornada past round 1-2 was
  // silently unreachable. Now goes through QRACKS's own backend, which
  // talks to TheSportsDB V2 server-side (key never leaves the server) and
  // does the round-matching itself — see sportsDataProvider.js.
  //
  // Returns pre-computed suggestions ({ matchId, score, result, date }),
  // not raw provider events, and a reliabilityState instead of throwing on
  // provider hiccups — a failed lookup here must never block manual capture.
  async function fetchSportsResults(roundId){
    const res = await fetch(`/api/quinielas/${encodeURIComponent(SLUG)}/rounds/${encodeURIComponent(roundId)}/sports-results`, {
      headers: setAuthHeaders({}, adminOrOwnerCred()),
      credentials: "same-origin"
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return await res.json(); // { ok, reliabilityState, suggestions }
  }

  // NOTE: team-name fuzzy matching (formerly normalizeTeamName/teamsMatch)
  // and the season-wide result search (formerly findAutoResult) moved to
  // the backend as part of DATA-001 — see sportsDataProvider.js. This file
  // only ever consumes pre-matched suggestions from /sports-results now.


  // AUTO-002 (bulk validation round): shared by the per-round "Buscar
  // resultados automáticos" button and the new "buscar en todas las
  // pendientes" flow below, so both populate suggestion tags identically —
  // never touches source/picks/draftResults directly, only shows a
  // suggestion the admin must still click to accept, same as always.
  // DATA-004 §6. Por qué un partido necesita atención tras importar. Sin
  // lenguaje técnico: nada de round_id, stage_id, JSON ni códigos. Y sin
  // convertir lo normal en alarma — un cruce que todavía no tiene rival es
  // exactamente lo que pasa en una fase final, no un fallo.
  const SYNC_DIAGNOSTIC_COPY = {
    missing_fixture_id: "Un partido llegó sin identificar y no se pudo guardar.",
    duplicate_fixture_id: "Un partido venía repetido; se guardó una sola vez.",
    missing_kickoff: "Hay partidos sin horario todavía. Los guardamos y aparecerán en cuanto se confirme la fecha.",
    malformed_kickoff: "Un partido traía una fecha que no pudimos leer.",
    ungroupable_fixture: "Un partido no se pudo acomodar en ninguna jornada. Puedes crearla a mano.",
    round_number_taken: "Ya tenías una jornada con ese número: la respetamos y guardamos aparte los partidos del calendario para esa jornada, para que no se pierdan.",
    locked_by_results: "Cambiaron los equipos de una jornada que ya tiene resultados publicados. No los tocamos — revísala.",
    kickoff_past_deadline: "Movieron el horario de un partido para después del cierre de su jornada. Revisa la fecha límite.",
    round_already_scored: "Apareció un partido nuevo en una jornada que ya tiene resultados. No lo agregamos — revísala.",
    round_already_closed: "Apareció un partido nuevo en una jornada que ya cerró. No lo agregamos, para no pedir un pronóstico imposible.",
    staged_gained_round: "Un partido pendiente ya tiene jornada asignada.",
    unattributable_fixture: "Hay un partido antiguo que no pudimos relacionar con el calendario nuevo. Lo dejamos como está — revísalo si algo no cuadra.",
    cross_provider_id: "Encontramos un partido que se parece a otro que ya tenías. Lo agregamos aparte para no mezclarlos: revisa si está repetido.",
    ambiguous_placement: "Llegó un partido de liguilla que podría ir en más de una jornada. Lo dejamos en «Pendientes de colocar» para que elijas tú.",
    liguilla_round_published: "Llegó un partido nuevo para una jornada de liguilla ya publicada. No lo agregamos a esa jornada: quedó en «Pendientes de colocar».",
  };
  function syncDiagnosticCopy(code){
    return SYNC_DIAGNOSTIC_COPY[code] || "Hay un partido que necesita tu revisión.";
  }
  // Motivos que son INFORMATIVOS, no problemas. No pintan la alerta en ámbar ni
  // piden acción: sólo se cuentan.
  const SYNC_BENIGN = new Set(["round_number_taken", "staged_gained_round", "duplicate_fixture_id"]);

  // DATA-004C. Por qué un partido encontrado no trae resultado sugerido. El
  // caso que importa es el de una eliminatoria: QRACKS puntúa el 1X2 a los 90
  // minutos, así que un partido resuelto en tiempo extra o en penales NO se
  // autocompleta — se pide capturarlo. El mensaje explica la regla en vez de
  // dejar al Admin pensando que el buscador falló.
  const UNSCORABLE_COPY = {
    penalties_present: "Se definió en penales — captúralo tú. QRACKS cuenta el resultado a los 90 minutos.",
    extra_time_present: "Se definió en tiempo extra — captúralo tú. QRACKS cuenta el resultado a los 90 minutos.",
    unknown_score_phase: "El marcador llegó incompleto — mejor captúralo tú.",
    duplicate_conflict: "El marcador llegó incompleto — mejor captúralo tú.",
    incomplete_phase: "El marcador llegó incompleto — mejor captúralo tú.",
    no_score_records: "Todavía no hay marcador para este partido.",
    // QA-03: se encontró el partido y hay marcador, pero no se pudo demostrar
    // cuál de los dos equipos jugó de local. Sugerir sin eso es sugerir el
    // ganador al azar, así que se pide captura manual.
    orientation_not_proven: "No pudimos confirmar quién jugó de local — captúralo tú.",
  };
  function unscorableCopy(reason){
    return UNSCORABLE_COPY[reason] || "No pudimos confirmar el resultado a los 90 minutos — captúralo tú.";
  }

  function applySuggestionsToForm(round, suggestions, form, statusEl, unscorable){
    const suggestionsByMatch = {};
    (suggestions || []).forEach(s => { suggestionsByMatch[s.matchId] = s; });
    const unscorableByMatch = {};
    (unscorable || []).forEach(u => { unscorableByMatch[u.matchId] = u; });
    let found = 0;
    let blocked = 0;
    round.matches.forEach(m => {
      const hit = suggestionsByMatch[m.id];
      const tag = document.getElementById("qz-suggest-" + m.id);
      if(!tag) return;
      if(hit){
        found++;
        const niceDate = new Date(hit.date).toLocaleDateString("es-MX", {day:"2-digit", month:"short", year:"numeric"});
        tag.innerHTML = `Sugerido: <strong>${esc(hit.score)}</strong> (${niceDate}) <button type="button" class="btn btn-gold btn-sm" data-accept-suggestion="${esc(m.id)}" data-suggested-val="${hit.result}" style="margin-left:6px;">✓ Usar este resultado</button>`;
        tag.style.color = "var(--pitch-light)";
      } else if(unscorableByMatch[m.id]){
        // Se encontró el partido, pero su resultado no puede alimentar el 1X2.
        // Decirlo es la diferencia entre "no apareció" y "apareció y no se
        // puede usar" — que para el Admin son dos cosas muy distintas.
        blocked++;
        tag.textContent = unscorableCopy(unscorableByMatch[m.id].reason);
        tag.style.color = "var(--gold)";
      } else {
        tag.textContent = "Sin resultado automático todavía";
        tag.style.color = "var(--ink-soft)";
      }
    });
    if(statusEl){
      const blockedTxt = blocked ? ` ${blocked} partido${blocked===1?"":"s"} hay que capturarlo${blocked===1?"":"s"} a mano.` : "";
      statusEl.textContent = (found
        ? `${found} de ${esc(round.matches.length)} partidos encontrados. Revisa y confirma antes de guardar.`
        : "No se encontraron resultados todavía para esta jornada — puede que los partidos no se hayan jugado aún. Puedes capturarlos manualmente.") + blockedTxt;
    }
    form.querySelectorAll("[data-accept-suggestion]").forEach(btn => {
      btn.addEventListener("click", () => {
        const matchId = btn.dataset.acceptSuggestion;
        const val = btn.dataset.suggestedVal;
        const row = form.querySelector(`.pick-row[data-result-match="${matchId}"]`);
        const targetBtn = row ? row.querySelector(`[data-val="${val}"]`) : null;
        if(targetBtn) targetBtn.click();
      });
    });
    return found;
  }

  async function renderAdminResultados(body){
    // AUTO-001.1 Admin lifecycle fix (FIX 1): a round that's published:false
    // is PREPARED, not yet part of the game — it must never be selectable,
    // draftable, or a default target here, same published !== false rule
    // used everywhere else (visibleRounds(), Participación, etc.).
    // published === undefined stays eligible (legacy compatibility).
    // Admin -> Jornadas is intentionally untouched — it still reads
    // meta.rounds directly and shows everything, including prepared ones.
    const eligibleRounds = meta.rounds.filter(r => r.published !== false);
    const candidateRounds = eligibleRounds.filter(r => !r.resultsPublished);
    const closedRounds = eligibleRounds.filter(r => r.resultsPublished);
    if(!candidateRounds.length && !closedRounds.length){
      body.innerHTML = `<div class="card empty"><div class="display">No hay jornadas todavía</div><p class="muted">Crea una jornada primero en Admin → Jornadas.</p></div>`;
      return;
    }
    let target = renderAdminResultados._target;
    if(!target && candidateRounds.length) target = candidateRounds[candidateRounds.length-1].id;
    body.innerHTML = `
      <div class="card">
        <div class="eyebrow" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <span>Elige la jornada</span>
          <button class="btn btn-ghost btn-sm" id="qz-bulk-autofill">🔎 Buscar resultados pendientes (todas)</button>
        </div>
        <select id="qz-round-select">
          ${eligibleRounds.slice().reverse().map(r => `<option value="${esc(r.id)}" ${r.id===target?'selected':''}>${esc(roundTitle(r))}${roundSubtitle(r) ? " · " + esc(roundSubtitle(r)) : ""} ${r.resultsPublished?(isLg(r) && r.matchStatus && Object.values(r.matchStatus).some(v => v === "pending" || v === "postponed") ? '(parcial)' : '(ya capturada)'):''}</option>`).join("")}
        </select>
        <p class="muted" id="qz-bulk-autofill-status" style="margin-top:8px;margin-bottom:-4px;"></p>
      </div>
      <div id="qz-results-form"></div>
    `;
    const select = document.getElementById("qz-round-select");
    select.addEventListener("change", () => {
      renderAdminResultados._target = select.value;
      renderAdminResultados(body);
    });
    const bulkBtn = document.getElementById("qz-bulk-autofill");
    if(bulkBtn) bulkBtn.addEventListener("click", async () => {
      const bulkStatusEl = document.getElementById("qz-bulk-autofill-status");
      bulkBtn.disabled = true;
      bulkStatusEl.textContent = "Buscando resultados pendientes en todas las jornadas…";
      try{
        const res = await fetch(`/api/quinielas/${encodeURIComponent(SLUG)}/sports-results`, {
          headers: setAuthHeaders({}, adminOrOwnerCred()), credentials: "same-origin"
        });
        const data = await res.json();
        if(!res.ok || !data.ok || data.reliabilityState){
          bulkStatusEl.textContent = "⚠️ " + sportsDataFailureMessage(data.reliabilityState);
        } else {
          renderAdminResultados._bulkCache = data.results || {};
          renderAdminResultados._bulkUnscorable = data.unscorable || {};
          const roundIdsWithHits = Object.keys(renderAdminResultados._bulkCache).filter(id => (renderAdminResultados._bulkCache[id] || []).length);
          bulkStatusEl.textContent = roundIdsWithHits.length
            ? `Se encontraron resultados para ${esc(roundIdsWithHits.length)} jornada${roundIdsWithHits.length===1?"":"s"} pendiente${roundIdsWithHits.length===1?"":"s"}. Selecciónala${roundIdsWithHits.length===1?"":"s"} arriba para revisar y confirmar.`
            : "No se encontraron resultados nuevos para las jornadas pendientes por ahora.";
          // If the round currently open already got resolved by this bulk
          // pass, show it immediately — no need to click the per-round
          // button too. Never overwrites anything the admin already picked.
          if(select.value && renderAdminResultados._bulkCache[select.value]){
            const currentForm = document.getElementById("qz-results-form");
            const currentRound = meta.rounds.find(r => r.id === select.value);
            if(currentForm && currentRound) applySuggestionsToForm(currentRound, renderAdminResultados._bulkCache[select.value], currentForm, document.getElementById("qz-autofill-status"), (renderAdminResultados._bulkUnscorable || {})[select.value]);
          }
        }
      }catch(e){
        console.error(e);
        bulkStatusEl.textContent = "⚠️ " + sportsDataFailureMessage(null);
      }
      bulkBtn.disabled = false;
    });
    if(!select.value) return;
    const round = meta.rounds.find(r => r.id === select.value);
    renderAdminResultados._target = round.id;
    const jornadaBets = (meta.customBets || []).filter(b => b.scope === "jornada");
    if(jornadaBets.length) await ensureAllPicksLoaded();
    const sortedParticipantsForJornadaBets = meta.participants.slice().sort((a,b) => a.name.localeCompare(b.name, "es", {sensitivity:"base"}));
    const form = document.getElementById("qz-results-form");
    // Compartido por la fase regular y la liguilla (sprint de liguilla).
    function jornadaBetsCardHtml(){
      if(!jornadaBets.length) return "";
      return `
        <div class="card" style="padding:8px 12px;overflow-x:auto;">
          <div class="qz-sec-head" style="padding:10px 12px 0;"><div class="eyebrow">Calificar preguntas de la Jornada ${esc(round.number)}</div>${helpLinkHtml("resultados.calificar")}</div>
          <div style="padding:0 12px;">${helpBlockHtml("resultados.calificar")}</div>
          <p class="muted" style="padding:0 12px;margin-top:-4px;">Al marcar «¿Atinó?», ${esc(markedPointsWhen())}. Desliza hacia los lados para ver todas — el nombre se queda fijo.</p>
          <table>
            <thead>
              <tr>
                <th class="qz-sticky-col">Participante</th>
                ${jornadaBets.map(bet => `<th colspan="2" class="qz-bet-th" style="text-align:center;">${esc(bet.label)}</th>`).join("")}
              </tr>
              <tr>
                <th class="qz-sticky-col"></th>
                ${jornadaBets.map(() => `<th style="text-align:center;">Respondió</th><th style="text-align:center;">¿Atinó?</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${sortedParticipantsForJornadaBets.map(p => `
                <tr>
                  <td class="qz-sticky-col">${esc(p.name)}</td>
                  ${jornadaBets.map(bet => {
                    const guess = ((allPicksCache[p.id] || {})[round.id] || {}).__extra ? (allPicksCache[p.id][round.id].__extra[bet.id] || "") : "";
                    const correct = round.customBetResults && round.customBetResults[bet.id] ? round.customBetResults[bet.id][p.id] : false;
                    return `
                      <td style="text-align:center;">${guess ? esc(guess) : '<span class="muted">—</span>'}</td>
                      <td style="text-align:center;"><input type="checkbox" data-role="jornada-bet-correct" data-pid="${esc(p.id)}" data-bet="${esc(bet.id)}" ${correct ? "checked" : ""} ${guess ? "" : "disabled"}></td>
                    `;
                  }).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
`;
    }
    function wireJornadaBetsGrade(){
      form.querySelectorAll("[data-role=jornada-bet-correct]").forEach(checkbox => {
        checkbox.addEventListener("change", async () => {
          const pid = checkbox.dataset.pid;
          const betId = checkbox.dataset.bet;
          if(!round.customBetResults) round.customBetResults = {};
          if(!round.customBetResults[betId]) round.customBetResults[betId] = {};
          round.customBetResults[betId][pid] = checkbox.checked;
          const ok = await setMeta(meta);
          if(!ok){ checkbox.checked = !checkbox.checked; round.customBetResults[betId][pid] = checkbox.checked; toast("No se pudo guardar, intenta de nuevo"); }
          else if(checkbox.checked) markHelpLearned("resultados.calificar", "reglas.extras");
        });
      });
    }
    function appendResultsLog(){
      const logEntries = (meta.auditLog || []).slice().reverse().slice(0, 20);
      if(logEntries.length){
        const logDiv = document.createElement("div");
        logDiv.className = "card";
        logDiv.innerHTML = `
          <div class="eyebrow">Bitácora de resultados</div>
          <p class="muted" style="margin-top:-4px;">Quién cambió qué y cuándo — las últimas ${esc(logEntries.length)}.</p>
          <table>
            <tbody>
              ${logEntries.map(e => `
                <tr>
                  <td class="muted" style="white-space:nowrap;">${new Date(e.ts).toLocaleString("es-MX", {dateStyle:"short", timeStyle:"short"})}</td>
                  <td><strong>${esc(e.admin)}</strong></td>
                  <td>${esc(e.action)}</td>
                  <td class="muted">${esc(e.detail)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        body.appendChild(logDiv);
      }
    }
    // Liguilla (D2): estados por partido, marcador y publicación parcial.
    if(isLg(round)){
      renderLiguillaResultados(body, form, round, jornadaBetsCardHtml(), () => { wireJornadaBetsGrade(); wireHelp(form, () => renderAdminResultados(body)); });
      appendResultsLog();
      return;
    }

    const VALID_RESULTS = ["A", "D", "B"];
    const isPublished = !!round.resultsPublished;
    // AUTO-001.1 Admin lifecycle fix (FIX 2): official results can't be
    // published for the FIRST time while the round is still open (deadline
    // hasn't passed) — that would let PUBLISHED/OPEN jump straight to
    // RESULTS PUBLISHED, skipping CLOSED, while picks could still be
    // changing. Corrections of an already-published round are exempt —
    // isRoundLocked() is the same "closed" definition already used
    // everywhere else (picks blocking, classifyRound), not a new concept.
    const stillOpenForVoting = !isPublished && !isRoundLocked(round);
    // Badge display only ("Sin resultados" vs "Borrador guardado") —
    // snapshotted once per round so the local mutation just below (needed so
    // a click has somewhere real to persist to across re-renders) doesn't
    // retroactively make an unpublished round look like it was already saved.
    if(round._hadSavedDraftChecked === undefined) round._hadSavedDraftChecked = round.draftResults != null;
    const hadSavedDraft = round._hadSavedDraftChecked;
    // Functional state — whether a draft object exists to edit RIGHT NOW.
    // Live, not snapshotted: starting or canceling a correction needs this to
    // flip immediately within the same session, not wait for a real save.
    let hasDraft = round.draftResults != null;
    if(!isPublished && !hasDraft){
      // First-time capture: give it a real draft object now, so clicking a
      // pick button mutates round.draftResults directly, not a throwaway copy.
      round.draftResults = {};
      hasDraft = true;
    }
    const correcting = isPublished && hasDraft;
    // What the pick buttons actually show/edit right now — null means "published,
    // nothing being corrected", i.e. a read-only view of the live results.
    const editable = !isPublished ? round.draftResults : (hasDraft ? round.draftResults : null);
    const source = editable || round.results || {};
    const isComplete = round.matches.length > 0 && round.matches.every(m => VALID_RESULTS.includes(source[m.id]));
    const missingMatches = round.matches.filter(m => !VALID_RESULTS.includes(source[m.id]));

    form.innerHTML = `
      <div class="card">
        <p style="margin:0 0 12px;">
          ${isPublished
            ? `<span class="badge paid" style="font-size:13px;padding:5px 10px;">🟢 Resultados oficiales publicados</span>`
            : (hadSavedDraft
              ? `<span class="badge unpaid" style="font-size:13px;padding:5px 10px;">🟡 Borrador guardado (sin publicar)</span>`
              : `<span class="badge" style="font-size:13px;padding:5px 10px;">⚪ Sin resultados capturados todavía</span>`)}
          ${correcting ? `<span class="badge unpaid" style="margin-left:6px;">✏️ Corrigiendo — lo publicado no cambia hasta que confirmes</span>` : ``}
        </p>
        <div class="eyebrow" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <span>Jornada ${esc(round.number)} — resultado de cada partido</span>
          ${editable ? `<button class="btn btn-ghost btn-sm" id="qz-autofill">🔎 Buscar resultados automáticos</button>` : ``}
        </div>
        <p class="muted" id="qz-autofill-status" style="margin-top:-4px;"></p>
        ${round.matches.map(m => `
          <div class="match-card" style="margin-bottom:10px;" id="qz-rescard-${esc(m.id)}">
            <div class="match-teams">
              <span class="match-team left">${esc(m.teamA)}</span>
              <span class="match-vs">VS</span>
              <span class="match-team right">${esc(m.teamB)}</span>
            </div>
            <div class="pick-row" data-result-match="${esc(m.id)}" ${editable ? "" : "style=\"pointer-events:none;\""}>
              <button class="pick-btn ${source[m.id]==='A'?'selected':''}" data-val="A" ${editable ? "" : "disabled"}>${esc(m.teamA)}</button>
              <button class="pick-btn ${source[m.id]==='D'?'selected':''}" data-val="D" ${editable ? "" : "disabled"}>Empate</button>
              <button class="pick-btn ${source[m.id]==='B'?'selected':''}" data-val="B" ${editable ? "" : "disabled"}>${esc(m.teamB)}</button>
            </div>
            <div class="result-tag" id="qz-suggest-${esc(m.id)}"></div>
          </div>
        `).join("")}
        ${editable ? `
          <button class="btn btn-ghost" id="qz-save-draft" style="width:100%;padding:12px;">Guardar borrador</button>
          <button class="btn btn-primary" id="qz-publish-results" style="width:100%;padding:12px;margin-top:8px;" ${(isComplete && !stillOpenForVoting) ? "" : "disabled"}>${correcting ? "Publicar corrección" : "Publicar resultados"}</button>
          ${stillOpenForVoting
            ? `<p class="muted" style="text-align:center;margin-top:6px;">Todavía no puedes publicar resultados oficiales — el plazo para votar de esta jornada no ha cerrado. Podrás hacerlo en cuanto pase el deadline.</p>`
            : (!isComplete ? `<p class="muted" style="text-align:center;margin-top:6px;">Falta el resultado de: ${missingMatches.map(m => `${esc(m.teamA)} vs ${esc(m.teamB)}`).join(", ")}.</p>` : ``)}
          ${correcting ? `<button class="btn btn-ghost btn-sm" id="qz-cancel-correction" style="width:100%;margin-top:8px;">Cancelar corrección</button>` : ``}
        ` : `
          <button class="btn btn-ghost" id="qz-start-correction" style="width:100%;padding:12px;">Corregir resultados</button>
        `}
        ${isPublished ? `
          <details style="margin-top:14px;">
            <summary class="muted" style="cursor:pointer;">Opciones avanzadas</summary>
            <p class="muted" style="margin:8px 0;">Reabrir la jornada es distinto a corregir un resultado: deja votar de nuevo a todos y la jornada deja de contar para la tabla hasta que publiques otra vez. Úsalo solo si de verdad hace falta.</p>
            <button class="btn btn-ghost btn-sm" id="qz-reopen-round" style="width:100%;">Reabrir jornada (permitir votos de nuevo)</button>
          </details>
        ` : ``}
      </div>
      ${jornadaBetsCardHtml()}
    `;
    const autofillBtn = document.getElementById("qz-autofill");
    if(autofillBtn) autofillBtn.addEventListener("click", async () => {
      const statusEl = document.getElementById("qz-autofill-status");
      statusEl.textContent = "Buscando resultados…";
      try{
        const data = await fetchSportsResults(round.id); // { ok, reliabilityState, suggestions }
        // DATA-001 §11: never surface the reliability state / provider detail
        // to the organizer — a failed lookup is always safe to retry and
        // never blocks the manual capture flow below.
        if(!data.ok || data.reliabilityState){
          statusEl.textContent = "⚠️ " + sportsDataFailureMessage(data.reliabilityState);
          return;
        }
        applySuggestionsToForm(round, data.suggestions, form, statusEl, data.unscorable);
      }catch(e){
        console.error(e);
        statusEl.textContent = "⚠️ " + sportsDataFailureMessage(null);
      }
    });
    // AUTO-002: if "Buscar resultados pendientes (todas)" already resolved
    // this exact round in this same visit to Admin -> Resultados, show it
    // immediately — the admin shouldn't have to click the per-round button
    // again for a round QRACKS already checked.
    if(editable && renderAdminResultados._bulkCache && renderAdminResultados._bulkCache[round.id]){
      applySuggestionsToForm(round, renderAdminResultados._bulkCache[round.id], form, document.getElementById("qz-autofill-status"), (renderAdminResultados._bulkUnscorable || {})[round.id]);
    }
    form.querySelectorAll(".pick-row").forEach(row => {
      if(!editable) return; // read-only view — no click handlers, matches the disabled buttons
      row.querySelectorAll(".pick-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          editable[row.dataset.resultMatch] = btn.dataset.val;
          row.querySelectorAll(".pick-btn").forEach(b => b.classList.toggle("selected", b===btn));
          // Completeness can change with every click — keep the publish button's
          // enabled state and the "falta X partidos" note honest without a full re-render.
          // Must also keep respecting stillOpenForVoting (FIX 2) — otherwise
          // completing all picks on a still-open round would silently
          // re-enable "Publicar resultados" again after the initial render
          // correctly disabled it.
          const nowComplete = round.matches.every(m => VALID_RESULTS.includes(editable[m.id]));
          const publishBtn = document.getElementById("qz-publish-results");
          if(publishBtn) publishBtn.disabled = !(nowComplete && !stillOpenForVoting);
        });
      });
    });
    const saveDraftBtn = document.getElementById("qz-save-draft");
    if(saveDraftBtn){
      saveDraftBtn.addEventListener("click", async () => {
        saveDraftBtn.disabled = true;
        const result = await setMetaWithError(meta);
        if(result.ok) round._hadSavedDraftChecked = true;
        toast(result.ok ? "✅ Listo, tu borrador quedó guardado." : humanizeError(result.error, result));
        saveDraftBtn.disabled = false;
        renderAdminResultados(body);
      });
    }
    const publishBtn = document.getElementById("qz-publish-results");
    if(publishBtn){
      publishBtn.addEventListener("click", async () => {
        // AUTO-001 QA fix: real protection at the actual mutation point, not
        // just a hidden/disabled button — a round participants can't see/play
        // yet must never get its results published, no matter how this
        // handler was reached. round.published can't regress from true back
        // to false (no "unpublish" feature exists), so this is naturally a
        // no-op for corrections of already-published rounds — see FIX 2 §4.
        if(round.published === false){
          toast("Esta jornada todavía no está publicada para los participantes. Publícala primero en Admin → Jornadas.");
          return;
        }
        if(stillOpenForVoting){
          toast("Todavía no puedes publicar resultados oficiales — el plazo para votar de esta jornada no ha cerrado.");
          return;
        }
        const stillComplete = round.matches.every(m => VALID_RESULTS.includes(source[m.id]));
        if(!stillComplete){ toast("Falta el resultado de algún partido"); return; }
        const confirmTitle = correcting ? `¿Publicar la corrección de la Jornada ${round.number}?` : `¿Publicar los resultados de la Jornada ${round.number}?`;
        const confirmMsg = correcting
          ? `• Los resultados oficiales van a cambiar a los que acabas de capturar.\n` +
            `• Los puntos de todos se van a recalcular.\n` +
            `• Los participantes van a ver el resultado corregido.`
          : `• Se van a calificar los pronósticos de todos.\n` +
            `• La tabla de posiciones se va a actualizar.\n` +
            `• Los participantes van a ver estos resultados como oficiales.`;
        if(!(await qzConfirm(confirmMsg, { title: confirmTitle, destructive: false, confirmLabel: correcting ? "Publicar corrección" : "Publicar resultados" }))) return;
        if(publishBtn.disabled) return; // guards a double-click while the request is in flight
        publishBtn.disabled = true;
        const wasAlreadyPublished = round.resultsPublished;
        const previousResults = round.results; // kept locally so we can roll back the in-memory state on failure
        round.results = { ...editable };
        round.resultsPublished = true;
        round.draftResults = null;
        logAudit(
          wasAlreadyPublished ? "Corrigió resultados" : "Publicó resultados",
          `Jornada ${round.number}`
        );
        const result = await setMetaWithError(meta);
        if(result.ok){
          round._hadSavedDraftChecked = false;
          toast(correcting ? "✅ Listo, la corrección quedó publicada y los puntos se actualizaron." : "✅ Listo, los resultados quedaron publicados y los puntos se actualizaron.");
          allPicksCache = {};
          // Sprint 15.1 — S15-3: fires exactly once per quiniela+jornada, the
          // moment resultsPublished flips false->true for real (server write
          // confirmed ok). `wasAlreadyPublished` — captured before the write,
          // above — IS the dedup guard: correcting an already-published round
          // never re-enters this branch, and a failed write never gets here
          // either. No localStorage/session guard needed, unlike
          // first_round_published — this one is guarded by persisted product
          // state itself, so it can't duplicate even from a different device.
          if(!wasAlreadyPublished){
            trackEvent("result_published", { source: "admin_resultados" });
          }
        }else{
          // Don't leave the in-memory state claiming this published when it didn't.
          if(!result.reconciled){
            round.resultsPublished = wasAlreadyPublished;
            round.results = previousResults;
            if(wasAlreadyPublished) round.draftResults = editable;
          }
          toast(humanizeError(result.error, result));
        }
        publishBtn.disabled = false;
        renderAdminResultados(body);
      });
    }
    const startCorrectionBtn = document.getElementById("qz-start-correction");
    if(startCorrectionBtn){
      startCorrectionBtn.addEventListener("click", () => {
        round.draftResults = { ...round.results };
        renderAdminResultados(body);
      });
    }
    const cancelCorrectionBtn = document.getElementById("qz-cancel-correction");
    if(cancelCorrectionBtn){
      cancelCorrectionBtn.addEventListener("click", async () => {
        round.draftResults = null;
        round._hadSavedDraftChecked = false;
        await setMeta(meta);
        renderAdminResultados(body);
      });
    }
    const reopenBtn = document.getElementById("qz-reopen-round");
    if(reopenBtn){
      reopenBtn.addEventListener("click", async () => {
        const linkedNote = linkedBetsNote(round, "edit");
        if(!(await qzConfirm(`Los participantes van a poder volver a votar, y los resultados ya no contarán para la tabla hasta que publiques de nuevo. Vas a elegir una nueva fecha y hora límite para votar.${linkedNote}`, { title: `¿Reabrir la Jornada ${round.number}?`, confirmLabel: "Continuar" }))) return;
        // FIX 3: never claim "reabierta" without a real future deadline —
        // the admin always picks it, no automatic +24h/tomorrow guess.
        const newDeadlineIso = await qzPromptDeadline(`Elige la nueva fecha y hora límite para votar la Jornada ${round.number}:`, { title: "Nueva fecha límite", confirmLabel: "Reabrir jornada" });
        if(newDeadlineIso === null) return; // cancelled — nothing changed, no toast
        // MS2 · D4: the open questions that close with it move only if the
        // admin says so; the closed ones stay closed.
        const linkedChoice = await chooseLinkedBetsClose(round, newDeadlineIso, `La Jornada ${round.number} vuelve a cerrar el ${fmtWhenTz(newDeadlineIso)}.`);
        if(!linkedChoice) return;
        const betsSnapshot = JSON.parse(JSON.stringify(meta.customBets || []));
        reopenBtn.disabled = true;
        // Atomic from the user's perspective: both fields flip together,
        // and both roll back together if the save fails — never a
        // resultsPublished:false + stale deadline + success toast.
        const previousResultsPublished = round.resultsPublished;
        const previousDeadline = round.deadline;
        // Payment-penalty persistence (P1, QA-corrected): reopening this
        // round is exactly the kind of non-monotonic lifecycle change that
        // must never retroactively erase an already-caused penalty --
        // reconcile (promote any currently eligible+closed+unledgered
        // rounds into each unpaid participant's permanent ledger) BEFORE
        // this round's deadline moves back into the future. Snapshot the
        // whole participants array since reconciliation can touch more
        // than one participant.
        const participantsSnapshot = JSON.parse(JSON.stringify(meta.participants));
        reconcilePenaltyLedger(meta);
        round.resultsPublished = false;
        round.deadline = newDeadlineIso;
        applyLinkedChoice(linkedChoice, round, newDeadlineIso);
        logAudit("Reabrió jornada", `Jornada ${round.number}`);
        const result = await setMetaWithError(meta);
        if(result.ok){
          toast("🔓 Jornada reabierta — ya pueden volver a votar");
        }else{
          if(!result.reconciled){
            round.resultsPublished = previousResultsPublished;
            round.deadline = previousDeadline;
            meta.participants = participantsSnapshot;
            meta.customBets = betsSnapshot;
          }
          toast(humanizeError(result.error, result));
        }
        reopenBtn.disabled = false;
        renderAdminResultados(body);
      });
    }
    wireJornadaBetsGrade();
    wireHelp(form, () => renderAdminResultados(body));

    appendResultsLog();
  }

        : `Para nombrar o quitar admins se necesita la contraseña de administrador${meta.ownerPasswordSet === false ? " (mientras no exista, basta con ser admin)" : ""}.`}</p>
      <p class="muted">Si alguien olvida su PIN, dale "Resetear" — la próxima vez que toque su nombre podrá poner uno nuevo.</p>
      <p class="muted">Añadir un nombre no significa que esa persona ya entró: «Sin PIN» quiere decir que todavía no abre el link.</p>

    addBtn.addEventListener("click", async () => {
      const inp = document.getElementById("qz-new-name");
      const name = inp.value.trim();
      if(!name) return;
      // UX-ADM-006: optimistic mutation, but success feedback and the kept
      // state both depend on a REAL confirmed write — never just "we tried".
      // Snapshot for exact rollback (not just popping the last item, in case
      // something else touches the array while this request is in flight).
      const snapshot = meta.participants.slice();
      addBtn.disabled = true;
      meta.participants.push({id: uid("p"), name, isAdmin:false, paid:false, pin:null});
      const result = await setMetaWithError(meta);

      if(!hint || !plan || !plan.participants) return;
      const left = plan.participants.remaining;
      hint.textContent = left > 0
        ? `Te quedan ${left} lugar${left === 1 ? "" : "es"} en tu plan ${plan.planLabel}.`

      const statusEl = document.getElementById("qz-bulk-status");

      const snapshot = meta.participants.slice();
      const existing = new Set(meta.participants.map(p => p.name.toLowerCase()));
      const added = [];
      const skipped = [];
      names.forEach(name => {
        if(existing.has(name.toLowerCase())){ skipped.push(name); return; }
        meta.participants.push({id: uid("p"), name, isAdmin:false, paid:false, pin:null});

      });

      if(!result.ok){

        // participants sitting in meta.participants even after showing this

        // have seen phantom participants the server never actually has.
        if(!result.reconciled) meta.participants = snapshot;

    body.querySelectorAll("tr[data-pid]").forEach(row => {

        renameInput.disabled = true;

        const result = await setMetaWithError(meta);
        renameInput.disabled = false;
        if(result.ok){
          toast("✅ Listo, el nombre quedó actualizado.");
          renderAdminParticipantes(body);
        }else{
          if(!result.reconciled) p.name = previousName;
          e.target.value = previousName;
          toast(humanizeError(result.error, result));
        }
      });
      const adminCheckbox = row.querySelector("[data-role=admin]");
      adminCheckbox.addEventListener("change", async (e) => {
        const previousValue = p.isAdmin;
        adminCheckbox.disabled = true;
        p.isAdmin = e.target.checked;
        let result = await setMetaWithError(meta);
        if(!result.ok && result.error === "owner_password_required"){
          // Making someone admin is an owner action; an admin signed in with
          // their PIN is asked for the admin password right here instead of
          // being told it worked while the server kept the old role.
          const pw = await qzPrompt("Para cambiar quién es admin, escribe la contraseña de administrador de la quiniela.", { title: "Contraseña de administrador", confirmLabel: "Continuar", secret: true });
          if(pw !== null && pw.trim()){
            result = await setMetaWithError(meta, { owner: pw.trim() });
            if(result.ok){ ownerUnlocked = true; ownerPasswordCache = pw.trim(); }
            else if(result.error === "owner_password_required" || result.error === "unauthorized") result = { ...result, error: "wrong_owner_password" };
          }
        }
        adminCheckbox.disabled = false;
        if(result.ok){
          toast(p.isAdmin
            ? ("✅ " + esc(p.name) + " ahora es admin" + (p.hasPin ? "" : ". Para poner su PIN necesitará la contraseña de administrador o que otro admin escriba su PIN en su teléfono."))
            : ("✅ " + esc(p.name) + " ya no es admin"));
        }else{
          if(!result.reconciled) p.isAdmin = previousValue;
          e.target.checked = previousValue;
          toast(humanizeError(result.error, result));
        }
      });
      const resetBtn = row.querySelector("[data-role=resetpin]");
      if(resetBtn){
        resetBtn.addEventListener("click", async () => {
          // An admin's first PIN needs proof (see setFirstAdminPin), so say up
          // front what they'll need instead of promising an open reset.
          const resetMessage = p.isAdmin
            ? `Como es admin, para poner uno nuevo necesitará la contraseña de administrador o que otro admin escriba su PIN en su teléfono.`
            : `La próxima vez que toque su nombre podrá poner uno nuevo.`;
          if(!(await qzConfirm(resetMessage, { title: `¿Resetear el PIN de ${p.name}?`, confirmLabel: "Resetear" }))) return;
          const previousPin = p.pin;
          const previousHasPin = p.hasPin;
          resetBtn.disabled = true;
          p.pin = null;
          p.hasPin = false;
          const result = await setMetaWithError(meta);
          if(result.ok){
            toast(p.isAdmin
              ? "🔒 PIN reseteado — para poner uno nuevo necesitará la contraseña de administrador o el PIN de otro admin"
              : "🔒 PIN reseteado — la próxima vez que entre podrá poner uno nuevo");
            renderAdminParticipantes(body);
          }else{
            if(!result.reconciled){
              p.pin = previousPin;
              p.hasPin = previousHasPin;
            }
            resetBtn.disabled = false;
            toast(humanizeError(result.error, result));
          }
        });
      }
      const paidCheckbox = row.querySelector("[data-role=paid]");
      paidCheckbox.addEventListener("change", async (e) => {
        const previousValue = p.paid;
        const previousPaidAt = p.paidAt;
        // reconcilePenaltyLedger() can promote NEW permanent ledger entries
        // for ANY currently-unpaid participant (not just this one), so a
        // full rollback on failure needs the whole participants array, not
        // just this participant's fields.
        const participantsSnapshot = JSON.parse(JSON.stringify(meta.participants));
        paidCheckbox.disabled = true;
        const newValue = e.target.checked;
        // Payment-penalty persistence (P1, QA-corrected): reconcile BEFORE
        // flipping paid, using the OLD state -- this is what freezes
        // currently-caused-but-not-yet-permanent penalties into p's ledger
        // right before paid turns true (after which the live top-up stops
        // running for this participant). Once ledgered, a penalty survives
        // reopening/deadline edits/round deletion -- see
        // reconcilePenaltyLedger()/penaltyPointsFor() above.
        reconcilePenaltyLedger(meta);
        p.paid = newValue;
        if(newValue && !previousValue) p.paidAt = new Date().toISOString();
        const result = await setMetaWithError(meta);
        paidCheckbox.disabled = false;
        if(!result.ok){
          if(!result.reconciled) meta.participants = participantsSnapshot;
          e.target.checked = previousValue;
          toast(humanizeError(result.error, result));
        } else if(newValue){
          markHelpLearned("participantes.pago", "reglas.pagos");
        }
      });
      const removeBtn = row.querySelector("[data-role=remove]");
      removeBtn.addEventListener("click", async () => {
        if(!(await qzConfirm("Sus picks guardados dejarán de contarse.", { title: `¿Borrar a ${p.name}?`, confirmLabel: "Borrar" }))) return;
        // UX-ADM-006: exact restoration on failure, same object at the same
        // position — not just "push it back at the end" — so a failed
        // delete never silently reorders the table.
        const snapshot = meta.participants.slice();
        removeBtn.disabled = true;
        meta.participants = meta.participants.filter(x=>x.id!==pid);
        const result = await setMetaWithError(meta);
        if(result.ok){
          renderAdminParticipantes(body);
        }else{
          if(!result.reconciled) meta.participants = snapshot;
          removeBtn.disabled = false;
          toast(humanizeError(result.error, result));
        }
      });
    });
  }

  async function renderAdminOwner(body){
    // Los planes son de las quinielas con link propio; la raíz heredada no tiene.
    const planCard = ROUTE === "quiniela" && SLUG && currentUser && currentUser.isAdmin ? settingsPlanCardHtml() : "";

    // another tab or on another device). Asked before offering to create one;
    // if the user moved to another screen meanwhile, nothing is painted.
    if(!ownerUnlocked && needsAdminPasswordToPublish()){
      // Said while it is asked, instead of an empty screen on a slow network.

      await refreshOwnerPasswordSet();
      if(!body.isConnected) return;

    // PIN opens these settings (the server agrees): the creator sets the

    async function finishClose(r){

    async function closeUnknown(){
      invalidatePlan();
      // Igual que arriba: el cierre PUDO haber entrado. Traer el estado real es
      // lo único que permite que la pantalla —y el banner de verificación—
      // hablen de lo que hay, no de lo que esta pestaña recordaba.
      try{

  // ---------- EXCEL EXPORT ----------
  // Sprint 14.8 — PERF-001: XLSX ya no se carga globalmente (era la única
  // función que lo usaba). Se carga bajo demanda, una sola vez — llamadas
  // posteriores reutilizan la misma promesa cacheada, sin volver a
  // descargar la librería.
  let xlsxLoadPromise = null;
  function ensureXLSXLoaded(){
    if(window.XLSX) return Promise.resolve();
    if(xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      script.onload = () => resolve();
      script.onerror = () => { xlsxLoadPromise = null; reject(new Error("xlsx_load_failed")); };
      document.head.appendChild(script);
    });
    return xlsxLoadPromise;
  }

  async function exportExcel(){
    toast("Generando Excel…");
    try{
      await ensureXLSXLoaded();
    }catch(e){
      toast("No se pudo cargar el generador de Excel, intenta de nuevo");
      return;
    }
    await ensureAllPicksLoaded();
    const wb = XLSX.utils.book_new();

    // Standings
    const standingsSrc = standingsList();
    const standingsRanks = computeDenseRanks(standingsSrc);
    const standings = standingsSrc.map((p,i) => ({
      "#": standingsRanks[i], "Participante": p.name, "Puntos": p.pts, "Pagó": p.paid ? "Sí" : "No"
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(standings), "Tabla");

    // Jornada detail (matrix)
    const detailRows = [];
    meta.rounds.filter(r=>r.resultsPublished).forEach(r => {
      r.matches.forEach(m => {
        const row = { "Jornada": r.number, "Partido": m.teamA + " vs " + m.teamB, "Resultado": r.results[m.id] === 'A' ? m.teamA : r.results[m.id]==='B' ? m.teamB : "Empate" };
        // Liguilla: fase, marcador o estado (pendiente/aplazado/anulado), y
        // los pronósticos como marcador; nunca un «Empate» inventado.
        if(isLg(r)){
          row["Jornada"] = roundTitle(r) + " (J" + r.number + ")";
          row["Resultado"] = lgResultText(r, m);
          const rules = lgRulesOf(r);
          meta.participants.forEach(p => {
            const rp = (allPicksCache[p.id]||{})[r.id]||{};
            row[p.name] = lgPickText(r, m, rules && rules.capture === "score" ? (rp.__score && rp.__score[m.id]) : rp[m.id]) || "";
          });
          detailRows.push(row);
          return;
        }
        meta.participants.forEach(p => {
          const pick = ((allPicksCache[p.id]||{})[r.id]||{})[m.id];
          row[p.name] = pick === 'A' ? m.teamA : pick === 'B' ? m.teamB : pick === 'D' ? "Empate" : "";
        });
        detailRows.push(row);
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailRows), "Jornada detalle");

    // Participant stats
    const statsParticipantMap = new Map(meta.participants.map(p => [p.id, p]));
    const statsRows = meta.participants.map(p => {
      let correct=0, total=0, best=0, worst=null;
      meta.rounds.filter(r=>r.resultsPublished).forEach(r => {
        let roundCorrect=0, roundTotal=0;
        r.matches.forEach(m => {
          const result = r.results[m.id];
          const pick = ((allPicksCache[p.id]||{})[r.id]||{})[m.id];
          if(result){ roundTotal++; total++; if(pick===result){ roundCorrect++; correct++; } }
        });
        if(roundTotal>0){
          best = Math.max(best, roundCorrect);
          worst = worst===null ? roundCorrect : Math.min(worst, roundCorrect);
        }
      });
      return {
        "Participante": p.name,
        "Puntos totales": pointsFor(p.id, statsParticipantMap).pts,
        "Partidos jugados": total,
        "% Acierto": total ? Math.round((correct/total)*1000)/10 + "%" : "0%",
        "Mejor jornada (aciertos)": best,
        "Peor jornada (aciertos)": worst===null?0:worst
      };
    }).sort((a,b)=>b["Puntos totales"]-a["Puntos totales"]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(statsRows), "Estadísticas");

    // Payments
    const paymentRows = meta.participants.map(p => ({
      "Participante": p.name,
      "Cuota": meta.settings.entryFee,
      "Pagó": p.paid ? "Sí" : "No"
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentRows), "Pagos");

    XLSX.writeFile(wb, "quiniela_" + meta.groupName.replace(/\s+/g,"_") + ".xlsx");
    toast("✅ Listo, tu Excel se descargó.");
  }

  // ---------- /crear : create a brand new, independent quiniela ----------
  // The /crear draft survives a reload of the same tab (sessionStorage).
  // There is no password in it: /crear no longer asks for one.
  const CREAR_DRAFT_KEY = "qracks_crear_draft";
  function loadCrearDraft(){
    const empty = { groupName: "", creatorName: "", slug: "", leagueId: "", slugTouched: false };
    try{
      const saved = JSON.parse(window.sessionStorage.getItem(CREAR_DRAFT_KEY) || "null");

      return {
        groupName: String(saved.groupName || ""), creatorName: String(saved.creatorName || ""),
        slug: String(saved.slug || ""), leagueId: String(saved.leagueId || ""),
        slugTouched: !!saved.slugTouched

  }
  function saveCrearDraft(draft){
    try{
      window.sessionStorage.setItem(CREAR_DRAFT_KEY, JSON.stringify({
        groupName: draft.groupName, creatorName: draft.creatorName, slug: draft.slug,

      }));

  }
  function clearCrearDraft(){ try{ window.sessionStorage.removeItem(CREAR_DRAFT_KEY); }catch(e){} }
  // "A", "A y B", "A, B y C".
  function joinEs(items){
    return items.length <= 1 ? (items[0] || "") : items.slice(0, -1).join(", ") + " y " + items[items.length - 1];
  }
  // ==========================================================================
  // ONB-14 · «Ver cómo se juega» (/demo)
  //
  // Una simulación local, para quien está por organizar su quiniela: cinco
  // participantes ficticios (incluido «Tú (demo)»), tres partidos ficticios
  // (uno empate) y 1 punto por acierto. Todo vive en memoria de esta página:
  // no crea grupos, sesiones, PIN ni pronósticos, no lee ninguna quiniela, no
  // escribe en sessionStorage ni consume el plan. Recargar la reinicia.
  //
  // La única escritura al servidor son dos conteos anónimos (demo_started y
  // demo_completed), sin credenciales ni identificadores; si fallan, la demo
  // sigue igual.
  // ==========================================================================
  const DEMO_MATCHES = Object.freeze([
    Object.freeze({ id: "p1", home: "Halcones", away: "Toros", goalsHome: 2, goalsAway: 1 }),
    Object.freeze({ id: "p2", home: "Lobos", away: "Águilas", goalsHome: 1, goalsAway: 1 }),
    Object.freeze({ id: "p3", home: "Coyotes", away: "Jaguares", goalsHome: 0, goalsAway: 2 }),
  ]);
  const DEMO_POINTS_PER_HIT = 1;
  const DEMO_YOU = "you";
  // Inscription order (the table keeps it among equal points, as the app's).
  const DEMO_PEOPLE = Object.freeze([
    Object.freeze({ id: "ana", name: "Ana", before: 12, picks: Object.freeze({ p1: "L", p2: "L", p3: "L" }) }),
    Object.freeze({ id: "beto", name: "Beto", before: 11, picks: Object.freeze({ p1: "L", p2: "E", p3: "V" }) }),
    Object.freeze({ id: "caro", name: "Caro", before: 10, picks: Object.freeze({ p1: "V", p2: "E", p3: "L" }) }),
    Object.freeze({ id: "dani", name: "Dani", before: 8, picks: Object.freeze({ p1: "L", p2: "E", p3: "E" }) }),
    Object.freeze({ id: DEMO_YOU, name: "Tú (demo)", before: 9, picks: null }),
  ]);
  // Pure: "L" (gana local), "E" (empate) or "V" (gana visita).
  function demoOutcome(m){ return m.goalsHome > m.goalsAway ? "L" : m.goalsHome < m.goalsAway ? "V" : "E"; }
  function demoPickLabel(m, pick){ return pick === "L" ? "Gana " + m.home : pick === "V" ? "Gana " + m.away : pick === "E" ? "Empate" : "Sin elegir"; }
  // Pure: how many of these picks hit.
  function demoHits(picks){
    return DEMO_MATCHES.reduce((n, m) => n + (picks && picks[m.id] === demoOutcome(m) ? 1 : 0), 0);
  }
  // Pure: rows sorted by `key` (desc, stable: inscription order among equals)
  // with the app's dense positions (computeDenseRanks: equal points share).
  function demoRank(rows, key){
    const sorted = rows.slice().sort((a, b) => b[key] - a[key]);
    const ranks = computeDenseRanks(sorted.map(r => ({ pts: r[key] })));
    const byId = {};
    sorted.forEach((r, i) => { byId[r.id] = ranks[i]; });
    return { sorted, byId };
  }
  // Pure: the whole table after this round, for everyone. Each row: points
  // before, this round, total, positions before and after.
  function demoStandings(yourPicks){
    const rows = DEMO_PEOPLE.map(p => {
      const hits = demoHits(p.id === DEMO_YOU ? yourPicks : p.picks);
      const round = hits * DEMO_POINTS_PER_HIT;
      return { id: p.id, name: p.name, before: p.before, hits, round, total: p.before + round };
    });
    const before = demoRank(rows, "before");
    const after = demoRank(rows, "total");
    return after.sorted.map(r => ({ ...r, rankBefore: before.byId[r.id], rankAfter: after.byId[r.id] }));
  }
  // «1.er», «2.º», «3.er», «4.º», «5.º» (before «lugar»).
  function demoOrdinal(n){ return n === 1 || n === 3 ? n + ".er" : n + ".º"; }
  // Pure: the message for one row, computed from its positions and ties.
  function demoMoveText(row, table, self){
    const tiedRows = table.filter(r => r.id !== row.id && r.rankAfter === row.rankAfter);
    const others = tiedRows.filter(r => r.id !== DEMO_YOU).map(r => r.name);
    const withYou = tiedRows.some(r => r.id === DEMO_YOU);
    const tie = !tiedRows.length ? ""
      : withYou && !others.length ? ", en empate contigo"
      : `, en empate con ${joinEs(withYou ? [...others, "contigo"] : others)}`;
    const a = row.rankBefore, b = row.rankAfter;
    const who = self ? "" : row.name + " ";
    if(b < a) return `${self ? "Subiste" : who + "sube"} del ${demoOrdinal(a)} al ${demoOrdinal(b)} lugar${tie}.`;
    if(b > a) return `${self ? "Bajaste" : who + "baja"} del ${demoOrdinal(a)} al ${demoOrdinal(b)} lugar${tie}.`;
    return `${self ? "Te mantienes" : who + "se mantiene"} en el ${demoOrdinal(b)} lugar${tie}.`;
  }
  function demoMoveShort(row){
    const d = row.rankBefore - row.rankAfter;
    return d > 0 ? `▲ Sube ${d}` : d < 0 ? `▼ Baja ${-d}` : "= Igual";
  }

  // ---- medición anónima (excepción explícita a la simulación local) ----------
  // Una vez por entrada a la página: «Probar otra vez» no la repite. Sólo el
  // evento y su origen; sin credenciales (ni cookies), sin dispositivo,
  // participante, quiniela ni elecciones. Sin reintentos: si falla, se pierde.
  const demoEventsSent = new Set();
  function trackDemoEvent(name){
    if(demoEventsSent.has(name)) return;
    demoEventsSent.add(name);
    try{
      const ctl = typeof AbortController === "function" ? new AbortController() : null;
      const timer = ctl ? setTimeout(() => ctl.abort(), 5000) : null;
      fetch("/api/track-event", {
        method: "POST", credentials: "omit", cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ event: name, source: "demo" }),
        signal: ctl ? ctl.signal : undefined,
      }).catch(() => {}).finally(() => { if(timer) clearTimeout(timer); });
    }catch(e){ /* la demo no depende de la medición */ }
  }

  function demoGo(step){

  function wireDemo(){

  let platformUnlocked = false;
