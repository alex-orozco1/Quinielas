  function lgWireEditor(body, editingRound){
    const f = lgEditorState(editingRound);
    body.querySelectorAll('input[name="qz-lg-stage"]').forEach(r => r.addEventListener("change", () => { f.stage = r.value; renderAdminRondas(body); }));
    const sr = document.getElementById("qz-lg-round"), sl = document.getElementById("qz-lg-leg");
    if(sr) sr.addEventListener("change", () => { f.round = sr.value; });
    if(sl) sl.addEventListener("change", () => { f.leg = sl.value; });
  }
  function lgPhaseFromEditor(f){
    if(!f.round && !f.leg) return null;
    const ph = { round: f.round || null, leg: f.leg || null, source: "admin" };
    if(f.orig){ const o = JSON.parse(f.orig); if(o.round === ph.round && o.leg === ph.leg) return o; }
    return ph;
  }
  // Una jornada NUEVA desde el formulario: tipo, fase y si se publica o se
  // guarda como borrador. `gate` resuelve a false si hay que parar.
  function lgNewRoundFields(number, matches){
    const f = lgEditorState(null);
    const draftOnly = renderAdminRondas._lgDraftOnly === true;
    renderAdminRondas._lgDraftOnly = false;
    const liguilla = f.stage === "liguilla";
    const ph = liguilla ? lgPhaseFromEditor(f) : null;
    // Un borrador nace sin publicar; nunca se despublica una jornada existente.
    const fields = liguilla ? { stage: "liguilla", ...(ph ? { phase: ph } : {}), ...(draftOnly ? { published: false } : {}) } : null;
    return {
      draftOnly: liguilla && draftOnly,
      publishing: liguilla && !draftOnly,
      gate: liguilla && !draftOnly ? lgPublishGate({ ...fields, number, matches }) : Promise.resolve(true),
      apply(round){ if(fields) Object.assign(round, fields); },
    };
  }
  function lgApplyEditor(round, f){
    if(round.published === false){
      if(f.stage === "liguilla") round.stage = "liguilla"; else delete round.stage;
    }
    if(round.stage === "liguilla"){
      const ph = lgPhaseFromEditor(f);
      if(ph) round.phase = ph; else delete round.phase;
    }
  }

  // ---------- ADMIN ----------
  // MON-002B: the plan a quiniela is actually on, straight from the server.
  //
  // What used to live here were the two legacy payment-status helpers: the
  // old cobro model, which counted published rounds against
  // platform_settings.jornadaLimit (5), quoted a price of
  // pricePerParticipant x participants, and printed the platform's bank
  // details. None of it matched what the server actually enforced (7 rounds,
  // $199 flat) and none of it was enforced server-side at all -- the red
  // "no puedes crear jornadas" card only hid a form. It is gone, together
  // with the unauthenticated platform endpoint that fed it.
  //
  // Every number below is computed by the backend. This file deliberately
  // does NOT know what Gratis means, what Plus costs, or when a round budget
  // applies: two copies of that rule drifting apart is exactly how the
  // product ended up showing one paywall and enforcing another.
  let planState = null;
  let planStateInFlight = null;
  // MON-003 · cobertura: el plan en memoria es de UNA quiniela y de UN momento.
  // `planStateSlug` impide pintar el de otra; `planGen` impide que una lectura
  // que salió ANTES de invalidar (p. ej. antes de cambiar la liga en Ajustes)
  // vuelva a dejar el plan viejo —con la frase de cobertura de antes— en caché.
  let planStateSlug = null;
  let planGen = 0;
  async function loadPlan(opts){
    if(ROUTE !== "quiniela" || !SLUG || !meta) return null;
    if(planStateSlug !== SLUG){ planState = null; planStateSlug = SLUG; }
    const force = !!(opts && opts.force);
    if(!force && planState) return planState;
    if(!force && planStateInFlight) return planStateInFlight;
    const p = readPlanFresh();
    planStateInFlight = p;
    try{ return await p; }
    finally{ if(planStateInFlight === p) planStateInFlight = null; }
  }
  // Una lectura del plan que NUNCA entrega una foto de antes de invalidar: si
  // mientras viajaba alguien invalidó (la liga pudo cambiar) o se cambió de
  // quiniela, se descarta y se vuelve a leer.
  async function readPlanFresh(){
    for(let intento = 0; intento < 3; intento++){
      const gen = planGen;
      const slugAlPedir = SLUG;
      let leido = null;
      try{
        const headers = {};
        const cred = adminOrOwnerCred();
        setAuthHeaders(headers, cred);
        const res = await fetch("/api/quinielas/" + encodeURIComponent(slugAlPedir) + "/plan", {
          headers, credentials: "same-origin"
        });
        if(!res.ok) return null;
        const data = await res.json();
        leido = data && data.available ? data : null;
      }catch(e){ console.error("loadPlan failed", e); return null; }
      if(gen === planGen && slugAlPedir === SLUG){ planState = leido; return leido; }
    }
    return null;
  }
  // ---------- MON-003: el pago ----------
  //
  // Esta pantalla no sabe cuánto cuesta Plus, ni qué torneo se está comprando,
  // ni cómo se verifica el cobro. Pide que se prepare el pago y sigue el
  // enlace. Todo lo comercial lo pone el servidor, que es lo que impide que
  // una llamada fabricada compre Plus por un peso.
  // El pago pendiente de ESTA quiniela, con caducidad. Sin caducidad, un
  // pendiente que nunca se resolvió haría que cada carga de la página
  // preguntara por él para siempre.
  const PENDING_PURCHASE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
  function pendingPurchaseKey(){ return "qracks_pago_" + (SLUG || "root"); }
  // Se guarda la VUELTA entera, no sólo el id: una vuelta cancelada también es
  // algo que hay que contarle al organizador, y también se pierde si la app le
  // pide identificarse antes de poder decírselo.
  // `awaiting` distingue dos cosas muy distintas: "se abrió un checkout" (y
  // quizá se abandonó: se puede volver a intentar) y "se volvió del pago, o el
  // servidor dice que la sesión ya se usó" (hay un cobro esperando confirmación:
  // NO se ofrece otro pago). Sólo lo segundo pone la pantalla en espera.
  function writePendingPurchase(id, cancelled, sessionHint, awaiting){
    try{
      window.localStorage.setItem(pendingPurchaseKey(),
        JSON.stringify({ id: id || null, cancelled: !!cancelled,
          sess: (typeof sessionHint === "string" && sessionHint) ? sessionHint : null,
          awaiting: !!awaiting, at: Date.now() }));
    }catch(e){}
  }
  function readPendingPurchase(){
    try{
      const raw = window.localStorage.getItem(pendingPurchaseKey());
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || (!parsed.id && !parsed.cancelled)) return null;
      if(!Number.isFinite(parsed.at) || Date.now() - parsed.at > PENDING_PURCHASE_MAX_AGE_MS){
        clearPendingPurchase();
        return null;
      }
      return parsed;
    }catch(e){ return null; }
  }
  function clearPendingPurchase(){
    try{ window.localStorage.removeItem(pendingPurchaseKey()); }catch(e){}
  }
  // Un pago que espera confirmación en ESTE dispositivo, o null.
  function awaitingPayment(){
    const p = readPendingPurchase();
    return (p && p.id && !p.cancelled && p.awaiting) ? p : null;
  }

  let checkoutInFlight = false;
  async function startCheckout(){
    if(ROUTE !== "quiniela" || !SLUG) return { ok: false };
    // Un segundo clic mientras el primero sigue en vuelo no manda otra
    // petición. El servidor también lo soporta (reutiliza la compra abierta),
    // pero no llegar a pedirlo es mejor que depender de que lo resuelva.
    if(checkoutInFlight) return { ok: false, reason: "in_flight" };
    checkoutInFlight = true;
    try{
      const headers = { "Content-Type": "application/json" };
      const cred = adminOrOwnerCred();
      setAuthHeaders(headers, cred);
      const res = await fetch("/api/quinielas/" + encodeURIComponent(SLUG) + "/checkout", {
        method: "POST", headers, credentials: "same-origin", body: "{}"
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data && data.checkoutUrl){
        // Se recuerda qué compra se abrió para poder preguntar por ella al
        // volver, incluso si el navegador pierde el parámetro de la URL.
        writePendingPurchase(data.purchaseId);
        return { ok: true, checkoutUrl: data.checkoutUrl, purchaseId: data.purchaseId };
      }
      // MON-003 Correction 08. Dos 503 que NO son lo mismo. `payments_unavailable`
      // es "la pasarela no está configurada": ahí sí se ofrece el camino manual.
      // `checkout_unavailable` es "ahora mismo no se puede abrir un pago NUEVO",
      // y una de sus causas es que un pago anterior todavía pueda cobrar. Mandar a
      // esa persona a "escríbenos y lo activamos" era invitarla a pagar por otro
      // canal mientras el checkout con tarjeta seguía vivo.
      if(res.status === 503){
        // Correction 10: `payments_misconfigured` es un error de despliegue, no
        // "sin pasarela": tampoco ofrece el camino manual.
        const e503 = data && data.error;
        return { ok: false, reason: e503 === "checkout_unavailable" ? "checkout_unavailable"
          : e503 === "payments_misconfigured" ? "payments_misconfigured" : "unavailable" };
      }
      // CORRECTION 05 (P1-3). El servidor devuelve `purchaseId` a propósito
      // cuando hay un cobro en curso: es la compra que hay que CONFIRMAR, no un
      // error del que reintentar. Antes se tiraba, la pantalla decía "no pudimos
      // abrir el pago, inténtalo otra vez" e invitaba a reintentar sobre algo que
      // podía estar ya cobrado. Se conserva y se persiste como compra pendiente,
      // que es lo que hace que la recuperación arranque sola.
      const recuperable = data && typeof data.purchaseId === "string" && data.purchaseId;
      if(recuperable){
        writePendingPurchase(data.purchaseId);
      }
      return { ok: false, reason: (data && data.error) || "error",
        purchaseId: recuperable || null };
    }catch(e){
      return { ok: false, reason: "network_error" };
    }finally{
      checkoutInFlight = false;
    }
  }

  // La vuelta del checkout. NO activa nada: la URL de regreso sólo dice QUÉ
  // compra mirar, y quien contesta si se cobró es el servidor preguntándole al
  // proveedor. Un parámetro inventado a mano aquí no consigue nada.
  const CHECKOUT_POLL_MS = 2000;
  const CHECKOUT_POLL_ATTEMPTS = 6;
  async function readCheckoutStatus(purchaseId, sessionHint){
    const headers = {};
    const cred = adminOrOwnerCred();
    setAuthHeaders(headers, cred);
    // La pista del id de sesión, si el proveedor la puso en la URL de vuelta. El
    // servidor la VERIFICA contra la compra antes de usarla para nada, así que
    // mandarla sólo puede acelerar el rescate; inventarla no consigue nada.
    const qs = (typeof sessionHint === "string" && sessionHint)
      ? "?sess=" + encodeURIComponent(sessionHint) : "";
    const res = await fetch("/api/quinielas/" + encodeURIComponent(SLUG)
      + "/checkout/" + encodeURIComponent(purchaseId) + qs, { headers, credentials: "same-origin" });
    if(res.status === 404){
      // MON-003: el servidor dice que ESA compra no existe para esta quiniela (un
      // enlace de vuelta inventado o de otra quiniela). No hay cobro que esperar;
      // sin esto la pantalla quedaba "confirmando tu pago" hasta 24 h y sin
      // dejar pagar.
      const body = await res.json().catch(() => ({}));
      return body && body.error === "purchase_not_found" ? { status: "not_found" } : null;
    }
    if(!res.ok) return null;
    return await res.json().catch(() => null);
  }
  // El bucle de recuperación de un cobro, en un solo sitio.
  //
  // CORRECTION 05 (P1-3): lo usan las DOS entradas — volver del checkout, y que
  // el servidor conteste "hay un pago en curso" al pulsar el botón. Antes lo
  // segundo caía en un error genérico que invitaba a reintentar sobre algo que
  // podía estar ya cobrado.
  //
  // Nada de esto ACTIVA nada: sólo pregunta. Quien decide si se cobró es el
  // servidor preguntándole al proveedor.
  // MON-003: "Pago completado" se dice SÓLO cuando el servidor confirma que la
  // quiniela ya es Plus (el plan recién leído), no porque la compra conste
  // pagada: un pago puede constar y el plan no aplicarse (torneo cambiado,
  // quiniela borrada…). Mientras no esté confirmado, la pantalla espera y no
  // ofrece otro pago.
  const CHECKOUT_RECHECK_MS = 20000;
  let checkoutRecoveryActive = false;
  let checkoutRecheckTimer = null;
  async function runCheckoutRecovery(purchaseId, sessionHint, opts){
    if(!purchaseId) return;
    // Una sola a la vez: la vuelta del pago puede llegar por dos caminos
    // (arranque y entrada de la sesión) y preguntar dos veces no aporta nada.
    if(checkoutRecoveryActive) return;
    checkoutRecoveryActive = true;
    const quiet = !!(opts && opts.quiet);
    try{
      if(!quiet){
        // Hay un cobro esperando: se marca, para que la pantalla no ofrezca
        // otro pago aunque se recargue.
        writePendingPurchase(purchaseId, false, sessionHint, true);
        notice("Estamos confirmando tu pago…");
        await refreshPlanSurfaces();
      }
      // El proveedor puede tardar un momento en avisarnos. Se pregunta unas
      // pocas veces seguidas; si no basta, se sigue preguntando con calma
      // mientras la página esté abierta.
      for(let i = 0; i < CHECKOUT_POLL_ATTEMPTS; i++){
        const r = await checkPurchaseOnce(purchaseId, sessionHint);
        if(r === "done") return;
        if(r === "paid_pending_plan" && quiet){
          // Pagado de verdad: ya no es una vuelta silenciosa.
          writePendingPurchase(purchaseId, false, sessionHint, true);
        }
        await new Promise(res => setTimeout(res, CHECKOUT_POLL_MS));
      }
      if(quiet && !awaitingPayment()) return;
      // La compra pendiente NO se borra: sigue habiendo un cobro por resolver y al
      // volver a entrar se retoma. Y el mensaje no invita a comprar otra vez.
      await refreshPlanSurfaces();
      notice("Tu pago sigue en proceso. En cuanto se confirme, Plus se activa solo. "
        + "No hace falta pagar otra vez.");
      scheduleCheckoutRecheck(purchaseId, sessionHint);
    } finally {
      checkoutRecoveryActive = false;
    }
  }
  // Una pregunta al servidor. "done" = ya se dijo lo que había que decir.
  async function checkPurchaseOnce(purchaseId, sessionHint){
    let status = null;
    try{ status = await readCheckoutStatus(purchaseId, sessionHint); }catch(e){}
    if(status && status.status === "paid"){
      invalidatePlan();
      const plan = await loadPlan({ force: true });
      // MON-003 · confirmación visible: el servidor dice que ESTA compra es la
      // que dio Plus al torneo actual. Entonces —y sólo entonces— se recuerda
      // para la tarjeta "Pago completado", que queda al inicio del panel Admin
      // hasta que se descarte (ya no un aviso que se va a los 6 segundos).
      if(plan && plan.plan === "PLUS" && plan.confirmedPurchaseId === purchaseId){
        rememberConfirmedPurchase(purchaseId);
        // "Estamos confirmando tu pago…" ya no es verdad: se retira en el acto,
        // para que no conviva con la tarjeta de pago completado.
        hideNotice();
        clearPendingPurchase();
        await refreshPlanSurfaces();
        return "done";
      }
      // Plus, pero no por esta compra (p. ej. un grant del operador mientras se
      // pagaba): no se afirma "Pago completado" de algo que no lo dio.
      if(plan && plan.plan === "PLUS"){
        clearPendingPurchase();
        await refreshPlanSurfaces();
        notice("Tu quiniela ya tiene Plus.");
        return "done";
      }
      if(status.needsAttention){
        clearPendingPurchase();
        await refreshPlanSurfaces();
        notice("Tu pago se registró, pero necesitamos revisarlo. Te contactamos.");
        return "done";
      }
      // Pagado y todavía sin Plus confirmado: se sigue esperando.
      return "paid_pending_plan";
    }
    if(status && status.status === "not_found"){
      clearPendingPurchase();
      await refreshPlanSurfaces();
      return "done";
    }
    if(status && (status.status === "failed" || status.status === "cancelled" || status.status === "expired")){
      clearPendingPurchase();
      await refreshPlanSurfaces();
      notice("El pago no se completó. No se hizo ningún cargo.");
      return "done";
    }
    return "pending";
  }
  // MON-003 · la tarjeta "Pago completado". Se recuerda la compra que el
  // SERVIDOR confirmó como la que dio Plus (nunca por los parámetros de vuelta),
  // y se muestra mientras el servidor lo siga diciendo y no se haya descartado.
  // Descartada, no vuelve por esa misma compra. Si el almacenamiento no está
  // disponible, vive en memoria mientras dure la página.
  let confirmedPurchaseMem = null;
  const confirmedPurchaseSeenMem = new Set();
  function confirmedPurchaseKey(){ return "qracks_pago_ok_" + (SLUG || "root"); }
  function confirmedPurchaseSeenKey(id){ return "qracks_pago_visto_" + id; }
  function confirmedPurchaseSeen(id){
    if(confirmedPurchaseSeenMem.has(id)) return true;
    try{ return window.localStorage.getItem(confirmedPurchaseSeenKey(id)) === "1"; }catch(e){ return false; }
  }
  function rememberConfirmedPurchase(id){
    if(typeof id !== "string" || !id || confirmedPurchaseSeen(id)) return;
    confirmedPurchaseMem = id;
    try{ window.localStorage.setItem(confirmedPurchaseKey(), id); }catch(e){}
  }
  function storedConfirmedPurchase(){
    try{ const v = window.localStorage.getItem(confirmedPurchaseKey()); if(v) return v; }catch(e){}
    return confirmedPurchaseMem;
  }
  function dismissConfirmedPurchase(id){
    confirmedPurchaseSeenMem.add(id);
    confirmedPurchaseMem = null;
    try{
      window.localStorage.setItem(confirmedPurchaseSeenKey(id), "1");
      window.localStorage.removeItem(confirmedPurchaseKey());
    }catch(e){}
  }
  // La compra cuya tarjeta toca mostrar ahora, o null.
  function confirmedPurchaseToShow(plan){
    const id = storedConfirmedPurchase();
    if(!id || confirmedPurchaseSeen(id)) return null;
    if(!plan || plan.plan !== "PLUS" || plan.confirmedPurchaseId !== id) return null;
    return id;
  }
  function paymentConfirmedHtml(plan){
    const id = confirmedPurchaseToShow(plan);
    if(!id) return "";
    return `<div class="card" id="qz-payment-confirmed" role="status" data-purchase="${esc(id)}" style="border-color:var(--gold);background:#FFF9EC;">
      <p style="margin:0 0 10px;font-weight:700;">✅ Pago completado. Tu quiniela ya tiene Plus.</p>
      <button class="btn btn-gold btn-sm" data-payment-confirmed-dismiss>Entendido</button>
    </div>`;
  }
  function wirePaymentConfirmed(scope){
    if(!scope) return;
    const btn = scope.querySelector("[data-payment-confirmed-dismiss]");
    if(!btn) return;
    btn.addEventListener("click", () => {
      const card = scope.querySelector("#qz-payment-confirmed");
      const id = card && card.dataset.purchase;
      if(id) dismissConfirmedPurchase(id);
      if(card) card.remove();
    });
  }

  function scheduleCheckoutRecheck(purchaseId, sessionHint){
    clearTimeout(checkoutRecheckTimer);
    checkoutRecheckTimer = setTimeout(async () => {
      if(!awaitingPayment()) return;
      const r = await checkPurchaseOnce(purchaseId, sessionHint);
      if(r !== "done") scheduleCheckoutRecheck(purchaseId, sessionHint);
    }, CHECKOUT_RECHECK_MS);
  }

  async function resolveCheckoutReturn(){
    if(ROUTE !== "quiniela" || !SLUG || !meta) return;
    let params;
    try{ params = new URLSearchParams(window.location.search); }catch(e){ params = new URLSearchParams(); }
    let cancelled = !!params.get("qz_pago_cancelado");
    let purchaseId = params.get("qz_pago");
    // La pista del id de sesión que rellena el proveedor en la URL de vuelta.
    // Acelera el rescate cuando el id nunca se llegó a guardar aquí; el servidor
    // la verifica y funciona igual si no llega.
    let sessionHint = params.get("qz_sess");
    if(typeof sessionHint === "string" && !/^cs_[A-Za-z0-9_]{1,200}$/.test(sessionHint)){
      sessionHint = null;
    }
    // Si la URL no trae nada puede seguir habiendo una vuelta pendiente de esta
    // quiniela: es lo que permite retomarla cuando la app pidió identificarse
    // antes de poder actuar.
    // Volver por la success_url es la señal de que el pago se hizo: el
    // proveedor sólo redirige ahí al completarse. Esa vuelta espera confirmación.
    let awaiting = !!purchaseId && !cancelled;
    if(!purchaseId && !cancelled){
      const pending = readPendingPurchase();
      if(!pending) return;
      purchaseId = pending.id;
      cancelled = pending.cancelled;
      awaiting = !!pending.awaiting;
      if(!sessionHint && typeof pending.sess === "string") sessionHint = pending.sess;
    }
    // La vuelta se PERSISTE antes de tocar la URL. Al volver del pago, la app
    // puede preguntar "¿Eres Ana?" antes de saber quién vuelve; si el
    // parámetro se consumiera ahí, se perdería para siempre y el organizador
    // se quedaría pagado y sin Plus, o sin saber que no se le cobró.
    writePendingPurchase(purchaseId, cancelled, sessionHint, awaiting);
    // Y la barra se limpia: no aporta nada al recargar y queda fea si alguien
    // comparte el enlace.
    try{
      const url = new URL(window.location.href);
      let tocada = false;
      for(const k of ["qz_pago", "qz_pago_cancelado", "qz_sess"]){
        if(url.searchParams.has(k)){ url.searchParams.delete(k); tocada = true; }
      }
      if(tocada) window.history.replaceState({}, "", url.toString());
    }catch(e){}
    // La credencial en memoria NO sirve de portero aquí: volver del pago es una
    // navegación completa, y `ownerPasswordCache`/`currentUserPinCache` mueren
    // con la página. Lo que SÍ sobrevive es la cookie de sesión, que es
    // exactamente con lo que el servidor autoriza. Gatear por la credencial
    // dejaba a todo organizador que pagara viendo cómo no pasaba nada.
    const pareceAdmin = !!adminOrOwnerCred() || !!(currentUser && currentUser.isAdmin);
    if(!pareceAdmin) return;
    if(cancelled){
      clearPendingPurchase();
      notice("No se hizo ningún cargo. Puedes intentarlo cuando quieras.");
      return;
    }
    if(!purchaseId) return;
    // Un checkout que se abrió y del que no se volvió (quizá se abandonó) se
    // comprueba en SILENCIO: si resulta pagado, se dice; si no, la pantalla no
    // se pone en espera ni asegura que "sigue en proceso".
    await runCheckoutRecovery(purchaseId, sessionHint, { quiet: !awaiting });
  }

  // Any write that consumes capacity can change these numbers, so the cached
  // copy is dropped rather than left to go quietly out of date.
  function invalidatePlan(){ planState = null; planGen++; }

  // Lo que depende del plan —la franja del plan en Admin y la etiqueta del
  // encabezado— se refresca SIN repintar la aplicación entera. La vuelta del pago
  // llega mientras el panel de Admin puede estar a medio pintar (sus vistas son
  // asíncronas), y un render() completo en ese instante le cambiaba el DOM por
  // debajo.
  async function refreshPlanSurfaces(){
    const plan = await loadPlan().catch(() => null);
    paintPlanBadge(plan);
    await renderPlanStrip().catch(() => {});
    await renderSettingsPlan().catch(() => {});
  }

  function paintPlanBadge(plan){
    const el = document.getElementById("qz-plan-badge");
    if(el) el.hidden = !(plan && plan.plan === "PLUS");
  }

  // Shown once per threshold per quiniela, and only to the Admin. "Once"
  // survives a reload on purpose: re-arming the same warning every time the
  // page loads is nagging, not informing.
  function planWarningKey(kind){ return "qracks_plan_warn_" + kind + "_" + (SLUG || "root"); }
  function planWarningSeen(kind){
    try{ return window.localStorage.getItem(planWarningKey(kind)) === "1"; }
    catch(e){ return false; }
  }
  function markPlanWarningSeen(kind){
    try{ window.localStorage.setItem(planWarningKey(kind), "1"); }catch(e){}
  }

  // The discreet always-on line: "Plan Gratis · 8 de 10 personas · 5 de 7
  // jornadas". No colour, no button, no pressure -- it exists so the limit
  // stops being a surprise, which is the whole complaint the hard block used
  // to produce.
  // MON-002C: qué torneo está jugando esta quiniela, en lenguaje de persona.
  // Nunca muestra identificadores internos ni del proveedor — el servidor
  // manda nombre y estado, no ids, precisamente para que no haya nada que
  // filtrar aquí.
  function tournamentStatusHtml(plan){
    const t = plan && plan.tournament;
    if(!t) return "";
    // En el primer torneo de una quiniela sin nombre de competencia no hay
    // nada útil que decir: hablar de "torneos" a quien apenas empieza sobra.
    if(!t.name && t.cycle === 1 && !t.previousCycles) return "";
    const name = t.name || (t.cycle > 1 ? `Torneo ${t.cycle}` : "Tu torneo");
    const ended = t.state === "ENDED";
    return `<p class="muted" id="qz-tournament-status" style="margin:0 0 4px;">${
      ended ? "🏁 " : ""}Torneo actual: <strong>${esc(name)}</strong>${ended ? " — este torneo terminó" : ""}</p>`;
  }

  // Una acción primaria por estado: cuando el torneo terminó, empezar el
  // siguiente ES la acción. Mientras sigue vivo, la opción existe pero no
  // compite con nada (vive en Ajustes).
  function tournamentEndedCardHtml(plan){
    const t = plan && plan.tournament;
    if(!t || t.state !== "ENDED") return "";
    return `
      <div class="card" id="qz-tournament-ended" style="border-color:var(--gold);background:#FFF9EC;">
        <p style="margin:0 0 6px;font-weight:700;">Este torneo terminó</p>
        <p class="muted" style="margin:0 0 10px;">Para jugar el siguiente, inicia un torneo nuevo. Se conservan tus participantes, tus jornadas y todo el historial.</p>
        <button class="btn btn-gold btn-sm" data-start-new-tournament>Iniciar torneo nuevo</button>
      </div>
    `;
  }

  // El diálogo dice lo único que puede sorprender: el Plus no se transfiere.
  async function startNewTournamentFlow(plan){
    // Sin un ciclo que citar no hay precondición que mandar, y mandar algo
    // inventado sería justo lo que la precondición existe para impedir.
    const expectedCycle = plan && plan.tournament && plan.tournament.cycle;
    if(!Number.isSafeInteger(expectedCycle) || expectedCycle < 1){
      toast("No pudimos leer el estado del torneo. Recarga la página e intenta de nuevo.");
      return;
    }
    const hadPlus = !!(plan && plan.plan && plan.plan !== "FREE");
    const message = (hadPlus
      ? "Tu Plus anterior no se transfiere: el torneo nuevo empieza en Gratis, y puedes pasarlo a Plus cuando quieras.\n\n"
      : "El torneo nuevo empieza en Gratis, con su propio conteo de jornadas.\n\n")
      + "Se conservan tus participantes, tus jornadas y todos los resultados de antes.";
    if(!(await qzConfirm(message, {
      title: "¿Empezar un torneo nuevo?",
      confirmLabel: "Empezar torneo nuevo",
      cancelLabel: "Cancelar",
      destructive: false
    }))) return;

    const name = await qzPrompt("¿Cómo se llama el torneo nuevo? (opcional)", {
      title: "Torneo nuevo", confirmLabel: "Empezar"
    });
    if(name === null) return;

    const r = await apiStartNewTournament(name.trim(), expectedCycle);
    if(r.error === "stale_tournament_cycle"){
      // Alguien más ya lo hizo (otra pestaña, otro admin, o esta misma
      // pantalla que quedó vieja). NO se reintenta solo: reintentar sería
      // empezar un SEGUNDO torneo sin que nadie lo haya pedido. Se refresca y
      // se le dice qué pasó; si de verdad quiere otro, vuelve a apretar.
      invalidatePlan();
      // El orden importa: toast() cuelga el mensaje de `root`, y render()
      // reemplaza root.innerHTML entero — avisar antes de repintar destruye el
      // aviso en el mismo tick y la persona no llega a leer nada.
      render();
      toast("El torneo ya cambió. Actualizamos la pantalla.");
      return;
    }
    if(!r.ok){
      toast(ERROR_MESSAGES[r.error] || "No se pudo empezar el torneo nuevo, intenta de nuevo");
      return;
    }
    invalidatePlan();
    // Los avisos de límite son por torneo: el nuevo merece los suyos.
    try{
      window.localStorage.removeItem(planWarningKey("people"));
      window.localStorage.removeItem(planWarningKey("rounds"));
    }catch(e){}
    // Repintar primero, avisar después: si no, el toast muere con el render.
    render();
    toast("✅ Listo, empezaste un torneo nuevo. Tu historial sigue completo.");
  }

  function wireTournamentActions(scope){
    if(!scope) return;
    scope.querySelectorAll("[data-start-new-tournament]").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await startNewTournamentFlow(await loadPlan());
        btn.disabled = false;
      });
    });
  }

  // MON-003: el estado de espera. Persistente mientras el pago no se confirme
  // (sobrevive a recargar en este dispositivo) y sin ningún botón de pago.
  function paymentAwaitingHtml(plan){
    if(!awaitingPayment() || (plan && plan.plan === "PLUS")) return "";
    return `<div class="card" id="qz-payment-awaiting" role="status" style="border-color:var(--gold);background:#FFF9EC;">
      <p style="margin:0;"><strong>⏳ Estamos confirmando tu pago.</strong></p>
      <p class="muted" style="margin:6px 0 0;">En cuanto se confirme, tu quiniela tendrá Plus. No hace falta pagar otra vez.</p>
    </div>`;
  }

  function planStatusHtml(plan){
    if(!plan) return "";
    const bits = [`Plan ${esc(plan.planLabel)}`];
    if(plan.participants){
      bits.push(`${plan.participants.used} de ${plan.participants.limit} persona${plan.participants.limit === 1 ? "" : "s"}`);
    }
    if(plan.rounds && plan.rounds.applies){
      bits.push(`${plan.rounds.used} de ${plan.rounds.limit} jornada${plan.rounds.limit === 1 ? "" : "s"}`);
    }else if(plan.coverage && plan.coverage.scope){
      // Plus: no hay cuenta de jornadas que mostrar, porque cubre el torneo
      // entero, fases finales incluidas. La frase es la del servidor.
      bits.push(`cubre ${esc(plan.coverage.scope)}`);
    }else if(plan.rounds && plan.competition && plan.competition.bound){
      // Un plan especial ligado a un torneo: tampoco cuenta jornadas.
      bits.push("cubre este torneo completo");
    }
    const cta = planOfferCtaHtml(plan, "plan_strip");
    const line = `<p class="muted" id="qz-plan-status" style="margin:0;">${bits.join(" · ")}</p>`;
    return cta
      ? `<div class="qz-plan-row">${line}${cta}</div>`
      : line.replace('style="margin:0;"', 'style="margin:0 0 12px;"');
  }

  // MON-003. Qué da Plus, en UNA frase para la franja, Ajustes y la hoja: la del
  // servidor (`coverageText`, de competitionCoverage.js), según la competencia
  // seleccionada — "hasta 50 personas y el torneo completo, incluida la
  // liguilla". Ningún número de jornadas: Plus no tiene tope dentro de su torneo.
  function plusPitch(offer){
    if(!offer) return "";
    const text = typeof offer.coverageText === "string" && offer.coverageText
      ? offer.coverageText
      : `hasta ${offer.participantLimit} personas y el torneo completo`;
    return `Con Plus: ${text}.`;
  }

  // MON-003. La puerta FIJA a la oferta Plus. Antes la oferta sólo aparecía al
  // quedar 1 lugar o 1 jornada (y una sola vez), al llenarse la quiniela o al
  // chocar con el límite: un Admin con "1 de 10 personas" no tenía por dónde
  // contratar Plus. Aparece cuando el SERVIDOR dice que hay oferta
  // (`upgrade.available`) y ningún pago espera confirmación. Cómo se paga —y si
  // se puede pagar ahora— lo sigue decidiendo el servidor dentro de la hoja
  // (`offer.checkout`): el botón de pago sólo existe en modo tarjeta.
  function planOfferCtaHtml(plan, source){
    if(!plan || !plan.upgrade || !plan.upgrade.available) return "";
    if(awaitingPayment()) return "";
    return `<button class="btn btn-gold btn-sm" data-plan-open-offer="${esc(source)}">Ver plan Plus</button>`;
  }

  function wirePlanOfferCta(scope){
    if(!scope) return;
    scope.querySelectorAll("[data-plan-open-offer]").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try{
          // Fresca, por la misma razón que el aviso (Correction 09): el modo de
          // compra puede haber cambiado desde que se pintó el botón.
          const fresco = await loadPlan({ force: true });
          if(!fresco){
            toast("No pudimos cargar las opciones de tu plan ahora mismo. Intenta de nuevo en unos minutos.");
            return;
          }
          await showUpgradeSheet(fresco.upgrade, { reason: null, plan: fresco.plan, source: btn.dataset.planOpenOffer });
        } finally {
          btn.disabled = false;
          // Lo que la hoja haya cambiado (un pago que quedó esperando) se refleja.
          refreshPlanSurfaces().catch(() => {});
        }
      });
    });
  }

  // Fires at exactly one place left. Deliberately not a modal: the Admin is
  // mid-task and nothing is blocked yet.
  function planWarningHtml(plan){
    if(!plan) return "";
    // MON-003: con un pago esperando confirmación no se ofrece nada que vender.
    const offer = plan.upgrade && plan.upgrade.available && !awaitingPayment() ? plan.upgrade : null;
    const parts = [];
    if(plan.participants && plan.participants.remaining === 1 && !planWarningSeen("people")){
      parts.push({
        kind: "people",
        // On a plan with nothing above it the warning still fires — the
        // Admin needs to know a lugar is left — but it never invents a tier
        // to sell them.
        text: offer
          ? `Te queda 1 lugar en tu quiniela. Con Plus caben hasta ${offer.participantLimit} personas.`
          : "Te queda 1 lugar en tu quiniela."
      });
    }
    if(plan.rounds && plan.rounds.applies && plan.rounds.remaining === 1 && !planWarningSeen("rounds")){
      parts.push({
        kind: "rounds",
        // Said BEFORE it matters, not after: the consumed count is durable
        // on purpose, and finding that out by deleting a jornada and
        // watching nothing come back is the worst moment to learn it.
        text: "Te queda 1 jornada en tu plan. Ojo: borrar una jornada no te devuelve el espacio."
      });
    }
    if(!parts.length) return "";
    return parts.map(p => `
      <div class="card" data-plan-warning="${p.kind}" style="border-color:var(--gold);background:#FFF9EC;">
        <p style="margin:0 0 10px;">${esc(p.text)}</p>
        <div style="display:flex;gap:8px;align-items:center;">
          ${offer ? `<button class="btn btn-gold btn-sm" data-plan-warning-cta="${p.kind}">Ver plan Plus</button>` : ``}
          <button class="btn btn-ghost btn-sm" data-plan-warning-dismiss="${p.kind}">Entendido</button>
        </div>
      </div>
    `).join("");
  }

  function wirePlanWarnings(scope){
    if(!scope) return;
    scope.querySelectorAll("[data-plan-warning-dismiss]").forEach(btn => {
      btn.addEventListener("click", () => {
        markPlanWarningSeen(btn.dataset.planWarningDismiss);
        const card = scope.querySelector(`[data-plan-warning="${btn.dataset.planWarningDismiss}"]`);
        if(card) card.remove();
      });
    });
    scope.querySelectorAll("[data-plan-warning-cta]").forEach(btn => {
      btn.addEventListener("click", async () => {
        markPlanWarningSeen(btn.dataset.planWarningCta);
        // Correction 09: la oferta se lee FRESCA al abrir la hoja. El modo de
        // compra (tarjeta / respaldo manual / bloqueado) puede haber cambiado
        // desde que se pintó el aviso —un deploy que configura la pasarela, un
        // pago que se abrió en otra pestaña— y una copia vieja podría ofrecer el
        // canal equivocado.
        const fresco = await loadPlan({ force: true });
        const plan = fresco || planState;
        showUpgradeSheet(plan && plan.upgrade, { reason: null, plan: plan && plan.plan });
      });
    });
  }

  // The hard paywall. Rendered ONLY from what the server just refused with —
  // never from a limit this file worked out on its own. It answers, in
  // order: what happened, what you can still do for free, what Plus gives,
  // what it costs, and what it covers. One primary action, no countdown, no
  // "solo quedan X", no three-column comparison.
  function showUpgradeSheet(upgrade, ctx){
    const c = ctx || {};
    const offer = upgrade && upgrade.available ? upgrade : null;
    const money = (n) => `$${Number(n).toLocaleString("es-MX")} MXN`;
    // Qué cubre Plus lo dice el servidor (offer.coverageText), no esta pantalla.
    const unlocks = plusPitch(offer);
    // MON-003 Correction 09. CÓMO se compra lo decide el servidor
    // (`offer.checkout`), no esta pantalla. MON-002 escribía aquí "escríbenos y
    // activamos Plus" siempre, porque entonces no había checkout; con el pago con
    // tarjeta funcionando eso contradecía al propio botón.
    //   card    -> el camino normal: el botón abre el pago con tarjeta.
    //   manual  -> la pasarela no está configurada y nada puede estar cobrando:
    //              el respaldo es escribirle a QRACKS. Sin botón de pago.
    //   blocked -> la pasarela no está disponible y PUEDE haber un pago anterior
    //              abierto: ni botón ni contacto; pagar por otro lado sería
    //              arriesgar un segundo cobro.
    // Un valor desconocido se trata como tarjeta: nunca se cae en el copy manual
    // por omisión.
    //   unavailable -> (Correction 10) la pasarela está mal configurada: no es
    //              una decisión comercial, así que ni botón ni contacto.
    // MON-003: con un pago esperando confirmación, la hoja espera: ni botón ni
    // otra vía. Cualquier modo cede ante esto.
    const esperando = !!awaitingPayment();
    const mode = !offer ? null : esperando ? "awaiting"
      : (["card", "manual", "blocked", "unavailable"].includes(offer.checkout) ? offer.checkout : "card");
    // Sin oferta. Si la quiniela YA tiene un plan por encima de Gratis, no hay
    // nada más que comprar y lo honesto es la conversación ("escríbenos" para un
    // grupo más grande). Si sigue en Gratis, que no haya oferta sólo puede ser que
    // no se pudo leer: decir "escríbenos" ahí sería mandar a pedir a mano algo
    // que se compra en línea (Correction 09).
    const noOfferText = (c.plan && c.plan !== "FREE")
      ? (c.noOffer || "Escríbenos para revisar las opciones de tu quiniela.")
      : "No pudimos cargar las opciones de tu plan ahora mismo. Intenta de nuevo en unos minutos.";
    const manualHowTo = "El pago con tarjeta no está disponible por ahora. "
      + (offer && offer.contact
          ? `Escríbenos a ${offer.contact} y activamos Plus en esta quiniela.`
          : "Escríbenos y activamos Plus en esta quiniela.");
    const howTo = !offer ? ""
      : mode === "awaiting"
        ? "Estamos confirmando tu pago. En cuanto se confirme, tu quiniela tendrá Plus. No hace falta pagar otra vez."
      : mode === "manual" ? manualHowTo
      : mode === "unavailable"
        ? "El pago con tarjeta no está disponible en este momento. Vuelve a intentarlo más tarde."
      : mode === "blocked"
        ? "Ahora mismo no podemos abrir un pago nuevo: puede haber uno anterior todavía abierto. Si ya empezaste uno, termínalo en esa pestaña; si no, vuelve a intentarlo más tarde."
        : "Pagas con tarjeta en la página segura de Stripe. Plus se activa en esta quiniela en cuanto se confirma el pago.";
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "qz-modal-overlay";
      overlay.innerHTML = `
        <div class="qz-modal-card" role="alertdialog" aria-modal="true" aria-label="${esc(c.headline || "Plan Plus")}">
          <div class="qz-modal-title">${esc(c.headline || "Plan Plus")}</div>
          <div class="qz-modal-message">
            ${c.alternative ? `<p>${esc(c.alternative)}</p>` : ``}
            ${offer ? `
              <p>${esc(unlocks)}</p>
              <p><strong>${esc(money(offer.priceMXN))}, un solo pago.</strong> ${esc(offer.scope || "")}</p>
              <p class="muted">${esc(howTo)}</p>
            ` : `
              <p class="muted">${esc(noOfferText)}</p>
            `}
          </div>
          <div class="qz-modal-actions">
            <button class="qz-modal-cancel" id="qz-upgrade-close">Cerrar</button>
            ${mode === "card" ? `<button class="qz-modal-confirm qz-modal-not-destructive" id="qz-upgrade-cta">Pasar a Plus</button>` : ``}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const focusTrap = attachModalFocusTrap(overlay);
      const cleanup = (result) => {
        document.removeEventListener("keydown", onKey);
        focusTrap.release();
        overlay.remove();
        resolve(result);
      };
      const onKey = (e) => { if(e.key === "Escape") cleanup(false); };
      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e) => { if(e.target === overlay) cleanup(false); });
      overlay.querySelector("#qz-upgrade-close").addEventListener("click", () => cleanup(false));
      const cta = overlay.querySelector("#qz-upgrade-cta");
      if(cta){
        cta.addEventListener("click", async () => {
          // `source` is a real column; a field the table has no room for
          // would simply be dropped, which is not instrumentation.
          trackEvent("upgrade_cta_clicked", { source: c.source || (c.limitType ? "paywall_" + c.limitType : "paywall") });
          cta.disabled = true;
          cta.textContent = "Abriendo el pago…";
          // MON-003: el checkout lo crea el SERVIDOR. Esta pantalla no conoce
          // el precio que se va a cobrar, ni el torneo, ni el plan — sólo pide
          // que se prepare el pago y sigue el enlace que le devuelven.
          const started = await startCheckout();
          // Un enlace tiene que ser un enlace. Sin esta comprobación,
          // `location.href = null` manda al navegador a la cadena "null" y el
          // organizador acaba en una página que no existe tras pulsar "Pasar a
          // Plus". El servidor ya no lo devuelve nulo; esto es el cinturón.
          if(started && typeof started.checkoutUrl === "string"
            && /^https:\/\/[^\s]+$/.test(started.checkoutUrl)){
            cleanup(true);
            window.location.href = started.checkoutUrl;
            return;
          }
          cta.disabled = false;
          cta.textContent = "Pasar a Plus";
          // No se abrió ningún pago: se cierra la hoja y se dice por qué, sin
          // fingir un cobro. Qué se ofrece a cambio depende del motivo (abajo).
          cleanup(true);

          const motivo = started && started.reason;
          // CORRECTION 05 (P1-3). "Hay un pago en curso" NO es un error del que
          // reintentar: es un cobro que puede estar hecho ya. Se cierra la hoja y
          // se pasa a CONFIRMARLO, que es lo que el servidor pedía al devolver el
          // id de la compra. Invitar a abrir otro checkout aquí era invitar a un
          // segundo cargo.
          if(motivo === "payment_in_progress" && started.purchaseId){
            await runCheckoutRecovery(started.purchaseId, null);
            return;
          }
          // Lo mismo si el cobro ya quedó registrado y sólo falta que se refleje.
          if(motivo === "payment_already_recorded"){
            const pend = readPendingPurchase();
            if(pend && pend.id){
              await runCheckoutRecovery(pend.id, pend.sess || null);
              return;
            }
            invalidatePlan();
            const tras = await loadPlan({ force: true });
            await render();
            // Lo que se dice sale del plan RECIÉN leído: si ya es Plus, eso; si
            // todavía no, que el pago consta y se está terminando de aplicar. El
            // contacto queda sólo como soporte para una anomalía, nunca como la
            // forma de comprar.
            toast(tras && tras.plan === "PLUS"
              ? "Tu quiniela ya tiene Plus."
              : "Tu pago ya está registrado y estamos terminando de activarlo. Si en unos minutos no ves Plus, escríbenos.");
            return;
          }
          // "Ya se está preparando" no es un error: es otra pestaña —o el clic
          // anterior— en mitad del proceso. El servidor sólo permite un alta a
          // la vez por torneo, que es lo que impide dos cobros.
          // `unavailable` sólo llega cuando el servidor comprobó que la pasarela
          // no está configurada Y que nada del torneo puede estar cobrando (si
          // algo pudiera, contesta `checkout_unavailable`). Sólo ahí cabe el
          // respaldo manual.
          toast(motivo === "unavailable"
            ? manualHowTo
            : (motivo === "replacement_in_progress" || motivo === "checkout_stale_observation")
              ? "Ya estamos preparando tu pago. Espera unos segundos y vuelve a intentarlo."
              : motivo === "payments_misconfigured"
                ? "El pago con tarjeta no está disponible en este momento. Vuelve a intentarlo más tarde."
              : motivo === "checkout_unavailable"
                // Sin invitar a pagar por otro lado: puede haber un pago abierto.
                ? "Todavía no podemos abrir un pago nuevo. Si ya empezaste uno, termínalo en esa pestaña; si no, vuelve a intentarlo más tarde."
                : "No pudimos abrir el pago. Inténtalo de nuevo en un momento.");
        });
        cta.focus();
      } else {
        overlay.querySelector("#qz-upgrade-close").focus();
      }
    });
  }

  // Turns the server's structured refusal into the paywall. Falls back to a
  // plain message if a response ever arrives without the extra fields (an
  // older cached client against a newer server, or any unexpected shape) —
  // never throws, never shows "undefined".
  function showPlanBlock(errorBody){
    invalidatePlan();
    const body = errorBody || {};
    if(body.error === "plan_participant_limit_reached"){
      return showUpgradeSheet(body.upgrade, {
        plan: body.plan,
        limitType: "participants",
        headline: Number.isFinite(body.limit)
          ? `Tu quiniela llegó a ${body.limit} personas`
          : "Tu quiniela ya está llena",
        alternative: "Es el máximo de tu plan. Puedes quitar a alguien de la lista para hacer espacio.",
        // Nothing above Plus exists, so this deliberately points at a
        // conversation rather than at a tier that does not exist yet.
        noOffer: "Si necesitas un grupo más grande, escríbenos.",
      });
    }
    if(body.error === "plan_lifecycle_limit_reached"){
      return showUpgradeSheet(body.upgrade, {
        plan: body.plan,
        limitType: "rounds",
        headline: Number.isFinite(body.limit)
          ? `Llegaste a ${body.limit} jornada${body.limit === 1 ? "" : "s"}`
          : "Llegaste al máximo de jornadas de tu plan",
        alternative: "Es el máximo de tu plan. Tus jornadas, resultados y tabla siguen aquí y funcionando.",
      });
    }
    toast(humanizeError(body.error, body));
    return Promise.resolve(false);
  }

  // The plan line and any pending warning, drawn together at the top of
  // Admin. Async and non-blocking: Admin renders immediately and this fills
  // in, so a slow or failed plan read never holds up the screen.
  async function renderPlanStrip(){
    const strip = document.getElementById("qz-plan-strip");
    if(!strip || ROUTE !== "quiniela" || !SLUG) return;
    if(!(currentUser && currentUser.isAdmin)) return; // Admin-only, by design
    const plan = await loadPlan();
    const liveStrip = document.getElementById("qz-plan-strip");
    if(!liveStrip || !plan) return;
    // La confirmación del pago va al INICIO del panel —antes del título y del
    // consejo—: es lo que el organizador vino a ver.
    const slot = document.getElementById("qz-payment-confirmed-slot");
    if(slot){
      slot.innerHTML = paymentConfirmedHtml(plan);
      wirePaymentConfirmed(slot);
    }
    liveStrip.innerHTML = tournamentStatusHtml(plan) + planStatusHtml(plan)
      + paymentAwaitingHtml(plan) + tournamentEndedCardHtml(plan) + planWarningHtml(plan);
    wirePlanWarnings(liveStrip);
    wirePlanOfferCta(liveStrip);
    wireTournamentActions(liveStrip);
  }

  // MON-003. El plan también vive en Ajustes: es donde un Admin busca "qué plan
  // tengo y cómo lo mejoro". Mismo origen que la franja (loadPlan, del servidor)
  // y el mismo botón; no depende de la contraseña de dueño porque el plan es
  // cosa del Admin (el servidor ya lo exige para leerlo y para pagar).
  function settingsPlanCardHtml(){
    return `<div class="card" id="qz-settings-plan">
      <div class="section-title"><span class="display" style="font-size:18px;">Tu plan</span></div>
      <div id="qz-settings-plan-body"><p class="muted" style="margin:0;">Cargando tu plan…</p></div>
    </div>`;
  }

  async function renderSettingsPlan(){
    if(!document.getElementById("qz-settings-plan-body")) return;
    if(!(currentUser && currentUser.isAdmin)) return;
    const plan = await loadPlan().catch(() => null);
    const live = document.getElementById("qz-settings-plan-body");
    if(!live) return;
    if(!plan || !plan.planLabel){
      live.innerHTML = `<p class="muted" style="margin:0;">No pudimos cargar tu plan ahora mismo. Intenta de nuevo en unos minutos.</p>`;
      return;
    }
    const bits = [`Plan ${esc(plan.planLabel)}`];
    if(plan.participants) bits.push(`${plan.participants.used} de ${plan.participants.limit} persona${plan.participants.limit === 1 ? "" : "s"}`);
    if(plan.rounds && plan.rounds.applies) bits.push(`${plan.rounds.used} de ${plan.rounds.limit} jornada${plan.rounds.limit === 1 ? "" : "s"}`);
    const offer = plan.upgrade && plan.upgrade.available ? plan.upgrade : null;
    const pitch = plusPitch(offer);
    const tienePlus = plan.plan === "PLUS"
      ? (plan.coverage && plan.coverage.text ? `Tu quiniela tiene Plus: ${plan.coverage.text}.` : "Tu quiniela tiene Plus.")
      : "";
    live.innerHTML = `
      <p style="margin:0 0 8px;" id="qz-settings-plan-status">${bits.join(" · ")}</p>
      ${tienePlus ? `<p class="muted" style="margin:0;" id="qz-settings-plan-plus">${esc(tienePlus)}</p>` : ``}
      ${paymentAwaitingHtml(plan)}
      ${pitch && !awaitingPayment() ? `<p class="muted" style="margin:0 0 10px;">${esc(pitch)}</p>` : ``}
      ${planOfferCtaHtml(plan, "settings")}
    `;
    wirePlanOfferCta(live);
  }

  async function renderAdmin(main){
    const subtabs = [
      {id:"rondas", label:"Jornadas"},
      {id:"resultados", label:"Resultados"},
      {id:"participacion", label:"Participación"},
      {id:"participantes", label:"Participantes"},
      {id:"reglas", label:"Tus reglas"},
      {id:"dueno", label:"Ajustes"},
    ];
    main.innerHTML = `
      <div id="qz-payment-confirmed-slot"></div>
      ${screenHeaderHtml("admin", "Panel de administración")}
      <div id="qz-plan-strip"></div>
      <div class="qz-tabs" id="qz-admin-subtabs" style="margin-bottom:14px;">
        ${subtabs.map(t=>`<button class="qz-tab" style="color:${t.id===adminSubTab?'var(--pitch-dark)':'var(--ink-soft)'};border-bottom-color:${t.id===adminSubTab?'var(--gold)':'transparent'};" data-sub="${t.id}">${t.label}</button>`).join("")}
      </div>
      <div id="qz-admin-body"></div>
    `;
    wireScreenHeader(main, "admin");
    renderPlanStrip();
    root.querySelectorAll("[data-sub]").forEach(btn => {
      btn.addEventListener("click", () => {
        adminSubTab = btn.dataset.sub;
        renderAdmin(main);
        const newActive = document.querySelector(`[data-sub="${adminSubTab}"]`);
        if(newActive) newActive.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      });
    });
    wireTabScrollFade(document.getElementById("qz-admin-subtabs"));
    const body = document.getElementById("qz-admin-body");
    // DATA-004: se devuelve la promesa del sub-render. Varios de ellos son
    // asíncronos, así que quien necesite escribir algo DESPUÉS de repintar
    // —el import, sin ir más lejos— puede esperar en vez de que su mensaje
    // aparezca y desaparezca en el mismo parpadeo.
    if(adminSubTab==="rondas") return renderAdminRondas(body);
    else if(adminSubTab==="resultados") return renderAdminResultados(body);
    else if(adminSubTab==="participacion") return renderAdminParticipacion(body);
    else if(adminSubTab==="participantes") return renderAdminParticipantes(body);
    else if(adminSubTab==="reglas") return renderAdminReglas(body);
    else if(adminSubTab==="dueno") return renderAdminOwner(body);
  }

  // ==========================================================================
  // MS2 · Ayuda por función («Cómo funciona»).
  //
  // Un bloque corto junto a la función que explica. «Entendido» y «Ocultar» lo
  // retiran; «ⓘ Cómo funciona» lo vuelve a abrir. Se recuerda por quiniela y por
  // persona en este navegador (localStorage): otro dispositivo lo vuelve a
  // mostrar. También se retira solo cuando la persona ya hizo esa tarea.
  // ==========================================================================
  const HELP_TEXTS = Object.freeze({
    "reglas.puntos": "Cada acierto (ganador o empate) suma los puntos que elijas. Si los cambias, se recalcula toda la tabla, también las jornadas que ya tienen resultados.",
    "reglas.extras": "Las preguntas extra suman cuando tú marcas quién acertó. Las del torneo se califican aquí; las de cada jornada, en Admin → Resultados.",
    "reglas.pagos": "Tus amigos te pagan directamente a ti. Marca «Pagó» en Participantes cuando recibas el pago. La penalización resta puntos por cada jornada que cierre sin pago.",

  function betAnswerCount(bet){

    meta.participants.forEach(p => {

  function betHitCount(bet){

    }
    let n = 0;
    meta.rounds.forEach(r => {

  function betCloseLine(bet){
    if(bet.scope !== "temporada") return "Cierra con cada jornada, a la hora de cierre de esa jornada";
    const c = betCloseInfo(bet);
    if(c.kind === "none") return "";
    if(c.kind === "own"){
      const when = fmtWhenTz(new Date(c.at).toISOString());
      const r = c.round;
      if(c.closed){
        if(bet.closeSource === "migration_cutoff") return `Cerró el ${when}, por protección: ${bet.closeFlag === "ambiguous" ? "no se pudo confirmar con qué jornada cerraba" : "su jornada de cierre ya no existía"}`;
        if(bet.closeSource === "protective") return "Cerrada por protección: su jornada no tenía una hora de cierre válida";
        if(bet.closeSource === "tournament_end") return `Cerró el ${when}, al terminar el torneo`;
        return r && sameInstantMs(r.deadline, c.at) ? `Cerró con la Jornada ${r.number}: ${when}` : `Cerró el ${when}`;
      }
      if(!r) return `Cierra el ${when} (su jornada ya no existe)`;
      if(!sameInstantMs(r.deadline, c.at)) return `Cierra el ${when}; la Jornada ${r.number} cierra el ${fmtWhenTz(r.deadline)}`;
      return `Cierra con la Jornada ${r.number}: ${when}${r.published === false ? " (todavía sin publicar)" : ""}`;
    }

    if(!r) return `Cierra con la Jornada ${bet.closesAtRound} (por ahora no hay una Jornada ${bet.closesAtRound})`;
    if(c.at == null) return c.closed ? `Cerrada: la Jornada ${r.number} no tiene una hora de cierre válida` : `Cierra con la Jornada ${r.number} (todavía sin hora de cierre)`;
    if(c.closed) return `Cerró con la Jornada ${r.number}: ${fmtWhenTz(r.deadline)}`;

    // A protected rule saved with the admin password; the server keeps the old
    // value without it (ruleFieldsKept), and that is said, never absorbed.
    async function saveProtected(field, value, errId, okMsg){
      const previous = field in meta.settings ? meta.settings[field] : undefined;
      meta.settings[field] = value;
      const result = await setMetaWithError(meta);
      if(!result.ok){
        if(!result.reconciled){ if(previous === undefined) delete meta.settings[field]; else meta.settings[field] = previous; }
        setupFieldError(errId, humanizeError(result.error, result));
        return false;
      }
      if(result.ruleFieldsKept){
        const fresh = await getMeta({ owner: adminOrOwnerCred() });

    // The penalty (not protected, as before). Any change reconciles first, so

    document.getElementById("qz-r-pen-save").addEventListener("click", async (e) => {
      // Read first: once something was awaited (the confirmation), currentTarget is null.
      const btn = e.currentTarget;
      let next;
      if(st.pen.enabled){
        const pp = document.getElementById("qz-r-pen-points"), ps = document.getElementById("qz-r-pen-start");
        st.pen.points = pp.value; st.pen.start = ps.value;
        const n = parsePositiveInt(pp.value);
        if(n == null){ setupFieldError("qz-r-pen-err", "Escribe cuántos puntos se restan (número entero de 1 en adelante).", pp); return; }
        const from = parsePositiveInt(ps.value);
        if(from == null){ setupFieldError("qz-r-pen-err", "Escribe desde qué jornada (número entero de 1 en adelante).", ps); return; }
        next = { enabled: true, startsAtRound: from, pointsPerRound: n };
      } else {
        // R4: what the penalty takes off TODAY (penaltyPointsFor: the stored
        // ledger plus closed rounds not yet settled, exactly what the table
        // shows), computed without writing anything; «Cancelar» saves nothing.
        // What happens to those discounts when it is off is unchanged.
        const effective = meta.participants.map(p => penaltyPointsFor(p)).filter(x => x > 0);
        if(effective.length){
          const total = effective.reduce((a, b) => a + b, 0);
          const ok = await qzConfirm("Hoy la penalización le resta " + total + " " + pointsWord(total) + " en total a " + effective.length + " " + (effective.length === 1 ? "persona" : "personas") + ". Si la apagas, dejas de restar puntos y esos descuentos dejan de contar en la tabla mientras esté apagada; quedan guardados y regresan si la vuelves a activar.",
            { title: "¿Apagar la penalización?", confirmLabel: "Apagar", cancelLabel: "Cancelar" });
          // Cancelled: nothing saved, and the switch shows what is stored again.
          if(!ok){ st.pen.enabled = true; repaint(); return; }
        }
        next = { ...penalty, enabled: false };
      }
      const done = setupBusy(btn, "Guardando…");
      const before = meta.paymentPenalty ? { ...meta.paymentPenalty } : undefined;
      const participantsSnapshot = JSON.parse(JSON.stringify(meta.participants));
      // Never configured before: the rounds that already closed are settled as
      // they were (no penalty), so turning it on never charges them backwards.
      if(!meta.paymentPenalty) meta.paymentPenalty = { enabled: false, startsAtRound: null, pointsPerRound: 1 };
      reconcilePenaltyLedger(meta);
      meta.paymentPenalty = next;
      const result = await setMetaWithError(meta);

      if(!result.ok){
        if(!result.reconciled){ if(before) meta.paymentPenalty = before; else delete meta.paymentPenalty; meta.participants = participantsSnapshot; }

    // Questions.
    const newBtn = document.getElementById("qz-rb-new");
    if(newBtn) newBtn.addEventListener("click", () => { st.form = { id: null, template: "", text: "", scope: "", points: "", closes: "" }; repaint(); });
    body.querySelectorAll("[data-rb-edit]").forEach(b => b.addEventListener("click", () => {
      const bet = bets.find(x => x.id === b.dataset.rbEdit);
      if(!bet) return;
      const tpl = EXTRA_TEMPLATES.find(t => t.text === bet.label && t.scope === bet.scope);
      st.form = { id: bet.id, template: tpl ? tpl.key : EXTRA_CUSTOM_KEY, text: bet.label, scope: bet.scope, points: String(bet.points), closes: bet.scope === "temporada" ? betFormCloses(bet) : "" };
      repaint();
    }));
    const tplSel = document.getElementById("qz-rb-tpl");
    if(tplSel) tplSel.addEventListener("change", () => {
      const t = extraTemplate(tplSel.value);
      st.form.template = tplSel.value;
      if(!st.form.points) st.form.points = String(t ? t.points : EXTRA_CUSTOM_POINTS);
      if(!t && !st.form.scope) st.form.scope = "jornada";
      if(!st.form.closes){ const first = closableRounds().find(r => r.published !== false) || closableRounds()[0]; if(first) st.form.closes = String(first.number); }
      repaint();
    });
    const keepTyped = () => {
      const t = document.getElementById("qz-rb-text"), p = document.getElementById("qz-rb-points"), c = document.getElementById("qz-rb-closes");
      if(t) st.form.text = t.value;
      if(p) st.form.points = p.value;
      if(c) st.form.closes = c.value;
    };
    body.querySelectorAll('input[name="qz-rb-scope"]').forEach(r => r.addEventListener("change", () => { keepTyped(); st.form.scope = r.value; repaint(); }));
    const cancelForm = document.getElementById("qz-rb-cancel");
    if(cancelForm) cancelForm.addEventListener("click", () => { st.form = null; repaint(); });
    const saveForm = document.getElementById("qz-rb-save");
    if(saveForm) saveForm.addEventListener("click", async () => {
      keepTyped();
      const f = st.form;
      const editingBet = f.id ? meta.customBets.find(b => b.id === f.id) : null;
      const tpl = extraTemplate(f.template);
      const problem = extraQuestionProblem({ template: f.template, text: f.text, points: f.points }, meta.customBets.map(b => ({ key: b.id, text: b.label })), f.id);
      if(problem){ setupFieldError("qz-rb-err", problem); return; }
      const scope = tpl ? tpl.scope : (editingBet && betAnswerCount(editingBet) ? editingBet.scope : (f.scope || "jornada"));
      // It closed while this form was open: the close it had stays.
      if(scope === "temporada" && betCloseFixed(editingBet) && f.closes !== "" && parsePositiveInt(f.closes) !== editingBet.closesAtRound){
        f.closes = String(editingBet.closesAtRound);
        repaint();
        toast("Esta pregunta acaba de cerrar: su cierre ya no se cambia. No se guardó nada.");
        return;
      }
      // MS2 · D4: its close only changes when the admin picks another round
      // (relinked by id), or picks its own round again after that round moved
      // (its close follows it). «keep» and the same round change nothing.
      let closes = null, relinkTo = null, moveTo = null;
      if(scope === "temporada"){
        const info = editingBet && editingBet.scope === "temporada" ? betCloseInfo(editingBet) : null;
        if(betCloseFixed(editingBet) || (f.closes === "keep" && info)) closes = editingBet.closesAtRound;
        else {
          const n = parsePositiveInt(f.closes);
          const target = n != null ? closableRounds().find(r => r.number === n) || meta.rounds.find(r => r.number === n) || null : null;
          if(info && info.kind === "own" && target && info.round && target.id === info.round.id){
            closes = editingBet.closesAtRound;
            if(!sameInstantMs(target.deadline, info.at)) moveTo = new Date(target.deadline).toISOString();
          } else {
            closes = n;
            if(target && (!info || info.kind === "own")) relinkTo = target.id;
          }
        }
      }
      if(scope === "temporada" && closes == null){ setupFieldError("qz-rb-err", "Elige con qué jornada cierra."); return; }
      const newPoints = parsePositiveInt(f.points);
      if(editingBet && newPoints !== editingBet.points){
        const hits = betHitCount(editingBet);
        if(hits){
          const ok = await qzConfirm(`Ya marcaste ${hits} ${hits === 1 ? "acierto" : "aciertos"} en esta pregunta. Al cambiar los puntos, la tabla se recalcula (${editingBet.points} → ${newPoints} puntos cada uno).`,
            { title: "¿Cambiar los puntos?", confirmLabel: "Cambiar puntos", cancelLabel: "Cancelar" });
          if(!ok) return;
        }
      }
      const snapshot = JSON.parse(JSON.stringify(meta.customBets));
      const label = tpl ? tpl.text : f.text.trim();
      if(editingBet){
        editingBet.label = label;
        editingBet.scope = scope;
        editingBet.points = newPoints;
        editingBet.closesAtRound = closes;
        if(relinkTo != null) editingBet.closesRoundId = relinkTo;
        if(moveTo != null) editingBet.closesAt = moveTo;
      } else {
        meta.customBets.push({ id: uid("cb"), label, scope, points: newPoints, closesAtRound: closes, ...(relinkTo != null ? { closesRoundId: relinkTo } : {}) });
      }
      saveForm.disabled = true;
      const result = await setMetaWithError(meta, { betsEdited: true });
      saveForm.disabled = false;
      if(!result.ok){
        if(!result.reconciled) meta.customBets = snapshot;
        setupFieldError("qz-rb-err", result.error === "bet_close_required" || result.error === "bet_close_past" || result.error === "bet_close_locked" || result.error === "bet_close_invalid"
          ? humanizeError(result.error, result) : `${humanizeError(result.error, result)} No se guardó la pregunta.`);
        return;
      }
      st.form = null;
      toast(editingBet ? "✅ Listo, la pregunta quedó actualizada." : "✅ Listo, la pregunta quedó guardada.");
      repaint();
    });
    body.querySelectorAll("[data-rb-del]").forEach(b => b.addEventListener("click", async () => {
      const bet = bets.find(x => x.id === b.dataset.rbDel);
      if(!bet) return;
      const answers = betAnswerCount(bet), hits = betHitCount(bet);
      const ok = await qzConfirm(answers || hits
        ? `Se borran las ${answers} respuestas de tus participantes y los ${hits} aciertos marcados, y esos puntos salen de la tabla. Esto no se puede deshacer.`
        : "Se quita de tus reglas. Nadie la ha respondido todavía.",
        { title: "¿Quitar esta pregunta?", confirmLabel: answers || hits ? "Quitar pregunta" : "Quitar", cancelLabel: "Cancelar" });
      if(!ok) return;
      const betsBefore = meta.customBets.slice();
      const participantsSnapshot = JSON.parse(JSON.stringify(meta.participants));
      const roundsSnapshot = JSON.parse(JSON.stringify(meta.rounds));
      meta.customBets = meta.customBets.filter(x => x.id !== bet.id);
      meta.participants.forEach(p => { if(p.customBetAnswers) delete p.customBetAnswers[bet.id]; });
      meta.rounds.forEach(r => { if(r.customBetResults) delete r.customBetResults[bet.id]; });
      const result = await setMetaWithError(meta);
      if(!result.ok){
        if(!result.reconciled){ meta.customBets = betsBefore; meta.participants = participantsSnapshot; meta.rounds = roundsSnapshot; }
        toast(humanizeError(result.error, result));
        return;
      }
      toast("✅ Listo, la pregunta se quitó.");
      repaint();
    }));
    // Grading one tournament question at a time.
    const gradeSel = document.getElementById("qz-r-grade-sel");
    if(gradeSel && gradeBet){
      gradeSel.addEventListener("change", () => { st.grade = gradeSel.value; repaint(); });
      renderReglasGrade(document.getElementById("qz-r-grade-body"), gradeBet);
    }
  }
  function renderReglasGrade(box, bet){
    const people = meta.participants.slice().sort((a, b) => a.name.localeCompare(b.name, "es", { sensitivity: "base" }));
    const answered = people.filter(p => p.customBetAnswers && p.customBetAnswers[bet.id] && p.customBetAnswers[bet.id].guess).length;
    const hits = betHitCount(bet);
    const locked = customBetsLocked(bet);
    const close = betCloseLine(bet);
    box.innerHTML = `
      <p class="muted qz-tight">${esc(answered)} de ${esc(people.length)} respondieron · ${esc(hits)} ${hits === 1 ? "marcado como acertado" : "marcados como acertados"}</p>
      ${locked
        ? `<p class="qz-wz-note">${esc(close)}. Ya cerró: marca a quien acertó; ${esc(markedPointsWhen())}.</p>`
        : `<p class="qz-wz-warn">Esta pregunta sigue abierta: tus amigos todavía pueden cambiar su respuesta. Si marcas un acierto ahora y luego la cambian, la marca se queda. Conviene calificar después del cierre.</p>`}
      <p class="muted qz-tight">Cada quien escribe su respuesta a su manera; tú decides quién acertó.</p>
      <div class="qz-table-scroll">
        <table class="qz-grade-table">
          <thead><tr><th class="qz-sticky-col">Participante</th><th>Respondió</th><th style="text-align:center;">¿Acertó?</th></tr></thead>
          <tbody>
            ${people.map(p => {
              const ans = p.customBetAnswers && p.customBetAnswers[bet.id];
              return `
                <tr>
                  <td class="qz-sticky-col qz-name-cell" title="${esc(p.name)}">${esc(p.name)}</td>
                  <td>${ans && ans.guess ? esc(ans.guess) : '<span class="muted">—</span>'}</td>
                  <td style="text-align:center;"><input type="checkbox" data-role="cb-correct" data-pid="${esc(p.id)}" data-bet="${esc(bet.id)}" ${ans && ans.correct ? "checked" : ""} ${ans && ans.guess ? "" : "disabled"} aria-label="¿Acertó ${esc(p.name)}?"></td>
                </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
    box.querySelectorAll("[data-role=cb-correct]").forEach(checkbox => {
      checkbox.addEventListener("change", async () => {
        const pid = checkbox.dataset.pid;
        const betId = checkbox.dataset.bet;
        const p = meta.participants.find(x => x.id === pid);
        if(!p || !p.customBetAnswers || !p.customBetAnswers[betId]) return;
        p.customBetAnswers[betId].correct = checkbox.checked;
        const ok = await setMeta(meta);
        if(ok) toast(checkbox.checked ? `${p.name} ✅` : `Se quitó el punto de ${p.name}`);
        else { checkbox.checked = !checkbox.checked; p.customBetAnswers[betId].correct = checkbox.checked; toast("No se pudo guardar, intenta de nuevo"); }
        if(ok && checkbox.checked) markHelpLearned("reglas.extras");
      });
    });
  }

  // "Participación": who has/hasn't submitted picks for open rounds — status only, never reveals picks
  // Sprint 15.1 — S15-1: this is the tracked ("invite_shared") main invite
  // action, wired to the header's "🔗 Copiar link" button. Copies a short
  // contextual message (quiniela name + CTA + link) instead of the bare URL,
  // so the organizer doesn't have to type context by hand when pasting into
  // WhatsApp/Telegram/Messages — reuses the same idea already used for the
  // "picks faltantes" reminder text, just applied here too.
  function inviteMessage(link){
    return `Únete a mi quiniela "${meta.groupName}" en QRACKS ⚽\n${link}`;
  }
  async function copyAccessLink(){
    if(currentUser && currentUser.isAdmin && meta.rounds.length === 0){
      const wantsToCreateJornada = await qzConfirm(
        "Aún no has creado ninguna jornada.\n\nPuedes compartir el enlace ahora, pero tus participantes no podrán realizar pronósticos hasta que agregues una jornada.",
        { confirmLabel: "Crear jornada", cancelLabel: "Compartir de todas formas", destructive: false }
      );
      if(wantsToCreateJornada){
        activeTab = "admin";
        adminSubTab = "rondas";
        await render();
        document.getElementById("qz-admin-body")?.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      // "Compartir de todas formas" — falls through to the normal share below, unchanged.
    }
    // MON-002B: sharing a full quiniela sends people to a screen that will
    // reject them, so the Admin is told BEFORE the link reaches anyone —
    // and then still allowed to share it, because a link that outlives the
    // full state is a perfectly reasonable thing to send.
    if(currentUser && currentUser.isAdmin){
      const plan = await loadPlan();
      if(plan && plan.participants && plan.participants.remaining === 0){
        const wantsUpgrade = await qzConfirm(
          "Quien abra el link no va a poder registrarse hasta que se libere un lugar.",
          {
            title: "Tu quiniela está llena",
            confirmLabel: (plan.upgrade && plan.upgrade.available) ? "Ver plan Plus" : "Entendido",
            cancelLabel: "Compartir de todos modos",
            destructive: false
          }
        );
        if(wantsUpgrade){
          // Fresca, por la misma razón que el aviso (Correction 09).
          const fresco = (await loadPlan({ force: true })) || plan;
          if(fresco.upgrade && fresco.upgrade.available){
            await showUpgradeSheet(fresco.upgrade, {
              plan: fresco.plan,
              limitType: "participants",
              headline: `Tu quiniela llegó a ${plan.participants.limit} personas`,
              alternative: "Es el máximo de tu plan. Puedes quitar a alguien de la lista para hacer espacio.",
              noOffer: "Si necesitas un grupo más grande, escríbenos."
            });
          }
          return;
        }
      }
    }
    const link = `${window.location.origin}${ROUTE === "root" ? "/" : "/q/" + esc(SLUG)}`;
    try{
      await navigator.clipboard.writeText(inviteMessage(link));
      if(currentUser && currentUser.isAdmin){
        markSharedInvite(SLUG);
        await render();
      }
      trackEvent("invite_shared", { source: "copy_link" });
      toast("Enlace copiado ✓");
    }catch(e){
      toast("No se pudo copiar, intenta de nuevo");
    }
  }
  function accessLinkCardHtml(){
