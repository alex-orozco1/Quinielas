  }
  // Cached in memory only (never persisted) once the admin/platform owner types
  // their password correctly — attached automatically to writes that need it, so
  // the server can verify each request instead of trusting the browser alone.
  let ownerPasswordCache = null;
  let platformPasswordCache = null;
  let currentUserPinCache = null;
  function adminOrOwnerCred(){
    return ownerPasswordCache || ((currentUser && currentUser.isAdmin) ? currentUserPinCache : null);
  }
  // The server only compares a PIN against the participant it names: a PIN
  // goes out with X-Qracks-Participant (this user's id), anything else (the
  // admin password) goes out alone and is only ever compared against the
  // admin password. Without that binding, one value was checked against every
  // participant at once, so a guess that matched the guesser's own PIN cost
  // nothing and still revealed whether it was also an admin's.
  function setAuthHeaders(headers, cred, bindTo){
    if(!cred) return headers;
    headers["X-Qracks-Auth"] = cred;
    if(cred === currentUserPinCache && cred !== ownerPasswordCache && currentUser && currentUser.id != null){
      headers["X-Qracks-Participant"] = String(currentUser.id);
    }
    // A PIN typed for one named participant (the creator's, when setting the
    // first admin password) goes out bound to that participant, always.
    if(bindTo != null) headers["X-Qracks-Participant"] = String(bindTo);
    return headers;
  }
  // MON-002B: every meta save routes through the same place so the server's
  // participants revision is adopted after each write. Without that, this
  // tab's own successful save would leave it holding the PREVIOUS revision
  // and its next save would be judged stale — which would quietly turn
  // legitimate removals into no-ops.
  async function setMeta(meta, opts){
    const result = await setMetaWithError(meta, opts);
    return result.ok;
  }
  // MS2 · D4: takes the questions the server stored, keeping each question's
  // object (screens hold them in handlers) and the array itself.
  function adoptStoredBets(target, stored){
    if(!Array.isArray(target.customBets)) target.customBets = [];
    const current = new Map(target.customBets.filter(b => b && typeof b === "object").map(b => [b.id, b]));
    const next = stored.map(sb => {
      const cur = sb && typeof sb === "object" ? current.get(sb.id) : null;
      if(!cur) return sb;
      Object.keys(cur).forEach(k => { if(!(k in sb)) delete cur[k]; });
      return Object.assign(cur, sb);
    });
    target.customBets.splice(0, target.customBets.length, ...next);
  }
  // Brings `target` (the live meta every screen holds) up to `fresh` IN PLACE,
  // participants included: an existing participant keeps its object and has
  // its fields replaced. Rows already on screen hold those objects in their
  // handlers; swapping in new objects left them editing detached copies, so a
  // rename after "Se agregaron N participantes mientras editabas" said
  // "✅ actualizado" while the save carried the old name.
  function adoptFreshMeta(target, fresh){
    const current = new Map((Array.isArray(target.participants) ? target.participants : []).map(p => [p && p.id, p]));
    const participants = (Array.isArray(fresh.participants) ? fresh.participants : []).map(fp => {
      const cur = fp && current.get(fp.id);
      if(!cur || cur === fp) return fp;
      Object.keys(cur).forEach(k => { if(!(k in fp)) delete cur[k]; });
      return Object.assign(cur, fp);
    });
    // Lo que el servidor no tiene, la pestaña tampoco. Una clave que sólo
    // existía aquí (una penalización recién activada que no se llegó a
    // guardar, una entrada de bitácora de un intento que falló) se iría con el
    // siguiente guardado como si se hubiera aplicado.
    Object.keys(target).forEach(k => { if(!(k in fresh)) delete target[k]; });
    Object.assign(target, fresh, { participants });
  }
  // MS2: el servidor rechazó una pregunta del torneo sin un cierre válido que
  // esta pestaña no acaba de crear ni editar (la borraron en otra pestaña, o
  // esta pestaña está atrasada). Sólo la publicación del asistente y el
  // formulario de preguntas pasan `betsEdited`: ellos reciben el error para
  // corregirlo. Para lo demás, igual que un conflicto: se trae el estado bueno,
  // se repinta y se dice en una línea, en vez de que cada guardado siguiente
  // falle por algo que la persona no tocó.
  const AUTO_MOVE_REFUSED = "Otra persona cambió una pregunta del torneo mientras abrías esta pantalla. Ya ves lo más reciente.";
  // A refused automatic move reloads and repaints, and the repaint tries the
  // move again: once is right (the stored data moved under this tab), but a
  // refusal that does not go away would loop (Technical QA on d4af509). So the
  // move is tried at most twice per page load; after that the old «goleador»
  // stays as it is on the server.
  const AUTO_MOVE_MAX_TRIES = 2;
  const AUTO_MOVE_GAVE_UP = "No pudimos pasar el «goleador» de antes a las preguntas nuevas. Sigue como estaba; no se cambió nada.";
  let autoMoveFailures = 0;
  function autoMoveAllowed(){ return autoMoveFailures < AUTO_MOVE_MAX_TRIES; }
  function isStaleBetRefusal(result, opts){
    return !!result && !result.ok && (result.error === "bet_close_required" || result.error === "bet_close_past") && !(opts && opts.betsEdited);
  }
  async function adoptAfterStaleBet(meta, result, message){
    let adopted = false;
    try{
      const fresh = await getMeta({ owner: adminOrOwnerCred() });
      if(fresh) adoptFreshMeta(meta, fresh);
      adopted = !!fresh;
    }catch(e){ console.error("refresh tras bet_close falló", e); }
    try{ await render(); }catch(e){ console.error("render tras bet_close falló", e); }
    // A function is read after the repaint: the repaint may have tried again.
    if(typeof message === "function") message = message();
    notice(message || "Hubo cambios en esta quiniela desde otra pestaña. Actualizamos la información para no perderlos — revisa y vuelve a aplicar tu cambio.");
    return { ...result, reconciled: adopted };
  }
  async function setMetaWithError(meta, opts){
    try{
      const ownerCred = (opts && opts.owner) || adminOrOwnerCred();
      const creds = { owner: ownerCred, platform: platformPasswordCache };
      const result = await kvSetWithError(currentMetaKey(), meta, creds);
      if(opts && opts.autoMove && !result.ok) autoMoveFailures++;
      // HOTFIX-001. El servidor rechazó reemplazar el tablero porque esta
      // pestaña ya no estaba viendo el actual: otra pestaña, un import o un
      // cierre publicaron algo entremedio. No se perdió nada del servidor y no
      // se guardó nada de aquí — así que lo único correcto es traer el estado
      // bueno, repintar y decirlo en una línea. El usuario no tiene por qué
      // saber qué es una revisión.
      // MS2: the questions follow the same rule (bets_conflict): another tab
      // or admin changed them since this one loaded.
      if(!result.ok && (result.error === "rounds_conflict" || result.error === "bets_conflict")){
        let adopted = false;
        try{
          const fresh = await getMeta({ owner: adminOrOwnerCred() });
          // Mutado en sitio: cada pantalla que tenga este mismo objeto ve la
          // corrección sin necesidad de cambiar la referencia.
          if(fresh) adoptFreshMeta(meta, fresh);
          adopted = !!fresh;
        }catch(e){ console.error("refresh tras rounds_conflict falló", e); }
        invalidatePlan();
        // Repintar ANTES del aviso, y el aviso colgado de document.body: al
        // revés se borraría solo.
        try{ await render(); }catch(e){ console.error("render tras rounds_conflict falló", e); }
        notice("Hubo cambios en esta quiniela desde otra pestaña. Actualizamos la información para no perderlos — revisa y vuelve a aplicar tu cambio.");
        // `reconciled`: esta pestaña YA tiene el estado del servidor. Quien
        // llamó no debe reponer lo que tenía antes de guardar: esa copia es más
        // vieja que la del servidor, y como la pestaña ya tiene la revisión
        // nueva, el siguiente guardado la escribiría encima de los cambios que
        // este conflicto acaba de proteger. Sólo es verdad si de verdad se
        // adoptó: si no se pudo traer, la pestaña sigue con lo suyo y reponer
        // es lo correcto.
        return { ...result, reconciled: adopted };
      }
      if(isStaleBetRefusal(result, opts)) return await adoptAfterStaleBet(meta, result); // MS2
      // MS2 · D4: refused because it would reopen a closed question or reuse a
      // removed one: this tab was behind on it. It takes what the server has.
      // The automatic move of the old «goleador» (opts.autoMove) is not a
      // change the person made: if it is refused, the stored data moved under
      // this tab, so it says that, not «ese cambio…». The next screen retries it.
      if(!result.ok && (result.error === "bet_close_locked" || result.error === "bet_retired" || result.error === "bet_close_legacy")) return await adoptAfterStaleBet(meta, result, opts && opts.autoMove ? () => (autoMoveAllowed() ? AUTO_MOVE_REFUSED : AUTO_MOVE_GAVE_UP) : ERROR_MESSAGES[result.error]);
      if(result.ok){
        if(Number.isFinite(result.participantsRevision)) meta.participantsRevision = result.participantsRevision;
        // HOTFIX-001: sin esto, la siguiente escritura de ESTA pestaña se
        // juzgaría contra el tablero que cargó, no contra el que acaba de
        // crear — es decir, entraría en conflicto consigo misma.
        if(Number.isFinite(result.roundsRevision)) meta.roundsRevision = result.roundsRevision;
        if(Number.isFinite(result.betsRevision)) meta.betsRevision = result.betsRevision;
        // MS2 · D4 (Product QA): the questions as the server stored them —
        // their close is the server's, so the next save carries it, not ours.
        if(Array.isArray(result.customBets)) adoptStoredBets(meta, result.customBets);
        adoptParticipantRevs(result.participantRevs);
        // Any successful meta write can move the plan numbers (a participant
        // added or removed, a round published), so the cached plan is dropped
        // rather than left to go quietly stale behind the status line.
        invalidatePlan();
        // Two things the server may have had to do on this tab's behalf, both
        // said out loud rather than absorbed silently: it kept people this tab
        // had never seen, and it kept field values this tab was behind on.
        // Either way the screen is now behind the data, so it reloads.
        const restored = result.participantsRestored || 0;
        const refreshed = result.participantsRefreshed || 0;
        if(restored > 0 || refreshed > 0){
          toast(restored > 0
            ? `Se agregaron ${restored} participante${restored === 1 ? "" : "s"} mientras editabas — ya están en la lista.`
            : "Alguien más actualizó datos de participantes mientras editabas — se conservaron sus cambios.");
          // Mutated in place, so every screen holding this same object sees
          // the corrected list without a reference swap.
          const fresh = await getMeta({ owner: adminOrOwnerCred() });
          if(fresh) adoptFreshMeta(meta, fresh);
          invalidatePlan();
        }
      }
      return result;
    }catch(e){ console.error("save meta failed", e); return { ok: false, error: "network_error" }; }
  }

  // MON-002C: la única acción que mueve una quiniela de un torneo al
  // siguiente. No cobra nada y no borra nada; el servidor conserva
  // participantes, jornadas, resultados e historial.
  // expectedCycle es el torneo que esta pestaña estaba viendo. No elige nada:
  // el servidor calcula el ciclo siguiente desde lo que tiene guardado, y si
  // este número ya quedó viejo (otra pestaña, un doble click, un reintento
  // después de que la petición sí entró) responde 409 y no escribe nada.
  async function apiStartNewTournament(name, expectedCycle){
    try{
      const headers = { "Content-Type": "application/json" };
      const cred = adminOrOwnerCred();
      setAuthHeaders(headers, cred);
      const res = await fetch("/api/quinielas/" + encodeURIComponent(SLUG) + "/tournament/new-cycle", {
        method: "POST", headers, credentials: "same-origin",
        body: JSON.stringify({ name: name || null, expectedCycle })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, ...data };
    }catch(e){ console.error("apiStartNewTournament failed", e); return { ok: false, error: "network_error" }; }
  }

  // MON-002C QA-2: cerrar el torneo es UNA operación del servidor —
  // archivar, despejar el tablero, resetear pagos y avanzar el ciclo commitean
  // juntos o no pasa nada. Antes eran dos llamadas que orquestaba el
  // navegador, y si la segunda fallaba el servidor ya estaba en el torneo
  // nuevo con las jornadas viejas puestas; un reintento después de refrescar
  // quemaba un segundo ciclo.
  //
  // closeIntentId identifica LA DECISIÓN HUMANA, no la petición. Sobrevive al
  // refresh porque se guarda antes de mandar nada, y el servidor recuerda cuál
  // fue el último cierre que ejecutó: si llega dos veces la misma intención,
  // responde lo que ya pasó sin tocar nada. El navegador nunca decide si el
  // cierre ocurrió; sólo lleva el token que le permite preguntarlo.
  function closeIntentKey(){ return "qracks_close_intent_" + (SLUG || "root"); }
  function readCloseIntent(){
    try{
      const raw = window.localStorage.getItem(closeIntentKey());
      if(!raw) return null;
      const v = JSON.parse(raw);
      return (v && typeof v.intentId === "string" && Number.isSafeInteger(v.expectedCycle)) ? v : null;
    }catch(e){ return null; }
  }
  function writeCloseIntent(v){
    try{ window.localStorage.setItem(closeIntentKey(), JSON.stringify(v)); }catch(e){}
  }
  function clearCloseIntent(){
    try{ window.localStorage.removeItem(closeIntentKey()); }catch(e){}
  }
  function newCloseIntentId(){
    const b = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(b);
    return Array.from(b).map(x => x.toString(16).padStart(2, "0")).join("");
  }

  async function apiCloseTournament({ intentId, expectedCycle, standings }){
    try{
      const headers = { "Content-Type": "application/json" };
      const cred = adminOrOwnerCred();
      setAuthHeaders(headers, cred);
      const res = await fetch("/api/quinielas/" + encodeURIComponent(SLUG) + "/tournament/close", {
        method: "POST", headers, credentials: "same-origin",
        body: JSON.stringify({ closeIntentId: intentId, expectedCycle, standings })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, ...data };
    }catch(e){
      // NO es un fallo: es un resultado DESCONOCIDO. La petición pudo haber
      // llegado y commiteado. Quien llama debe verificar, nunca reintentar a
      // ciegas algo destructivo.
      console.error("apiCloseTournament: resultado desconocido", e);
      return { ok: false, error: "unknown_result" };
    }
  }

  // Reads a participant's picks. Before that round's deadline, the server only
  // hands back the full picks to the participant themselves (their own PIN) or
  // an admin/owner — everyone else gets the closed-rounds-only view, so no one
  // can see in-progress predictions early. Pass `asAdmin: true` when loading
  // picks for people other than the current user (Tabla/Historial/Participación
  // only ever need closed-round data anyway, which the safe view already has).
  async function getPicks(pid, opts){
    try{
      const isOwnPicks = currentUser && pid === currentUser.id;
      const creds = { owner: isOwnPicks ? currentUserPinCache : ((opts && opts.asAdmin) ? adminOrOwnerCred() : null) };
      const r = await kvGet(currentPicksKey(pid), creds);
      return r.found ? r.value : {};
    }catch(e){ console.error("getPicks failed", e); return {}; }
  }
  async function setPicksWithError(pid, data){
    try{
      const creds = { owner: currentUserPinCache };
      const first = await kvSetWithError(currentPicksKey(pid), data, creds);
      // Liguilla: sus partidos se guardan uno por uno. Si otra sesión guardó
      // uno antes, este documento traía una copia vieja: se toma lo guardado
      // para las jornadas de liguilla (nunca se pisa) y se reintenta una vez.
      if(first.ok || first.error !== "liguilla_pick_conflict") return first;
      const fresh = await getPicks(pid);
      // Las respuestas a las preguntas de la jornada (__extra) son lo que se
      // está guardando: se conservan aunque el servidor no tenga todavía esa
      // jornada (Technical QA de 6e12f12, H1).
      meta.rounds.filter(isLg).forEach(r => {
        const extra = data[r.id] && data[r.id].__extra ? { __extra: data[r.id].__extra } : null;
        if(fresh[r.id]) data[r.id] = { ...fresh[r.id], ...(extra || {}) };
        else if(extra) data[r.id] = extra;
        else delete data[r.id];
      });
      return await kvSetWithError(currentPicksKey(pid), data, creds);
    }catch(e){ console.error("save picks failed", e); return { ok: false, error: "network_error" }; }
  }
  // UX-011: one shared implementation of Guardando/Guardado/Error+Reintentar,
  // used by every place that saves picks — local selections are never touched
  // here, only re-sent, so a failed save never reverts what someone picked.
  //
  // Save Confidence (Sprint 12A): saves for the same status slot are not
  // sequenced by the network, so responses can arrive out of order. A
  // sequence number per status-element id guarantees the acceptance
  // criterion: a stale response can never overwrite the visual state
  // produced by a more recent request, whether that more recent request
  // succeeded or failed. The live element is re-resolved by id at write
  // time (not the closure reference) so a response that resolves after the
  // user navigated away and back still lands on what's actually on screen.
  //
  // That id-based re-resolution alone isn't enough: if the participant
  // switches (or logs out, or a different participant opens the same
  // jornada) while a save is still in flight, a node with the same id can
  // exist again but now belong to someone else's screen. The full operation
  // context (who started the save, in which quiniela, for which status
  // slot) is captured up front and re-checked before touching the DOM or
  // firing onSuccess — a response only ever applies to the exact session
  // that started it.
  const saveSequence = {};
  // Sprint 13.6.3 — guarda de secuencia independiente para el estado visual
  // del botón "Guardar mis picks" (Guardando.../✓ Pronósticos guardados/error).
  // No sustituye ni toca saveSequence de arriba; solo evita que un revert
  // tardío de un clic viejo pise el estado de un reintento más reciente.
  const saveButtonSeq = {};
  async function attemptSavePicks(statusEl, round, onSuccess, suppressLoadingAndSuccess, onManualRetry){
    const seqKey = statusEl.id;
    const mySeq = (saveSequence[seqKey] = (saveSequence[seqKey] || 0) + 1);
    const context = { participantId: currentUser.id, slug: SLUG, roundId: round.id, seqKey };
    if(!suppressLoadingAndSuccess) statusEl.innerHTML = `<span class="muted">Guardando…</span>`;
    const result = await setPicksWithError(context.participantId, myPicks);
    const contextStillValid = saveSequence[seqKey] === mySeq
      && !!currentUser && currentUser.id === context.participantId
      && SLUG === context.slug;
    if(!contextStillValid) return result.ok; // stale response, or the session/participant changed since — never touch the screen
    const liveEl = document.getElementById(seqKey) || statusEl;
    if(result.ok){
      if(!suppressLoadingAndSuccess) liveEl.innerHTML = `<span style="color:var(--pitch-light);font-weight:600;">✅ Guardado</span>`;
      if(onSuccess) onSuccess();
      trackOnceConfirmed(
        "first_pick_" + context.participantId,
        () => hasTrackedFirstPick(context.participantId),
        () => markFirstPickTracked(context.participantId),
        "first_pick_saved",
        { participantId: context.participantId, source: "picks" }
      );
      const roundPicksNow = myPicks[round.id] || {};
      const allMatchesFilled = round.matches.length > 0 && round.matches.every(m => !!roundPicksNow[m.id]);
      if(allMatchesFilled){
        trackOnceConfirmed(
          "picks_completed_" + context.participantId + "_" + round.id,
          () => hasTrackedPicksCompleted(context.participantId, round.id),
          () => markPicksCompletedTracked(context.participantId, round.id),
          "picks_completed",
          { participantId: context.participantId, source: "picks" }
        );
      }
    }else if(result.error === "round_locked"){
      liveEl.innerHTML = `<span style="color:var(--red);">La jornada ya cerró. Ya no es posible modificar estos pronósticos.</span>`;
    }else{
      liveEl.innerHTML = `<span style="color:var(--red);">${esc(humanizeError(result.error, result))}</span> <button class="btn btn-ghost btn-sm" id="qz-retry-picks-${esc(round.id)}" style="margin-left:8px;padding:3px 10px;">Reintentar</button>`;
      const retryBtn = document.getElementById("qz-retry-picks-" + round.id);
      if(retryBtn){
        // Un error del guardado manual delega su reintento al mismo flujo
        // visual del botón principal (Guardando…/✓/2s/deshabilitado) — nunca
        // reintenta en silencio. Sin onManualRetry, el comportamiento es
        // exactamente el de siempre (autosave, apuestas personalizadas).
        if(onManualRetry) retryBtn.addEventListener("click", onManualRetry);
        else retryBtn.addEventListener("click", () => attemptSavePicks(liveEl, round, onSuccess, suppressLoadingAndSuccess));
      }
    }
    return result.ok;
  }


  // { ok, error }: error is "too_many_attempts" when the server's limit on
  // failed credentials is what said no, so the screen can say that instead
  // of "wrong password".
  async function verifyOwnerPasswordResult(password){
    try{
      const res = await fetch("/api/verify-owner", {
        method: "POST", headers: setAuthHeaders({ "Content-Type": "application/json" }, adminOrOwnerCred()),
        body: JSON.stringify({ metaKey: currentMetaKey(), password })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) return { ok: false, error: data.error || null, retryAfterSeconds: data.retryAfterSeconds };
      return { ok: !!data.ok, error: null };
    }catch(e){ console.error("verifyOwnerPassword failed", e); return { ok: false, error: null }; }
  }
  async function verifyOwnerPassword(password){
    return (await verifyOwnerPasswordResult(password)).ok;
  }
  // { ok, error }: error is "too_many_attempts" when the server's limit on
  // failed platform-password checks is what said no.
  async function verifyPlatformPasswordResult(password){
    try{
      const res = await fetch("/api/verify-platform", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ password })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) return { ok: false, error: data.error || null, retryAfterSeconds: data.retryAfterSeconds };
      return { ok: !!data.ok, error: null };
    }catch(e){ console.error("verifyPlatformPassword failed", e); return { ok: false, error: null }; }
  }
  function pinFailureMessage(result, fallback){
    return result && result.error === "too_many_attempts" ? humanizeError(result.error, result) : fallback;
  }
  async function verifyParticipantPin(participantId, pin){
    try{
      const res = await fetch("/api/verify-pin", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ metaKey: currentMetaKey(), participantId, pin, slug: SLUG || "_root" })
      });
      if(!res.ok){
        const data = await res.json().catch(() => ({}));
        return { ok: false, error: data.error || null, retryAfterSeconds: data.retryAfterSeconds };
      }
      return await res.json();
    }catch(e){ console.error("verifyParticipantPin failed", e); return { ok: false }; }
  }
  // MON-002B QA fix: every participant carries a server-computed `rev`, and a
  // write is only allowed to change a participant's fields when it echoes the
  // rev that participant currently has. So after ANY successful write, this
  // tab has to adopt the revs the server just produced — otherwise its own
  // next save would be judged stale against the very state it just created,
  // and its edits would be ignored.
  function adoptParticipantRevs(revs){
    if(!revs || typeof revs !== "object" || !meta || !Array.isArray(meta.participants)) return;
    meta.participants.forEach(p => {
      if(p && p.id != null && Number.isSafeInteger(revs[p.id])) p.rev = revs[p.id];
    });
  }
  // { ok, error }. `adminPassword` is only sent when choosing the first PIN of
  // an admin from a browser that doesn't hold the setup claim cookie
  // create-quiniela hands out — the server answers "admin_claim_required"
  // until one of the two proves it's really the admin.
  async function apiSetPinResult(participantId, currentPin, newPin, adminPassword){
    try{
      const headers = { "Content-Type": "application/json" };
      setAuthHeaders(headers, adminPassword);
      const res = await fetch("/api/set-pin", {
        method: "POST", headers, credentials: "same-origin",
        body: JSON.stringify({ metaKey: currentMetaKey(), participantId, currentPin, newPin, slug: SLUG || "_root" })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok) adoptParticipantRevs(data.participantRevs);
      return { ok: res.ok, error: res.ok ? null : (data.error || null), retryAfterSeconds: res.ok ? null : data.retryAfterSeconds };
    }catch(e){ console.error("apiSetPin failed", e); return { ok: false, error: null }; }
  }
  async function apiSetPin(participantId, currentPin, newPin){
    return (await apiSetPinResult(participantId, currentPin, newPin)).ok;
  }
  // "¿Olvidaste tu PIN?" for an admin: the admin password (header only, never
  // the body) proves who may choose a new one. { ok, error, retryAfterSeconds }.
  async function apiRecoverAdminPin(participantId, adminPassword, newPin){
    try{
      const res = await fetch("/api/recover-admin-pin", {
        method: "POST", credentials: "same-origin",
        // Unbound (no participant header): it is the admin password, not a PIN.
        headers: setAuthHeaders({ "Content-Type": "application/json" }, adminPassword),
        body: JSON.stringify({ metaKey: currentMetaKey(), participantId, newPin })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok) adoptParticipantRevs(data.participantRevs);
      return { ok: res.ok && !!data.ok, error: res.ok ? null : (data.error || null), retryAfterSeconds: res.ok ? null : data.retryAfterSeconds };
    }catch(e){ console.error("recoverAdminPin failed", e); return { ok: false, error: null }; }
  }
  // The whole "¿Olvidaste tu PIN?" flow for an admin, from the login screen,
  // with no session and no other admin: prove the admin password, then choose
  // a new PIN twice. The old PIN is never shown or needed. Resolves to the new
  // PIN when it is saved, or null (canceled / not possible: the reason is
  // already on screen).
  async function recoverAdminPin(p){
    // Without an admin password there is nothing to prove it with (asked to
    // the server: another tab or device may have just set it).
    if(meta && meta.ownerPasswordSet === false && !(await refreshOwnerPasswordSet())){ await explainNoAdminPasswordRecovery(p); return null; }
    const pw = await promptCredential(
      "Para elegir un PIN nuevo, escribe la contraseña de administrador de esta quiniela (la que se configuró para ella).",
      { title: "¿Olvidaste tu PIN?", confirmLabel: "Continuar", secret: true },
      "owner", (password) => verifyOwnerPasswordResult(password));
    if(pw === null){ showLoginWait("owner", "Contraseña de administrador"); return null; }
    if(!pw.result.ok){ toast(pinFailureMessage(pw.result, "Esa no es la contraseña de administrador.")); return null; }
    const password = pw.value;
    while(true){
      const first = await qzPrompt("Elige tu nuevo PIN (4 números):", { title: "Nuevo PIN", confirmLabel: "Continuar", pin: true });
      if(first === null) return null;
      const newPin = first.trim();
      if(!/^\d{4}$/.test(newPin)){ toast("El PIN debe ser exactamente 4 números"); continue; }
      // An empty confirmation (a second Enter right after the first PIN) is
      // not a mismatch: it just asks again.
      let again = "";
      while(!again.trim()){
        again = await qzPrompt("Escríbelo otra vez para confirmarlo:", { title: "Nuevo PIN", confirmLabel: "Guardar", pin: true });
        if(again === null) return null;
      }
      if(again.trim() !== newPin){ toast("Los dos PIN no coinciden. Elige uno otra vez."); continue; }
      const result = await apiRecoverAdminPin(p.id, password, newPin);
      if(result.ok){
        // The admin password was just proven on this device too.
        ownerPasswordCache = password;
        ownerUnlocked = true;
        return newPin;
      }
      if(result.error === "too_many_attempts" && startCredentialWait("owner", result)){
        showLoginWait("owner", "Contraseña de administrador");
        return null;
      }
      if(result.error === "no_admin_password"){
        if(meta) meta.ownerPasswordSet = false;
        await explainNoAdminPasswordRecovery(p);
        return null;
      }
      toast(result.error === "wrong_admin_password"
        ? "La contraseña de administrador cambió mientras tanto. Inténtalo de nuevo."
        : "No se pudo guardar el PIN nuevo. Intenta de nuevo.");
      return null;
    }
  }
  // First PIN of an admin: tries the setup claim cookie first, then asks for
  // the admin password (or, while there is none, another admin's PIN).
  // Resolves to { ok, error, canceled }.
  async function setFirstAdminPin(participantId, newPin){
    const first = await apiSetPinResult(participantId, null, newPin);
    if(first.ok || first.error !== "admin_claim_required") return first;
    const noPassword = !!(meta && meta.ownerPasswordSet === false) && !(await refreshOwnerPasswordSet());
    // Onboarding B: the creator's first PIN is never authorized by another
    // admin, and without a password only the browser that created the
    // quiniela can choose it. Asking for anything here would be a dead end.
    if(noPassword && meta.creatorId === participantId){
      return { ok: false, error: "creator_claim_missing" };
    }
    // A wrong value asks again in the same window: the PIN already chosen
    // is kept. Every try still goes through the attempt limit (a wait shows
    // its countdown in this window).
    let message = noPassword
      ? "Esta quiniela todavía no tiene contraseña de administrador. Pide a otro admin que escriba aquí su PIN."
      : "Escribe la contraseña de administrador de esta quiniela (no es un PIN). Si no la tienes, otro admin puede escribir aquí su PIN.";
    while(true){
      const attempt = await promptCredential(message,
        noPassword
          ? { title: "Confirma que eres admin", confirmLabel: "Continuar", pin: true }
          : { title: "Confirma que eres admin", confirmLabel: "Continuar", secret: true },
        "owner", (password) => apiSetPinResult(participantId, null, newPin, password));
      if(attempt === null) return { ok: false, error: "admin_claim_required", canceled: true };
      if(attempt.result.ok || attempt.result.error !== "admin_claim_required") return attempt.result;
      message = noPassword
        ? "Ese no es el PIN de un admin. Inténtalo otra vez: pide a otro admin que escriba aquí su PIN."
        : "Esa no es la contraseña de administrador. Inténtalo otra vez (no es un PIN). Si no la tienes, otro admin puede escribir aquí su PIN.";
    }
  }
  // What the creator sees when this browser cannot choose their first PIN.
  const CREATOR_CLAIM_MISSING_MESSAGE = "Este navegador no puede elegir el primer PIN de quien creó la quiniela. Hazlo desde el navegador donde se creó.";
  // ---------- onboarding B: the admin password, set before publishing ----------
  // A quiniela created from now on remembers who created it (meta.creatorId)
  // and starts without the admin password. Its creator prepares everything
  // without it and sets it when publishing the first round: the server
  // refuses that publish until it exists (admin_password_required), lets
  // only the creator set it, with their PIN (/api/set-admin-password), and
  // from then on the name, the entry fee and the points change only with it.
  // A quiniela without creatorId keeps every old rule.
  function creatorOfMeta(){
    if(!meta || !meta.creatorId || !Array.isArray(meta.participants)) return null;
    return meta.participants.find(p => p.id === meta.creatorId) || null;
  }
  function isCreator(user){
    const creator = creatorOfMeta();
    return !!(creator && user && user.id === creator.id);
  }
  function needsAdminPasswordToPublish(){
    return !!(meta && meta.creatorId && !meta.ownerPasswordSet);
  }
  // { ok, error, retryAfterSeconds }. The creator's PIN goes in the header,
  // bound to the creator; the new password goes in the body, once.
  async function apiSetAdminPassword(pin, password){
    try{
      const res = await fetch("/api/set-admin-password", {
        method: "POST", credentials: "same-origin",
        headers: setAuthHeaders({ "Content-Type": "application/json" }, pin, meta.creatorId),
        body: JSON.stringify({ metaKey: currentMetaKey(), password })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok && !!data.ok, error: res.ok ? null : (data.error || "server_error"), retryAfterSeconds: res.ok ? null : data.retryAfterSeconds };
    }catch(e){ console.error("apiSetAdminPassword failed", e); return { ok: false, error: "network_error" }; }
  }
  // «Mostrar / Ocultar»: only what is being typed. It always starts hidden.
  function passwordFieldHtml(id, extraAttrs){
    return `
      <div class="qz-pass-toggle-row">
        <input class="qz-modal-input" id="${id}" type="password" maxlength="200" ${extraAttrs || ""}>
        <button type="button" class="qz-pass-toggle" data-pass-toggle="${id}" aria-controls="${id}" aria-pressed="false">Mostrar</button>
      </div>`;
  }
  function wirePasswordToggles(container){
    container.querySelectorAll("[data-pass-toggle]").forEach(btn => {
      const input = container.querySelector("#" + btn.dataset.passToggle);
      if(!input) return;
      btn.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "Ocultar" : "Mostrar";
        btn.setAttribute("aria-pressed", show ? "true" : "false");
      });
    });
  }
  // «Configura tu contraseña de administrador»: the same content in the
  // publish modal and in Ajustes. Only what exists and the server enforces:
  // the three rules change only with this password, and it recovers the PIN
  // (#29). `askPin` false: the creator's PIN is already in memory (typed in
  // this same visit), so it is not asked again; the server still checks it.
  function adminPasswordSetupHtml(prefix, opts){
    const inModal = !!(opts && opts.inModal);
    const askPin = !(opts && opts.askPin === false);
    return `
      <div class="qz-setpw" id="${prefix}">
        <div class="qz-modal-title" id="${prefix}-title">Configura tu contraseña de administrador</div>
        <div class="qz-setpw-head">Aquí puedes:</div>
        <ul>
          <li>Cambiar el nombre de tu quiniela.</li>
          <li>Definir cuántos puntos vale cada acierto.</li>
          <li>Establecer la cuota que acuerden pagar los participantes.</li>
        </ul>
        <p class="qz-setpw-note">Los participantes te pagan directamente a ti, y tú registras manualmente los pagos en QRACKS.</p>
        <div class="qz-setpw-head">Tú controlas estos cambios</div>
        <p class="qz-setpw-text">Crea una contraseña de administrador para autorizar modificaciones a estas reglas. También te servirá para recuperar tu acceso si olvidas el PIN. Para entrar normalmente seguirás usando tu PIN.</p>
        <div class="qz-setpw-field" id="${prefix}-pin-field"${askPin ? "" : " hidden"}>
          <label for="${prefix}-pin">Tu PIN</label>
          <input class="qz-modal-input" id="${prefix}-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off">
        </div>
        <div class="qz-setpw-field">
          <label for="${prefix}-pw">Contraseña</label>
          ${passwordFieldHtml(prefix + "-pw", `autocomplete="new-password" aria-describedby="${prefix}-pw-help"`)}
          <p class="qz-setpw-help" id="${prefix}-pw-help">Mínimo 8 caracteres.</p>
        </div>
        <div class="qz-setpw-field">
          <label for="${prefix}-pw2">Confirmar contraseña</label>
          ${passwordFieldHtml(prefix + "-pw2", `autocomplete="new-password"`)}
        </div>
        <p class="qz-setpw-error" id="${prefix}-error" role="alert" hidden></p>
        ${credentialWaitNoticeHtml(prefix + "-wait")}
        <div class="qz-modal-actions">
          ${inModal ? `<button type="button" class="qz-modal-cancel" id="${prefix}-cancel">Ahora no</button>` : ``}
          <button type="button" class="qz-modal-confirm qz-modal-not-destructive" id="${prefix}-save">Guardar contraseña</button>
        </div>
      </div>`;
  }
  // handlers: onSaved(), onCancel(), onAlreadySet(). opts.knownPin: the
  // creator's PIN already in memory (the PIN field is then hidden).
  // Returns { isSaving }.
  function wireAdminPasswordSetup(container, prefix, handlers, opts){
    const $ = (suffix) => container.querySelector("#" + prefix + suffix);
    const pinField = $("-pin-field");
    const pinInput = $("-pin"), pwInput = $("-pw"), pw2Input = $("-pw2");
    let knownPin = opts && /^\d{4}$/.test(opts.knownPin || "") ? opts.knownPin : null;
    const errorEl = $("-error"), waitEl = $("-wait"), saveBtn = $("-save"), cancelBtn = $("-cancel");
    const waitKey = "pin:" + meta.creatorId;
    let saving = false;
    wirePasswordToggles(container);
    pinInput.addEventListener("input", () => { pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 4); });
    const clearError = () => {
      errorEl.hidden = true;
      errorEl.textContent = "";
      [pinInput, pwInput, pw2Input].forEach(i => i.removeAttribute("aria-invalid"));
    };
    const fail = (input, message) => {
      errorEl.textContent = message;
      errorEl.hidden = false;
      if(input){ input.setAttribute("aria-invalid", "true"); input.focus(); }
    };
    // Nothing typed is ever cleared, except a PIN the server said is wrong.
    const submit = async () => {
      if(saving || saveBtn.disabled) return;
      clearError();
      const usingKnownPin = !!(pinField.hidden && knownPin);
      const pin = usingKnownPin ? knownPin : pinInput.value.trim();
      const pw = pwInput.value.trim();
      const pw2 = pw2Input.value.trim();
      if(!/^\d{4}$/.test(pin)){ pinField.hidden = false; return fail(pinInput, "Escribe tu PIN de 4 números."); }
      if(pw.length < 8) return fail(pwInput, "Usa al menos 8 caracteres.");
      if(pw !== pw2) return fail(pw2Input, "Las contraseñas no coinciden.");
      saving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = "Guardando…";
      if(cancelBtn) cancelBtn.disabled = true;
      const result = await apiSetAdminPassword(pin, pw);
      saving = false;
      saveBtn.textContent = "Guardar contraseña";
      saveBtn.disabled = false;
      if(cancelBtn) cancelBtn.disabled = false;
      if(result.ok){
        meta.ownerPasswordSet = true;
        // Proven on this device a moment ago: the next writes go out with
        // the password (owner level), and the PIN with it is this user's.
        ownerPasswordCache = pw;
        ownerUnlocked = true;
        currentUserPinCache = pin;
        retireSavePinWarnings();
        handlers.onSaved();
        return;
      }
      if(result.error === "too_many_attempts" && startCredentialWait(waitKey, result)){
        mountCredentialWait(waitEl, waitKey, { button: saveBtn, reveal: true });
        return;
      }
      if(result.error === "wrong_pin"){
        // A PIN from memory that no longer matches (changed on another
        // device): forgotten, so no later attempt (reopening this form,
        // Ajustes) spends the limiter on it again; the field asks for it now.
        if(usingKnownPin && currentUserPinCache === knownPin) currentUserPinCache = null;
        knownPin = null;
        pinField.hidden = false;
        pinInput.value = "";
        return fail(pinInput, usingKnownPin ? "Escribe tu PIN para continuar." : "Ese PIN no es correcto.");
      }
      if(result.error === "admin_password_too_short") return fail(pwInput, "Usa al menos 8 caracteres.");
      if(result.error === "already_set"){
        meta.ownerPasswordSet = true;
        retireSavePinWarnings();
        handlers.onAlreadySet();
        return;
      }
      if(result.error === "not_creator") return fail(null, "Sólo quien creó la quiniela puede configurar la contraseña.");
      fail(null, "No pudimos guardar la contraseña. Revisa tu conexión e intenta de nuevo.");
    };
    saveBtn.addEventListener("click", submit);
    if(cancelBtn) cancelBtn.addEventListener("click", () => { if(!saving) handlers.onCancel(); });
    // Enter in a field saves; Enter on a button is that button. Handled here,
    // so the browser does not act on it too.
    container.addEventListener("keydown", (e) => {
      if(e.key !== "Enter" || e.target.tagName !== "INPUT" || !container.contains(e.target)) return;
      e.preventDefault();
      submit();
    });
    mountCredentialWait(waitEl, waitKey, { button: saveBtn });
    return { isSaving: () => saving };
  }
  // The PIN of the creator, if it was typed during this visit (memory only,
  // never stored): the setup does not ask for it again.
  function creatorPinInMemory(){
    return isCreator(currentUser) && /^\d{4}$/.test(currentUserPinCache || "") ? currentUserPinCache : null;
  }
  // The publish modal. Resolves true once the password is saved. It never
  // publishes: closing it ("Ahora no", Esc) keeps everything on the screen.
  // Only one at a time: a second call while it is open resolves false.
  function openAdminPasswordSetup(){
    if(document.getElementById("qz-setpw-modal")) return Promise.resolve(false);
    const knownPin = creatorPinInMemory();
    return new Promise((resolve) => {
      const prefix = "qz-setpw-modal";
      const overlay = document.createElement("div");
      overlay.className = "qz-modal-overlay qz-modal-scroll";
      overlay.innerHTML = `<div class="qz-modal-card" role="dialog" aria-modal="true" aria-labelledby="${prefix}-title" tabindex="-1">${adminPasswordSetupHtml(prefix, { inModal: true, askPin: !knownPin })}</div>`;
      document.body.appendChild(overlay);
      const focusTrap = attachModalFocusTrap(overlay);
      let closed = false;
      const close = (saved) => {
        if(closed) return;
        closed = true;
        document.removeEventListener("keydown", onKey);
        focusTrap.release();
        overlay.remove();
        resolve(saved);
      };
      const control = wireAdminPasswordSetup(overlay, prefix, {
        onSaved: () => close(true),
        onCancel: () => close(false),
        onAlreadySet: () => { close(false); toast("Esta quiniela ya tiene contraseña de administrador. Toca «Publicar jornada» para publicar.", 5000); },
      }, { knownPin });
      // Esc is «Ahora no». A click on the backdrop does not close it, so
      // nothing typed is lost by a stray tap.
      const onKey = (e) => { if(e.key === "Escape" && !control.isSaving()){ e.preventDefault(); close(false); } };
      document.addEventListener("keydown", onKey);
      // The card, not the PIN: on a phone the keypad would cover the text.
      overlay.querySelector(".qz-modal-card").focus();
    });
  }
  function clearPublishPasswordSaved(){
    document.querySelectorAll(".qz-pw-saved").forEach(el => el.remove());
  }
  function showPublishPasswordSaved(anchor, where){
    clearPublishPasswordSaved();

    el.setAttribute("role", "status");
    el.textContent = "✅ Contraseña guardada. Revisa la jornada y toca «Publicar jornada» para publicarla.";

    // No toast on top: on a phone it would cover the very button to tap.
    if(typeof el.scrollIntoView === "function") el.scrollIntoView({ block: "nearest" });

  // The "Guarda tu PIN" warning only holds while there is no admin password.

  }
  // This tab may be behind: the password may have been set a moment ago in

  // whether it exists, never more) and keeps only that flag. True if it exists.
  async function refreshOwnerPasswordSet(){
    try{
      const fresh = await getMeta({});
      if(fresh && typeof fresh.ownerPasswordSet === "boolean") meta.ownerPasswordSet = fresh.ownerPasswordSet;
    }catch(e){ console.error("refreshOwnerPasswordSet failed", e); }
    if(meta && meta.ownerPasswordSet) retireSavePinWarnings();
    return !!(meta && meta.ownerPasswordSet);
  }
  // At every «Publicar jornada», after the form's own checks and before

  // publish (one more tap does); a co-admin is told who has to do it.
  // One at a time: a second tap while the first is being answered does
  // nothing, so no second modal can open on top.
  let firstPublishGateBusy = false;
  async function gateFirstPublish(anchor, where){
    clearPublishPasswordSaved();
    if(!needsAdminPasswordToPublish()) return true;
    if(firstPublishGateBusy || document.querySelector(".qz-modal-overlay")) return false;
    firstPublishGateBusy = true;
    try{
      if(await refreshOwnerPasswordSet()) return true;
      const creator = creatorOfMeta();
      if(!isCreator(currentUser)){
        await qzAlert(creator
          ? `Antes de publicar la primera jornada, ${creator.name} (quien creó la quiniela) tiene que configurar la contraseña de administrador.`
          : "Antes de publicar la primera jornada, quien creó la quiniela tiene que configurar la contraseña de administrador.",
          { title: "Falta la contraseña de administrador" });

      }

  // «¿Olvidaste tu PIN?» while there is no admin password: there is nothing to
  // recover with, so it says that, and what still works. No support promise.
  async function explainNoAdminPasswordRecovery(p){
    const lines = ["Esta quiniela todavía no tiene contraseña de administrador, así que no es posible recuperar tu PIN desde aquí."];
    if(isCreator(p)){
      lines.push("Si tienes una sesión abierta en otro dispositivo, entra desde ahí. Desde ahí podrás configurar tu contraseña de administrador.");
    } else {
      lines.push("Si tienes una sesión abierta en otro dispositivo, entra desde ahí. Si no, pide a otro admin que resetee tu PIN desde Participantes.");
    }
    await qzAlert(lines.join("\n\n"), { title: "¿Olvidaste tu PIN?" });
  }

  // Anonymous, non-sensitive — just enough to tell "same device came back"
  // apart in the funnel numbers. Not the session cookie, no security role.
  function getDeviceId(){
    try{
      let id = window.localStorage.getItem("qracks_device_id");
      if(!id){
        id = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        window.localStorage.setItem("qracks_device_id", id);
      }
      return id;
    }catch(e){ return "d_unknown"; }
  }
  // Growth Loop funnel — fire-and-forget, never blocks the UI and never
  // throws into the caller if it fails.
  function trackEvent(event, extra){
    // Devuelve una promesa que resuelve a `true` solo si el servidor aceptó
    // el evento (2xx real), `false` en cualquier otro caso — nunca se
    // rechaza. La inmensa mayoría de los llamadores ignoran este valor de
    // retorno (igual que antes, sigue siendo fire-and-forget); solo los
    // guards que necesitan confirmar éxito real antes de marcarse (ver
    // first_pick_saved/picks_completed) lo usan.
    try{
      return fetch("/api/track-event", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({
          event,
          competitionSlug: SLUG || null,
          source: "access_link",
          deviceId: getDeviceId(),
          ...extra
        })
      }).then(res => res.ok).catch(() => false);
    }catch(e){ /* analytics should never break the app */ return Promise.resolve(false); }
  }
  // Access Link "remember this device": the actual token lives only in an
  // HttpOnly cookie the browser manages on its own — this just asks the server
  // "is there a still-valid one for this quiniela?" and gets back plain user
  // state, never the token itself.
  async function checkSession(){
    try{
      const res = await fetch("/api/verify-session", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ metaKey: currentMetaKey(), slug: SLUG || "_root" })
      });
      if(!res.ok) return null;
      const data = await res.json();
      return data.ok ? data : null;
    }catch(e){ console.error("checkSession failed", e); return null; }
  }
  async function clearSessionCookie(){
    try{
      await fetch("/api/clear-session", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ slug: SLUG || "_root" })
      });
    }catch(e){ console.error("clearSessionCookie failed", e); }
  }
  async function apiSelfRegister(name, pin){
    try{
      const res = await fetch("/api/self-register", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ metaKey: currentMetaKey(), name, pin, slug: SLUG || "_root" })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, ...data };
    }catch(e){ console.error("apiSelfRegister failed", e); return { ok: false }; }
  }
  async function apiSubmitBetAnswer(participantId, betId, guess){
    try{
      const headers = { "Content-Type": "application/json" };
      setAuthHeaders(headers, currentUserPinCache);
      const res = await fetch("/api/submit-bet-answer", {
        method: "POST", headers, credentials: "same-origin",
        body: JSON.stringify({ metaKey: currentMetaKey(), participantId, betId, guess })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok) adoptParticipantRevs(data.participantRevs);
      // MS2: the screen says why it was not saved (closed vs. connection).
      return { ok: res.ok, error: res.ok ? null : (data.error || "unknown_error") };
    }catch(e){ console.error("apiSubmitBetAnswer failed", e); return { ok: false, error: "network_error" }; }
  }

  // ---------- server time sync (display only — the backend is still the
  // real authority on deadlines; this just keeps what people SEE in sync
  // with it, in case their own device's clock is off) ----------
  let serverTimeOffsetMs = 0;
  async function syncServerTime(){
    try{
      const t0 = Date.now();
      const res = await fetch("/api/health", { credentials: "same-origin" });
      if(!res.ok) return;
      const data = await res.json();
      const rtt = Date.now() - t0; // rough network round-trip, halved below to estimate one-way delay

      serverTimeOffsetMs = serverNowAtArrival - Date.now();
    }catch(e){ console.error("syncServerTime failed", e); } // offset just stays 0 — falls back to the device's own clock

  // UX-001: makes an overflowing tab bar's remaining content discoverable
  // (the scrollbar itself is deliberately hidden above) and keeps it in sync
  // as someone scrolls it manually.
  function wireTabScrollFade(el){
    if(!el) return;

  // Sprint 14.8 — A11Y-001: focus trap compartido por qzConfirm y qzPrompt.
  // Tab/Shift+Tab quedan atrapados dentro del overlay mientras está abierto;
  // al cerrar (cualquier vía: Escape, backdrop, botón, Enter) el foco vuelve
  // exactamente al elemento que abrió el modal. Un solo helper, sin duplicar
  // esta lógica en cada modal.
  function attachModalFocusTrap(overlay){
    const triggerEl = document.activeElement;
    const focusableSelector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const onTab = (e) => {
      if(e.key !== "Tab") return;
      // Only the modal on top answers: one under it must not pull the focus back.
      const overlays = document.querySelectorAll(".qz-modal-overlay");
      if(overlays.length && overlays[overlays.length - 1] !== overlay) return;
      const focusable = Array.from(overlay.querySelectorAll(focusableSelector)).filter(el => el.offsetParent !== null);
      if(!focusable.length){ e.preventDefault(); return; }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      // The focus is on the dialog itself (a card with tabindex=-1, which is
      // not in the list) or anywhere else: Tab enters the dialog instead of
      // leaving it for the page behind.
      if(!focusable.includes(document.activeElement)){
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      } else if(e.shiftKey && document.activeElement === first){
        e.preventDefault();
        last.focus();
      } else if(!e.shiftKey && document.activeElement === last){
        e.preventDefault();
        first.focus();
      }
    };
    document.addEventListener("keydown", onTab);
    return {
      release(){
        document.removeEventListener("keydown", onTab);
        if(triggerEl && typeof triggerEl.focus === "function") triggerEl.focus();
      }
    };
  }

  function qzConfirm(message, opts){
    opts = opts || {};
    const destructive = opts.destructive !== false; // most of what this guards is destructive by default
    const confirmLabel = opts.confirmLabel || (destructive ? "Eliminar" : "Confirmar");
    const cancelLabel = opts.cancelLabel || "Cancelar";
    // A notice with nothing to decide has one button (qzAlert).
    const single = !!opts.single;
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      // MS2 · D4 (UX): a long message scrolls, with its buttons always in view.
      overlay.className = "qz-modal-overlay qz-modal-scroll";
      const messageHtml = String(message).split("\n\n").map(para =>
        `<p>${para.split("\n").map(esc).join("<br>")}</p>`
      ).join("");
      overlay.innerHTML = `
        <div class="qz-modal-card" role="alertdialog" aria-modal="true" aria-label="${esc(opts.title || confirmLabel)}">
          ${opts.title ? `<div class="qz-modal-title">${esc(opts.title)}</div>` : ``}
          <div class="qz-modal-message">${messageHtml}</div>
          <div class="qz-modal-actions">
            ${single ? `` : `<button class="qz-modal-cancel" id="qz-modal-cancel-btn">${esc(cancelLabel)}</button>`}
            <button class="qz-modal-confirm ${destructive ? '' : 'qz-modal-not-destructive'}" id="qz-modal-confirm-btn">${esc(confirmLabel)}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const focusTrap = attachModalFocusTrap(overlay);
      const cleanup = (result) => {
        document.removeEventListener("keydown", onKey);
        focusTrap.release();
        overlay.remove();
        resolve(result);
      };
      const onKey = (e) => { if(e.key === "Escape") cleanup(false); };
      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e) => { if(e.target === overlay) cleanup(false); });
      const cancelBtn = overlay.querySelector("#qz-modal-cancel-btn");
      if(cancelBtn) cancelBtn.addEventListener("click", () => cleanup(false));
      overlay.querySelector("#qz-modal-confirm-btn").addEventListener("click", () => cleanup(true));
      // Destructive actions default focus to Cancel — the safer accidental-Enter outcome.
      ((destructive && cancelBtn) ? cancelBtn : overlay.querySelector("#qz-modal-confirm-btn")).focus();
    });
  }
  // A notice: one button, «Entendido» unless said otherwise.
  function qzAlert(message, opts){
    opts = opts || {};
    return qzConfirm(message, { ...opts, destructive: false, single: true, confirmLabel: opts.confirmLabel || "Entendido" });
  }
  // MS2 · D4: a decision the person has to make explicitly. Nothing comes
  // preselected and the confirm button stays off until one option is chosen.
  // Resolves to the chosen option's value, or null (Cancelar, Escape, fuera).
  function qzChoose(message, opts){
    opts = opts || {};
    const options = Array.isArray(opts.options) ? opts.options : [];
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "qz-modal-overlay qz-modal-scroll";
      const messageHtml = String(message).split("\n\n").map(para =>
        `<p>${para.split("\n").map(esc).join("<br>")}</p>`
      ).join("");
      overlay.innerHTML = `
        <div class="qz-modal-card" role="dialog" aria-modal="true" aria-label="${esc(opts.title || "Elige una opción")}">
          ${opts.title ? `<div class="qz-modal-title">${esc(opts.title)}</div>` : ``}
          <div class="qz-modal-message">${messageHtml}</div>
          <fieldset class="qz-modal-choice">
            ${opts.legend ? `<legend>${esc(opts.legend)}</legend>` : ``}
            ${options.map((o, i) => `<label><input type="radio" name="qz-modal-choice" value="${esc(o.value)}" id="qz-modal-choice-${i}"><span>${esc(o.label)}</span></label>`).join("")}
          </fieldset>
          <div class="qz-modal-actions">
            <button class="qz-modal-cancel" id="qz-modal-cancel-btn">${esc(opts.cancelLabel || "Cancelar")}</button>
            <button class="qz-modal-confirm qz-modal-not-destructive" id="qz-modal-confirm-btn" disabled>${esc(opts.confirmLabel || "Guardar")}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const focusTrap = attachModalFocusTrap(overlay);
      const confirmBtn = overlay.querySelector("#qz-modal-confirm-btn");
      const chosen = () => { const r = overlay.querySelector('input[name="qz-modal-choice"]:checked'); return r ? r.value : null; };
      const cleanup = (result) => {
        document.removeEventListener("keydown", onKey);
        focusTrap.release();
        overlay.remove();
        resolve(result);
      };
      const onKey = (e) => { if(e.key === "Escape") cleanup(null); };
      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e) => { if(e.target === overlay) cleanup(null); });
      overlay.querySelectorAll('input[name="qz-modal-choice"]').forEach(r => r.addEventListener("change", () => { confirmBtn.disabled = !chosen(); }));
      overlay.querySelector("#qz-modal-cancel-btn").addEventListener("click", () => cleanup(null));
      confirmBtn.addEventListener("click", () => { const v = chosen(); if(v != null) cleanup(v); });
      const first = overlay.querySelector('input[name="qz-modal-choice"]');
      (first || overlay.querySelector("#qz-modal-cancel-btn")).focus();
    });
  }

  // UX-018: reusable text/PIN capture modal — a drop-in replacement for
  // window.prompt(), with the exact same return contract callers already
  // rely on: resolves to `null` if canceled (Escape, backdrop, Cancelar), or
  // the raw typed string if confirmed (Enter or the button) — including an
  // empty string if they submit blank, same as the native prompt(). Every
  // validation rule stays exactly where it already lived, in the caller.
  // What qzPrompt resolves to when its secondary action (opts.altLabel) is
  // chosen: an object, so it can never be mistaken for anything typed.
  const QZ_PROMPT_ALT = Object.freeze({ qzPromptAlt: true });
  function qzPrompt(message, opts){
    opts = opts || {};
    const isPin = !!opts.pin; // masks the value on screen, restricts to 4 digits
    const isSecret = isPin || !!opts.secret; // masks the value on screen
    const confirmLabel = opts.confirmLabel || "Aceptar";
    const cancelLabel = opts.cancelLabel || "Cancelar";
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "qz-modal-overlay";
      overlay.innerHTML = `
        <div class="qz-modal-card" role="dialog" aria-modal="true" aria-label="${esc(opts.title || message)}">
          ${opts.title ? `<div class="qz-modal-title">${esc(opts.title)}</div>` : ``}
          <div class="qz-modal-message"><p>${esc(message)}</p></div>
          ${isSecret && !isPin ? `<div class="qz-pass-toggle-row">` : ``}
          <input
            class="qz-modal-input" id="qz-prompt-input"
            type="${isSecret ? "password" : "text"}"
            inputmode="${isPin ? "numeric" : "text"}"
            autocomplete="off"
            ${isPin ? 'maxlength="4" pattern="[0-9]*"' : ""}
          >
          ${isSecret && !isPin ? `<button type="button" class="qz-pass-toggle" data-pass-toggle="qz-prompt-input" aria-controls="qz-prompt-input" aria-pressed="false">Mostrar</button></div>` : ``}
          ${opts.waitKey ? credentialWaitNoticeHtml("qz-prompt-wait") : ""}
          ${opts.altLabel ? `<button type="button" class="qz-modal-alt" id="qz-modal-alt-btn">${esc(opts.altLabel)}</button>` : ""}
          <div class="qz-modal-actions">
            <button class="qz-modal-cancel" id="qz-modal-cancel-btn">${esc(cancelLabel)}</button>
            <button class="qz-modal-confirm qz-modal-not-destructive" id="qz-modal-confirm-btn">${esc(confirmLabel)}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const input = overlay.querySelector("#qz-prompt-input");
      const confirmBtn = overlay.querySelector("#qz-modal-confirm-btn");
      if(opts.waitKey) mountCredentialWait(overlay.querySelector("#qz-prompt-wait"), opts.waitKey, { button: confirmBtn });
      const focusTrap = attachModalFocusTrap(overlay);
      const cleanup = (result) => {
        document.removeEventListener("keydown", onKey);
        focusTrap.release();
        overlay.remove();
        resolve(result);
      };
      // While a wait is on, Enter does nothing, same as the disabled button.
      const submit = () => { if(!confirmBtn.disabled) cleanup(input.value); };
      const onKey = (e) => {
        if(e.key === "Escape") cleanup(null);
        else if(e.key === "Enter"){
          // Enter on one of the modal's own buttons (Cancelar, the secondary
          // link) is that button's click, not a submit.
          if(e.target !== input && e.target.tagName === "BUTTON" && overlay.contains(e.target)) return;
          // Handled here, so the browser must not act on it too: cleanup()
          // hands the focus back to the button that opened the modal, and the
          // same Enter would then click it (reopening the PIN modal on top of
          // the next step of «¿Olvidaste tu PIN?»).
          e.preventDefault();
          submit();
        }
      };
      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e) => { if(e.target === overlay) cleanup(null); });
      overlay.querySelector("#qz-modal-cancel-btn").addEventListener("click", () => cleanup(null));
      confirmBtn.addEventListener("click", submit);
      // Secondary action: resolves to QZ_PROMPT_ALT (never a typed value). It
      // works during a wait too -- that is when "¿Olvidaste tu PIN?" matters.
      const altBtn = overlay.querySelector("#qz-modal-alt-btn");
      if(altBtn) altBtn.addEventListener("click", () => cleanup(QZ_PROMPT_ALT));
      // «Mostrar / Ocultar» for a password (never for a PIN): only what is
      // being typed, and every time the modal opens it starts hidden.
      wirePasswordToggles(overlay);
      if(isPin){
        input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, "").slice(0, 4); });
      }
      input.focus();
    });
  }

  // AUTO-001.1 Admin lifecycle fix (FIX 3): reopening a round must never
  // claim success while leaving a past deadline in place — isRoundLocked()/
  // classifyRound()/backend picks-writes would all still treat it as closed,
  // making "ya pueden volver a votar" false. This mirrors qzPrompt's exact
  // modal structure/CSS classes (no new component), but with a datetime
  // input and inline validation that keeps the modal open — never resolves
  // — until the admin picks a real future moment. No auto +24h/tomorrow
  // guess: the admin always chooses.
  function qzPromptDeadline(message, opts){
    opts = opts || {};
    const confirmLabel = opts.confirmLabel || "Aceptar";
    const cancelLabel = opts.cancelLabel || "Cancelar";
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "qz-modal-overlay";
      overlay.innerHTML = `
        <div class="qz-modal-card" role="dialog" aria-modal="true" aria-label="${esc(opts.title || message)}">
          ${opts.title ? `<div class="qz-modal-title">${esc(opts.title)}</div>` : ``}
          <div class="qz-modal-message"><p>${esc(message)}</p></div>
          <input class="qz-modal-input" id="qz-deadline-prompt-input" type="datetime-local">
          <p class="muted" id="qz-deadline-prompt-error" style="color:var(--red);display:none;margin:6px 0 0;"></p>
          <div class="qz-modal-actions">
            <button class="qz-modal-cancel" id="qz-modal-cancel-btn">${esc(cancelLabel)}</button>
            <button class="qz-modal-confirm qz-modal-not-destructive" id="qz-modal-confirm-btn">${esc(confirmLabel)}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const input = overlay.querySelector("#qz-deadline-prompt-input");
      const errorEl = overlay.querySelector("#qz-deadline-prompt-error");
      const focusTrap = attachModalFocusTrap(overlay);
      const cleanup = (result) => {
        document.removeEventListener("keydown", onKey);
        focusTrap.release();
        overlay.remove();
        resolve(result);
      };
      const submit = () => {
        if(!input.value){
          errorEl.textContent = "Elige una fecha y hora.";
          errorEl.style.display = "block";
          return;
        }
        const chosenMs = new Date(input.value).getTime();
        if(!Number.isFinite(chosenMs) || chosenMs <= serverNow()){
          errorEl.textContent = "La nueva fecha límite debe ser en el futuro.";
          errorEl.style.display = "block";
          return;
        }
        cleanup(new Date(chosenMs).toISOString());
      };
      const onKey = (e) => {
        if(e.key === "Escape") cleanup(null);
        else if(e.key === "Enter") submit();
      };
      document.addEventListener("keydown", onKey);
      overlay.addEventListener("click", (e) => { if(e.target === overlay) cleanup(null); });
      overlay.querySelector("#qz-modal-cancel-btn").addEventListener("click", () => cleanup(null));
      overlay.querySelector("#qz-modal-confirm-btn").addEventListener("click", submit);
      input.focus();
    });
  }

  // Un solo combobox de equipo puede estar abierto a la vez.
  let openTeamComboCloser = null;

  function wireTeamCombobox(input, teams){
    const wrap = input.closest(".qz-combo-wrap");
    if(!wrap) return;
    let listEl = null;
    let activeIndex = -1;
    let filtered = [];

    function stripDiacritics(s){
      return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function selectOption(team){
      input.value = team;
      // Dispara el evento nativo 'input' para que el listener ya existente en
      // wireRows() (que escribe en draft.matches) lo capture, sin duplicar
      // esa lógica aquí.
      input.dispatchEvent(new Event("input", { bubbles: true }));
      closeList();
    }

    function renderList(){
      const q = stripDiacritics(input.value.trim().toLowerCase());
      filtered = q ? teams.filter(t => stripDiacritics(t.toLowerCase()).includes(q)) : teams.slice();
      activeIndex = -1;
      if(!listEl){
        listEl = document.createElement("div");
        listEl.className = "qz-combo-list";
        listEl.setAttribute("role", "listbox");
        wrap.appendChild(listEl);
      }
      if(!filtered.length){
        listEl.innerHTML = `<div class="qz-combo-empty">Sin coincidencias — puedes escribir el nombre a mano.</div>`;
        return;
      }
      listEl.innerHTML = filtered.map((t,i) => `<div class="qz-combo-option" role="option" data-idx="${i}">${esc(t)}</div>`).join("");
      listEl.querySelectorAll(".qz-combo-option").forEach(opt => {
        // mousedown (no click): dispara ANTES de que el blur/outside-handler
        // del input cierre la lista, así el toque/clic en la opción sí llega.
        opt.addEventListener("mousedown", (e) => {
          e.preventDefault();
          selectOption(filtered[Number(opt.dataset.idx)]);
        });
      });
    }

    function updateActive(){
      const opts = listEl ? listEl.querySelectorAll(".qz-combo-option") : [];
      opts.forEach((o,i) => o.classList.toggle("qz-combo-active", i === activeIndex));
      if(opts[activeIndex]) opts[activeIndex].scrollIntoView({ block: "nearest" });
    }

    function outsideHandler(e){
      if(wrap.contains(e.target)) return;
      closeList();
    }
    function escHandler(e){ if(e.key === "Escape") closeList(); }

    function openList(){
      if(openTeamComboCloser && openTeamComboCloser !== closeList) openTeamComboCloser();
      renderList();
      input.setAttribute("aria-expanded", "true");
      document.addEventListener("mousedown", outsideHandler, true);
      document.addEventListener("touchstart", outsideHandler, true);
      document.addEventListener("keydown", escHandler);
      openTeamComboCloser = closeList;
    }
    function closeList(){
      if(listEl){ listEl.remove(); listEl = null; }
      input.setAttribute("aria-expanded", "false");
      document.removeEventListener("mousedown", outsideHandler, true);
      document.removeEventListener("touchstart", outsideHandler, true);
      document.removeEventListener("keydown", escHandler);
      if(openTeamComboCloser === closeList) openTeamComboCloser = null;
    }

    input.addEventListener("focus", openList);
    input.addEventListener("click", openList);
    input.addEventListener("input", () => { if(listEl) renderList(); else openList(); });
    input.addEventListener("keydown", (e) => {
      if(!listEl){
        if(e.key === "ArrowDown" || e.key === "ArrowUp") openList();
        return;
      }
      if(e.key === "ArrowDown"){
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, filtered.length - 1);
        updateActive();
      } else if(e.key === "ArrowUp"){
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        updateActive();
      } else if(e.key === "Enter"){
        if(activeIndex >= 0 && filtered[activeIndex]){
          e.preventDefault();
          selectOption(filtered[activeIndex]);
        }
      } else if(e.key === "Escape"){
        closeList();
      }
    });
  }

  const analyticsGuardInFlight = new Set();
  function trackOnceConfirmed(inFlightKey, hasTrackedFn, markTrackedFn, eventName, extra){
    if(hasTrackedFn() || analyticsGuardInFlight.has(inFlightKey)) return;
    analyticsGuardInFlight.add(inFlightKey);

    });
  }

  // ---------- derived helpers ----------
  function isRoundLocked(round){
    if(!round) return true;
    return serverNow() > new Date(round.deadline).getTime();
  }
  function timeParts(deadline){
    let diff = new Date(deadline).getTime() - serverNow();
    if(diff < 0) diff = 0;
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    return {d,h,m,s};
  }

  // when acting as admin) — the server applies the identical per-participant
  // visibility rules either way, so callers see no difference at all.
  async function ensureAllPicksLoaded(){
    if(allPicksLoadInFlight) return allPicksLoadInFlight;
    allPicksLoadInFlight = (async () => {
      try{
        const isAdmin = !!(currentUser && currentUser.isAdmin);
        const cred = isAdmin ? adminOrOwnerCred() : currentUserPinCache;
        const headers = { "Content-Type": "application/json" };
        setAuthHeaders(headers, cred);
        const res = await fetch("/api/picks-batch", {
          method: "POST", headers, credentials: "same-origin",
          body: JSON.stringify({ metaKey: currentMetaKey(), participantIds: meta.participants.map(p => p.id) })
        });
        allPicksCache = res.ok ? (await res.json()).picks || {} : {};
      }catch(e){
        console.error("ensureAllPicksLoaded (batch) failed", e);
        allPicksCache = {};
      }
    })();
    try{
      return await allPicksLoadInFlight;
    }finally{

  // ---------- casuísticas / apuestas personalizadas (motor genérico) ----------
  // Migrates the old single-purpose golScorerBet into the new flexible list, once.
  // Returns true if it changed meta (caller should persist with setMeta).
  function ensureCustomBets(){
    if(!meta.customBets) meta.customBets = [];
    if(meta.customBetsMigrated) return false;
    meta.customBetsMigrated = true;
    const old = meta.golScorerBet;
    if(old && old.enabled){
      const id = uid("cb");
      // La apuesta nueva sólo puede llevar números: el servidor rechaza otra
      // cosa en una apuesta que no estaba guardada (metaNumbers.js).
      const num = (v, fallback) => typeof v === "number" && Number.isFinite(v) ? v
        : (typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v)) ? Number(v) : fallback);
      meta.customBets.push({
        id,
        label: "Goleador de la liga",
        scope: "temporada",
        points: num(old.bonusPoints, 3),
        closesAtRound: num(old.closesAtRound, null) || null
      });
      meta.participants.forEach(p => {

          if(!p.customBetAnswers) p.customBetAnswers = {};
          p.customBetAnswers[id] = { guess: p.golScorerGuess, correct: p.golScorerCorrect === true };
          // MS2 · D4: moved, not copied — the old field was never masked for others.
          delete p.golScorerGuess;
        }
      });

    }
    return true; // still mark migrated even if there was nothing to migrate
  }

  // The Tabla shows positions once the results of a round are published;
  // before that it says «Aún no hay resultados», even with points marked.
  function tableShowsScores(){
    return meta.rounds.some(r => r.resultsPublished);
  }
  // When the points of a marked hit show up, said truthfully for this state.
  function markedPointsWhen(){
    return tableShowsScores()
