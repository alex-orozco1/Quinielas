    const result = await setMetaWithError(meta, { betsEdited: true });
    setupPublishInFlight = false;
    flow.publishing = false;
    if(setupFlow !== flow) return;
    if(result.ok){
      clearRoundDraft(rows.kind);
      // The server kept points or fee (no admin password): compare with what
      // it really has, not with this tab's wish.
      let unread = false;
      if(result.ruleFieldsKept){
        let fresh = null;
        try{ fresh = await getMeta({ owner: adminOrOwnerCred() }); }catch(e){ console.error("setup publish rules re-check failed", e); }
        if(fresh) adoptFreshMeta(meta, fresh); else unread = true;
      }
      const pending = setupRulesDiff(rules);
      if(unread) pending.unshift("Puntos y cuota: no se guardaron; hace falta la contraseña de administrador.");
      finishSetupPublish(round, pending, setupWantedRound());
      return;
    }
    if(!result.reconciled) adoptFreshMeta(meta, snapshot);
    // The answer to an earlier try may have been lost on the way back while
    // the server did publish: then this try is a conflict, or it never got an
    // answer either. Ask the server what it has before saying anything.
    if(result.error === "network_error" && !result.reconciled){
      try{
        const fresh = await getMeta({ owner: adminOrOwnerCred() });
        if(fresh) adoptFreshMeta(meta, fresh);
      }catch(e){ console.error("setup publish re-check failed", e); }
    }
    if(setupFlow !== flow) return;
    if(result.error === "rounds_conflict" || result.error === "network_error"){
      const done = setupAlreadyPublished(rows, problem.clean);
      if(done){
        clearRoundDraft(rows.kind);
        // The round is there; the rules may not be (someone else published
        // it first, or this write never arrived): compared one by one.
        finishSetupPublish(done, setupRulesDiff(rules), setupWantedRound());
        return;
      }
    }
    // Technical QA, ronda 4: another admin saved questions while this tab
    // waited (the password, say). Nothing was written; the summary now shows
    // what the quiniela has, and the next tap publishes on top of it.
    if(result.error === "bets_conflict"){
      flow.notice = { kind: "alert", retry: false, html: "Cambiaron las preguntas guardadas en tu quiniela desde otra pestaña o dispositivo. Revisa el resumen y vuelve a tocar «Publicar». No se publicó nada." };
      renderSetupFlow();
      return;
    }
    // A conflict repainted the app (setMetaWithError): back to this summary,
    // with the calendar looked up again from what the server has now.
    if(result.error === "rounds_conflict"){
      setSetupCal(null); flow.rows = null;
      flow.notice = { kind: "alert", html: "Hubo cambios en esta quiniela desde otra pestaña. Revisa el resumen y vuelve a tocar «Publicar». No se publicó nada.", retry: false };
      renderSetupFlow();
      await loadSetupCalendar(false);
      return;
    }
    restoreBtn();
    if(mainEl) mainEl.removeAttribute("aria-busy");
    if(result.error === "plan_lifecycle_limit_reached" || result.error === "plan_participant_limit_reached"){
      showPlanBlock(result);
      return;
    }
    if(result.error === "admin_password_required"){
      // The server knows better than this tab: the same question, right away.
      meta.ownerPasswordSet = false;
      renderSetupFlow();
      const again = document.getElementById("qz-setup-next");
      // Still inside the same click (setupClickPending): the inner step.
      if(again) await setupPublishClickNow(again);
      return;
    }
    if(result.error === "network_error"){
      // The next tap asks the server first, even if this round no longer
      // passes the checks here (its deadline passed meanwhile).
      flow.unconfirmed = true;
      setupPublishMessage("alert", "No pudimos confirmar si se publicó. Revisa tu conexión y toca «Reintentar». Si ya estaba publicada, no se publica dos veces.", true);
      return;
    }
    // The server judged the deadline already passed (its own clock).
    if(result.error === "round_deadline_passed"){ setupPublishStopped(flow, { field: "deadline" }); return; }
    const known = result.error && result.error !== "unknown_error" && ERROR_MESSAGES[result.error];
    setupPublishMessage("alert", (known ? esc(humanizeError(result.error, result)) + " " : "") + "No se publicó nada; tu configuración sigue aquí.", true);
  }
  // The round this setup publishes, if the server already has it published:
  // the same imported round (calendar) or the same match ids (manual; they
  // are made here and kept when publishing).
  function setupAlreadyPublished(rows, clean){
    const ids = new Set(clean.map(m => m.id));
    const published = (r) => r && r.published !== false && (r.matches || []).some(m => m && ids.has(m.id));
    if(rows.kind !== "new"){
      const r = meta.rounds.find(x => x.id === rows.round.id);
      return published(r) ? r : null;
    }
    return meta.rounds.find(published) || null;
  }
  // R2: every rule this setup wanted against what `meta` holds (which must be
  // the server's copy): points, fee, the penalty and each question whole
  // (text, how it is answered, points, close). Plain-text lines, one per
  // rule that did not stay as configured; [] when everything is stored.
  // A published round never means its rules were stored.
  function setupRulesDiff(rules){
    const s = meta.settings || {};
    const lines = [];
    const points = s.pointsPerCorrectPick != null ? s.pointsPerCorrectPick : 1;
    if(points !== rules.points) lines.push("Puntos por acierto: querías " + rules.points + "; quedaron en " + points + ".");
    const fee = typeof s.entryFee === "number" ? s.entryFee : 0;
    const feeText = (f) => f ? "$" + f + " MXN" : "sin cuota";
    if(fee !== rules.fee) lines.push("Cuota: querías " + feeText(rules.fee) + "; quedó " + feeText(fee) + ".");
    const pen = meta.paymentPenalty && meta.paymentPenalty.enabled ? meta.paymentPenalty : null;
    const want = rules.penalty;
    const penText = (p) => "−" + p.pointsPerRound + " por jornada sin pagar desde la Jornada " + p.startsAtRound;
    if(want && (!pen || pen.pointsPerRound !== want.pointsPerRound || pen.startsAtRound !== want.startsAtRound)){
      lines.push("Penalización: querías " + penText(want) + "; " + (pen ? "quedó en " + penText(pen) : "quedó apagada") + ".");
    } else if(!want && pen){
      lines.push("Penalización: la dejaste apagada; está activa (" + penText(pen) + ").");
    }
    const bets = meta.customBets || [];
    rules.bets.forEach(b => {
      const x = bets.find(y => y && y.id === b.id);
      if(!x){ lines.push("Pregunta «" + b.label + "»: no se guardó."); return; }
      const diffs = [];
      if(x.label !== b.label) diffs.push("el texto «" + x.label + "»");
      if(x.scope !== b.scope) diffs.push("se responde " + scopeLabel(x.scope).toLowerCase());
      if(x.points !== b.points) diffs.push(x.points + " " + pointsWord(x.points));
      if((x.closesAtRound || null) !== (b.closesAtRound || null)) diffs.push(x.closesAtRound ? "cierre con la Jornada " + x.closesAtRound : "sin cierre");
      if(diffs.length) lines.push("Pregunta «" + b.label + "»: quedó con " + diffs.join(", ") + ".");
    });
    return lines;
  }
  // What did not stay as configured is kept for this admin (this tab), for
  // «Tus reglas»; nothing of it is written over what someone else saved.
  function setupPendingKey(){ return "qracks_setup_pending:" + (SLUG || "root") + ":" + ((currentUser && currentUser.id) || "anon"); }
  function storeSetupPending(round, lines){
    try{ window.sessionStorage.setItem(setupPendingKey(), JSON.stringify({ v: 1, round: round ? round.number : null, lines })); }catch(e){}
  }
  function loadSetupPending(){
    try{
      const d = JSON.parse(window.sessionStorage.getItem(setupPendingKey()) || "null");
      return d && d.v === 1 && Array.isArray(d.lines) && d.lines.length && d.lines.every(l => typeof l === "string") ? d : null;
    }catch(e){ return null; }
  }
  function clearSetupPending(){ try{ window.sessionStorage.removeItem(setupPendingKey()); }catch(e){} }
  // pending: setupRulesDiff lines (rules that did not stay as configured),
  // shown inside the invitation sheet and kept for «Tus reglas»; never a
  // toast over its buttons, never a celebration of rules that were not stored.
  // What this setup wanted to publish (read before the flow goes away).
  function setupWantedRound(){
    const rows = setupFlow && setupFlow.rows;
    if(!rows) return null;
    const t = rows.deadline ? new Date(rows.deadline).getTime() : NaN;
    return { deadlineMs: Number.isFinite(t) ? t : null, count: roundRowsCheck(rows.matches).clean.length };
  }
  // Technical QA, ronda 4: plain-text lines when the round that is published
  // is not the one prepared here (another tab published it first, or an
  // earlier try did and its deadline passed meanwhile). Never celebrated.
  function setupRoundStateLines(round, wanted){
    const lines = [];
    const t = new Date(round && round.deadline).getTime();
    if(!round) return lines;
    if(Number.isFinite(t) && t <= serverNow()){
      lines.push("La Jornada " + round.number + " quedó publicada con el cierre del " + fmtWhenTz(round.deadline) + ", que ya pasó: nadie puede pronosticar hasta que le pongas un cierre nuevo.");
    } else if(wanted && wanted.deadlineMs != null && Number.isFinite(t) && Math.abs(t - wanted.deadlineMs) >= 60000){
      lines.push("La Jornada " + round.number + " quedó con el cierre del " + fmtWhenTz(round.deadline) + "; tú elegiste el " + fmtWhenTz(new Date(wanted.deadlineMs).toISOString()) + ".");
    }
    const n = (round.matches || []).length;
    if(wanted && wanted.count && n !== wanted.count){
      lines.push("La Jornada " + round.number + " quedó con " + n + " " + (n === 1 ? "partido" : "partidos") + "; tú preparaste " + wanted.count + ".");
    }
    return lines;
  }
  function finishSetupPublish(round, pending, wanted){
    const roundLines = setupRoundStateLines(round, wanted);
    clearRoundDraft(SETUP_DRAFT_KIND);
    trackOnceConfirmed("first_round_" + SLUG, () => hasTrackedFirstRound(SLUG), () => markFirstRoundTracked(SLUG), "first_round_published", { source: "admin_setup" });
    setupFlow = null;
    setupContinuityResolved = true;
    activeTab = "jornada";
    renderApp();
    if(setupBarObserver){ setupBarObserver.disconnect(); setupBarObserver = null; }
    const lines = Array.isArray(pending) ? pending : [];
    if(lines.length) storeSetupPending(round, lines); else clearSetupPending();
    openInviteSheet({ first: true, round, pending: lines, roundNotes: roundLines });
  }

  // ---- invitar ------------------------------------------------------------------
  // The round an invitation talks about: the given one, else the open published
  // round with the lowest number, else the latest published.
  function inviteRound(given){
    if(given && given.published !== false) return given;
    const published = meta.rounds.filter(r => r.published !== false).sort((a, b) => a.number - b.number);
    return published.find(r => !isRoundLocked(r)) || published[published.length - 1] || null;
  }
  function inviteLink(){ return `${window.location.origin}/q/${encodeURIComponent(SLUG)}`; }
  function inviteWhatsAppText(round){
    const lines = [`Únete a mi quiniela "${meta.groupName}" en QRACKS ⚽`];
    if(round && !isRoundLocked(round)) lines.push(`Haz tus pronósticos de la Jornada ${round.number} antes del ${fmtWhenTz(round.deadline)}.`);
    lines.push(`Entra aquí y crea tu PIN de 4 números: ${inviteLink()}`);
    return lines.join("\n");
  }
  // Adds names typed by the admin. Resolves to the feedback line to show.
  async function addParticipantsByName(){
    const raw = await qzPrompt("Escribe uno o varios nombres, separados por coma o uno por línea:", { title: "Añadir participantes", confirmLabel: "Agregar" });
    if(raw === null) return null;
    const names = raw.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
    if(!names.length) return null;
    const existing = new Set(meta.participants.map(p => p.name.toLowerCase()));
    const added = [];
    names.forEach(name => {
      if(existing.has(name.toLowerCase())) return;
      const p = { id: uid("p"), name, isAdmin: false, paid: false, pin: null };
      meta.participants.push(p);
      existing.add(name.toLowerCase());
      added.push(p);
    });
    if(!added.length) return "Esos nombres ya existían.";
    const result = await setMetaWithError(meta);
    if(result.ok){
      trackEvent("first_participant_added", { source: "admin_setup" });
      return `✓ ${added.length} ${added.length === 1 ? "participante añadido" : "participantes añadidos"}. Todavía no han entrado: les toca abrir el link y crear su PIN.`;
    }
    if(!result.reconciled) meta.participants = meta.participants.filter(p => !added.includes(p));
    if(result.error === "plan_participant_limit_reached" || result.error === "plan_lifecycle_limit_reached"){ showPlanBlock(result); return ""; }
    return "No pudimos añadirlos. Intenta de nuevo.";
  }
  // The invitation sheet. `first`: right after the first publish (and after a
  // reload until it is closed), with the celebration and the round number.
  // Otherwise it is the «Invitar» sheet, reachable at any time.
  function openInviteSheet(opts){
    if(document.getElementById("qz-invite-sheet")) return;
    const first = !!(opts && opts.first);
    const round = inviteRound(opts && opts.round);
    const link = inviteLink();
    // Rules that did not stay (R2) and, apart, how the published round differs
    // from the one prepared (its deadline passed, another deadline or other
    // matches): each with the place to fix it.
    const ruleLines = opts && Array.isArray(opts.pending) ? opts.pending : [];
    const roundNotes = opts && Array.isArray(opts.roundNotes) ? opts.roundNotes : [];
    const pendingLines = roundNotes.concat(ruleLines);
    const pendingHtml = pendingLines.length ? `
        <div class="qz-sheet-note" role="status">
          <p><strong>Algunas cosas no quedaron como las configuraste:</strong></p>
          <ul>${pendingLines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
          ${roundNotes.length && round ? `<button class="btn btn-primary" id="qz-invite-round">Revisar la Jornada ${esc(round.number)}</button>` : ``}
          ${ruleLines.length ? `<p>No cambiamos lo que guardó otra persona. Revísalas antes de invitar.</p>
          <button class="btn ${roundNotes.length ? "btn-ghost" : "btn-primary"}" id="qz-invite-rules">Revisar mis reglas</button>` : ``}
        </div>` : ``;
    const overlay = document.createElement("div");
    overlay.className = "qz-modal-overlay qz-modal-scroll qz-sheet-overlay";
    overlay.id = "qz-invite-sheet";
    overlay.innerHTML = `
      <div class="qz-modal-card qz-sheet" role="dialog" aria-modal="true" aria-labelledby="qz-invite-title" tabindex="-1">
        <button class="qz-sheet-x" id="qz-invite-x" aria-label="Cerrar">✕</button>
        <h2 class="qz-sheet-title" id="qz-invite-title">${first && round ? (pendingLines.length ? `La Jornada ${esc(round.number)} ya está publicada` : `🎉 ¡Tu quiniela y la Jornada ${esc(round.number)} ya están listas!`) : "Invita a tus amigos"}</h2>
        ${pendingHtml}
        <p>${round && isRoundLocked(round) ? "Tus amigos podrán pronosticar cuando la jornada tenga un cierre nuevo." : "Invita a tus amigos para que entren y hagan sus pronósticos antes del cierre."}</p>
        ${round && !isRoundLocked(round) ? `<p class="muted">Cierre de la Jornada ${esc(round.number)}: <strong>${esc(fmtWhenTz(round.deadline))}</strong>.</p>` : ``}
        <div class="qz-sheet-actions">
          <button class="btn ${pendingLines.length ? "btn-ghost" : "btn-primary"}" id="qz-invite-wa">🔗 Invitar por WhatsApp</button>
          <button class="btn btn-ghost" id="qz-invite-copy">Copiar link</button>
          <button class="btn btn-ghost" id="qz-invite-add">Añadir participantes</button>
          <button class="btn btn-ghost" id="qz-invite-view">Ver mi jornada</button>
          <button class="qz-linkbtn qz-sheet-close" id="qz-invite-close">Cerrar</button>
        </div>
        <p class="qz-sheet-feedback" id="qz-invite-feedback" role="status" aria-live="polite"></p>
        <p class="muted qz-tight">También puedes agregar nombres desde Admin → Participantes. Cada persona crea su PIN la primera vez que entra.</p>
        <p class="muted qz-tight">Copiar o compartir el link no significa que alguien ya entró. Lo verás en Admin → Participantes.</p>
      </div>`;
    document.body.appendChild(overlay);
    const trap = attachModalFocusTrap(overlay);
    const feedback = overlay.querySelector("#qz-invite-feedback");
    // The answer to a button shows where the person is looking, even on a
    // short screen where it sits below the fold.
    const showFeedback = () => { try{ feedback.scrollIntoView({ block: "nearest" }); }catch(e){} };
    let closed = false;
    // then: true → the round; "reglas" → Admin → Tus reglas; else stay.
    const close = async (then) => {
      if(closed) return;
      closed = true;
      document.removeEventListener("keydown", onKey);
      trap.release();

      if(first) await markLeftInviteScreen();
      if(then === "reglas"){ activeTab = "admin"; adminSubTab = "reglas"; renderApp(); }
      else if(then === "jornada-editar" && round){
        // Straight into editing that round in Admin → Jornadas.
        activeTab = "admin"; adminSubTab = "rondas";

      else if(then){ activeTab = "jornada"; renderApp(); }

    document.addEventListener("keydown", onKey);

      feedback.textContent = w === null

      const msg = await addParticipantsByName();
      if(msg != null && document.body.contains(overlay)){ feedback.textContent = msg; showFeedback(); }
    });

  }

  // Wrong PINs typed on this screen, per participant (memory only).
  const loginPinMisses = new Map();
  // The wait the login screen is showing next to the names, if any.
  let loginWait = null;
  // One login at a time. Between two modals of a login (a request in flight)
  // the focus is back on the name the person tapped, so a second Enter or
  // click would start another login on top, and what they type next (a new
  // PIN, say) would land in the wrong modal.
  let loginInProgress = false;
  function oneLoginAtATime(fn){
    return async (...args) => {
      if(loginInProgress) return;
      loginInProgress = true;
      try { return await fn(...args); } finally { loginInProgress = false; }
    };
  }
  function showLoginWait(key, label){
    if(credentialWaitLeft(key) <= 0) return false;

    return mountCredentialWait(el, key, { label, reveal: true });
  }
  function renderLogin(){

    const names = sortedParticipants.map(p => `
      <button class="name-btn" data-id="${esc(p.id)}">

        ${p.isAdmin ? `<span class="role">ADMIN</span>` : ``}
      </button>
    `).join("");
    root.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px;"><img src="${QRACKS_ICON_SRC}" alt="" style="width:16px;height:16px;border-radius:4px;"><span style="font-weight:800;font-size:12px;letter-spacing:0.1em;color:var(--gold-dim);">QRACKS</span></div>
          <div class="login-title display">${esc(meta.groupName)}</div>
          <div class="login-sub">Toca tu nombre para entrar 👇</div>
          ${credentialWaitNoticeHtml("qz-login-wait")}
          <div class="name-grid">${names}</div>
          <button class="btn btn-gold btn-sm" id="qz-self-register" style="width:100%;margin-top:14px;">+ No apareces? Agrégate aquí</button>
          <p class="muted" style="text-align:center;margin-top:14px;">🔒 = ya tiene PIN configurado. Si es tu nombre y no tiene candado, tócalo y ponle un PIN antes que alguien más lo haga. Si eres admin y tu nombre no tiene candado, te pediremos la contraseña de administrador.</p>
          <p class="muted" style="text-align:center;margin-top:8px;">¿Quieres tu propia quiniela? <a href="/crear" style="color:var(--pitch-light);font-weight:700;">Créala aquí</a></p>

    document.getElementById("qz-self-register").addEventListener("click", async () => {

      if(newName === null) return;

      if(meta.participants.some(p => p.name.toLowerCase() === cleanName.toLowerCase())){

      if(newPin === null) return;

      if(!result.ok){

        const p = meta.participants.find(x => x.id === btn.dataset.id);
        // Said once the app is on screen: rendering it replaces the login
        // screen, toast included.
        let afterEntry = null;
        if(!p.hasPin){
          const newPin = await qzPrompt("Este nombre todavía no tiene PIN. Ponle uno de 4 dígitos para que nadie más pueda entrar como tú:", { title: "Activa tu PIN", confirmLabel: "Continuar", pin: true });
          if(newPin === null) return;
          const cleanPin = newPin.trim();
          if(!/^\d{4}$/.test(cleanPin)){ toast("El PIN debe ser exactamente 4 números"); return; }
          if(p.isAdmin){
            const result = await setFirstAdminPin(p.id, cleanPin);
            if(!result.ok){
              if(result.error === "too_many_attempts") startCredentialWait("owner", result);
              if(showLoginWait("owner", "Contraseña de administrador")) return;
              if(result.canceled) return;
              toast(result.error === "creator_claim_missing"
                ? CREATOR_CLAIM_MISSING_MESSAGE
                : result.error === "admin_claim_required"
                ? "Contraseña de administrador incorrecta"
                : result.error === "too_many_attempts"
                  ? humanizeError(result.error, result)
                  : "No se pudo guardar el PIN, intenta de nuevo");
              return;
            }
          }else{
            const ok = await apiSetPin(p.id, null, cleanPin);
            if(!ok){ toast("No se pudo guardar el PIN, intenta de nuevo"); return; }
          }
          p.hasPin = true;
          currentUserPinCache = cleanPin;
          afterEntry = "✅ PIN guardado. Entras como " + p.name + " con esos 4 números.";
        } else {
          // A wait keeps the PIN modal up with its countdown; closing it leaves
          // the same countdown next to the names. "¿Olvidaste tu PIN?" is there
          // for everyone, during a wait too.
          const attempt = await promptCredential("Escribe el PIN de " + p.name + " para entrar:", { title: "Entrar", confirmLabel: "Entrar", pin: true, altLabel: "¿Olvidaste tu PIN?" },
            "pin:" + p.id, (pin) => verifyParticipantPin(p.id, pin));
          if(attempt === null){ showLoginWait("pin:" + p.id, "PIN de " + p.name); return; }
          if(attempt.alt){
            if(!p.isAdmin){
              await qzAlert("Pide a quien organiza la quiniela (o a otro admin) que resetee tu PIN desde Participantes. Después podrás elegir uno nuevo al tocar tu nombre.", { title: "¿Olvidaste tu PIN?" });
              return;
            }
            const newPin = await recoverAdminPin(p);
            if(!newPin) return;
            loginPinMisses.delete(p.id);
            if(loginWait && (loginWait.key === "pin:" + p.id || loginWait.key === "owner")) loginWait = null;
            p.hasPin = true;
            currentUserPinCache = newPin;
            afterEntry = "✅ Listo. Tu PIN nuevo quedó guardado.";
          } else {
            const cleanEntered = attempt.value;
            const verification = attempt.result;
            if(!verification.ok){
              // After a few misses, point at the way out that exists.
              if(verification.error !== "too_many_attempts") loginPinMisses.set(p.id, (loginPinMisses.get(p.id) || 0) + 1);
              const forgotHint = (loginPinMisses.get(p.id) || 0) >= 5
                ? (p.isAdmin
                  ? (meta.ownerPasswordSet === false
                    ? "❌ PIN incorrecto. Si lo olvidaste, toca «¿Olvidaste tu PIN?»."
                    : "❌ PIN incorrecto. ¿Lo olvidaste? Toca «¿Olvidaste tu PIN?» y elige uno nuevo con la contraseña de administrador.")
                  : "❌ PIN incorrecto. ¿Olvidaste tu PIN? Pide a quien organiza (o a otro admin) que lo resetee.")
                : "❌ PIN incorrecto";
              toast(pinFailureMessage(verification, forgotHint));
              return;
            }
            loginPinMisses.delete(p.id);
            if(loginWait && loginWait.key === "pin:" + p.id) loginWait = null;
            currentUserPinCache = cleanEntered;
          }
        }
        currentUser = p;
        myPicks = await lgReadPicks(p.id);
        activeTab = (ADMIN_ENTRY && p.isAdmin) ? "admin" : "jornada";
        await render();
        if(afterEntry) toast(afterEntry, 5000);
        // Si entró a pedir identificación al volver del pago, ahora se puede
        // confirmar la compra.
        resolveCheckoutReturn().catch((e) => console.error("checkout return failed", e));
      }));
    });
  }

      headerCopyBtn.addEventListener("click", async () => {

        if(!alreadyRevealed){

        // Segundo toque (o clic normal en desktop, donde el hover ya reveló

      if(!(await lgBeforeSwitch())) return;
      await clearSessionCookie();
      // Unsaved answers are predictions: they do not stay behind on a shared

      try{ window.sessionStorage.removeItem(answerDraftKey()); }catch(e){}
      // Liguilla: la cola, los borradores, los errores y los conflictos de esta

      lgResetSession();
      allPicksCache = {};

      ownerPasswordCache = null;

    document.getElementById("qz-change-pin").addEventListener("click", async () => {
      // The PIN just verified here is the one set-pin needs as proof: after a

      // currentUserPinCache can be empty.
      let verifiedCurrentPin = null;
      if(currentUser.hasPin){
        const waitKey = "pin:" + currentUser.id;
        const attempt = await promptCredential("Escribe tu PIN actual:", { title: "Cambiar tu PIN", confirmLabel: "Continuar", pin: true },

      if(cleanPin === (verifiedCurrentPin || currentUserPinCache)){ toast("Ese ya es tu PIN. Elige uno distinto para cambiarlo."); return; }

  // ---------- JORNADA (voting, filtered like Por jugar / En vivo / Jugados) ----------
  let clockInterval = null;

  function classifyRound(round){
    if(round.resultsPublished) return "jugados";
    if(isRoundLocked(round)) return "envivo";
    return "porjugar";
  }

  // AUTO-001 HOTFIX (BUG 1): rounds imported by Competition Sync start out
  // with `published: false` — prepared internally, but not part of the game
  // yet. The original admin-bypass here was wrong: it let unpublished
  // imported rounds flood the ADMIN's own normal "Jornada" experience
  // (Por jugar / En vivo counts, current round, pending picks, Historial)
  // as if they were already active, even though the admin never published
  // them. "Admin sees everything" belongs ONLY to Admin → Jornadas — which
  // already reads meta.rounds directly, not through this function — where
  // the organizer manages the prepared calendar. Everywhere else, published
  // rounds are the only ones that count as part of the game, for admin and
  // participant alike. `published === undefined` (every round created
  // before this ticket) is treated as published, same as always — this is
  // what keeps existing quinielas behaving identically.
  function visibleRounds(){
    return meta.rounds.filter(r => r.published !== false);
  }

  function pendingPicksInfo(){
    const openRounds = visibleRounds().filter(r => classifyRound(r) === "porjugar");
    for(const r of openRounds){
      const picks = myPicks[r.id] || {};
      const missing = r.matches.filter(m => !picks[m.id]).length;
      if(missing > 0) return { round: r, missing, total: r.matches.length };
    }
    return null;
  }

  function currentRoundContext(){
    const open = visibleRounds().filter(r => classifyRound(r) === "porjugar").sort((a,b)=>a.number-b.number);
    if(open.length) return open[0];
    const enVivo = visibleRounds().filter(r => classifyRound(r) === "envivo").sort((a,b)=>b.number-a.number);
    if(enVivo.length) return enVivo[0];
    const played = visibleRounds().filter(r => r.resultsPublished).sort((a,b)=>b.number-a.number);
    return played.length ? played[0] : null;
  }

  async function renderJornada(main){
    if(clockInterval){ clearInterval(clockInterval); clockInterval = null; }

    const counts = {porjugar:0, envivo:0, jugados:0};
    visibleRounds().forEach(r => counts[classifyRound(r)]++);
    const filters = [
      {id:"porjugar", label:"Por jugar"},
      {id:"envivo", label:"En vivo"},
      {id:"jugados", label:"Jugados"},
    ];

    const pending = pendingPicksInfo();
    const migratedBets = autoMoveAllowed() && ensureCustomBets();
    if(migratedBets) await setMeta(meta, { autoMove: true });
    const temporadaBets = (meta.customBets || []).filter(b => b.scope === "temporada");
    // HTML from its own function (MS2: one card for all the tournament questions).
    const tournamentBetsHtml = temporadaBets.length ? tournamentBetsCardHtml(temporadaBets) : "";
    const penalty = meta.paymentPenalty;
    const showPaymentNote = penalty && penalty.enabled && penalty.startsAtRound && !currentUser.paid;
    const heroRound = jornadaFilter === "porjugar" ? visibleRounds().filter(r => classifyRound(r) === "porjugar").sort((a,b)=>a.number-b.number)[0] : null;
    const heroCoversPending = !!(heroRound && pending && pending.round.id === heroRound.id);
    // MS2: the admin's «Siguiente paso», from the real state of the quiniela.
    const nextStep = currentUser.isAdmin ? await nextStepInfo() : null;
    if(!main.isConnected) return;
    const nextStepHtml = nextStepCardHtml(nextStep);
    const inviteBtnHtml = currentUser.isAdmin && meta.rounds.some(r => r.published !== false) ? `<button class="btn btn-ghost btn-sm" id="qz-open-invite">🔗 Invitar</button>` : null;

        <div class="card" style="border-color:var(--gold);background:#FFF9EC;margin-bottom:14px;">

      ${showPaymentNote ? `

          <div class="eyebrow" style="color:#7d251d;">💰 Falta tu pago</div>
          <p style="margin:4px 0 0;">Si no pagas tu cuota, se te van a restar <strong>${esc(penalty.pointsPerRound != null ? penalty.pointsPerRound : 1)} punto${(penalty.pointsPerRound===1)?'':'s'}</strong> por cada jornada a partir de la <strong>Jornada ${esc(penalty.startsAtRound)}</strong>, hasta que el admin haya recibido tu pago.</p>

      <div class="qz-tabs" id="qz-jornada-filters" style="margin-bottom:8px;">

      </div>
      <div id="qz-jornada-list"></div>
    `;
    wireScreenHeader(main, "jornada");
    wireNextStep(main);
    const openInvite = document.getElementById("qz-open-invite");
    if(openInvite) openInvite.addEventListener("click", () => openInviteSheet({ first: false }));
    const createFirstRoundBtn = document.getElementById("qz-create-first-jornada");
    if(createFirstRoundBtn){
      createFirstRoundBtn.addEventListener("click", async () => {
        activeTab = "admin";
        adminSubTab = "rondas";
        await render();
        document.getElementById("qz-admin-body")?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
    wireTournamentBets(main);
    root.querySelectorAll("[data-jf]").forEach(btn => {
      btn.addEventListener("click", () => {
        jornadaFilter = btn.dataset.jf;
        renderJornada(main);
        const newActive = document.querySelector(`[data-jf="${jornadaFilter}"]`);
        if(newActive) newActive.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      });
    });
    wireTabScrollFade(document.getElementById("qz-jornada-filters"));

    const list = document.getElementById("qz-jornada-list");
    const rounds = visibleRounds().filter(r => classifyRound(r) === jornadaFilter).slice().sort((a,b)=>a.number-b.number);

    if(!rounds.length){
      const isAdminViewer = currentUser.isAdmin;
      const adminHasNoRoundsAtAll = meta.rounds.length === 0;
      const emptyMsg = {
        porjugar: isAdminViewer
          ? "Todavía no hay una jornada disponible."
          : "No hay jornadas abiertas para votar ahora. Vuelve cuando el admin publique una nueva.",
        envivo: "No hay jornadas cerradas esperando resultado. En cuanto cierre una, aparecerá aquí.",
        jugados: isAdminViewer
          ? (adminHasNoRoundsAtAll ? "Todavía no has creado ninguna jornada." : "Todavía no has publicado resultados de ninguna jornada.")
          : "Todavía no hay jornadas con resultados publicados. Aparecerán aquí en cuanto el admin los capture."
      }[jornadaFilter];
      list.innerHTML = `<div class="card empty"><div class="display">Nada por aquí</div><p class="muted">${emptyMsg}</p></div>`;
      return;
    }

    // "En vivo" reveals everyone's picks (fair game — the deadline already passed for these)
    if(jornadaFilter === "envivo"){
      list.innerHTML = `<div class="card"><p class="muted">Cargando picks de todos…</p></div>`;
      await ensureAllPicksLoaded();
    }

    list.innerHTML = rounds.map(r => `<div class="card" id="qz-round-${esc(r.id)}" style="padding:16px;"></div>`).join("");

    rounds.forEach(round => {
      const box = document.getElementById("qz-round-" + round.id);
      if(jornadaFilter === "porjugar") renderRoundVoting(box, round, round.id === (heroRound && heroRound.id));
      else if(jornadaFilter === "envivo") (isLg(round) ? renderLiguillaLocked : renderRoundLocked)(box, round);
      else (isLg(round) ? renderLiguillaPlayed : renderRoundPlayed)(box, round);
    });

    if(jornadaFilter === "porjugar"){
      clockInterval = setInterval(() => {
        rounds.forEach(round => {
          if(isRoundLocked(round)){ renderJornada(main); return; }
          const el = document.getElementById("qz-clockbody-" + round.id);
          if(el) el.innerHTML = clockDigitsHtml(round.deadline);
        });
      }, 1000);
    }
  }



  function clockDigitsHtml(deadline){
    const {d,h,m,s} = timeParts(deadline);
    return `
      <div class="clock-digits">
        <div class="clock-seg"><span class="num mono">${String(d).padStart(2,'0')}</span><span class="unit">días</span></div>
        <div class="clock-seg"><span class="num mono">${String(h).padStart(2,'0')}</span><span class="unit">hrs</span></div>
        <div class="clock-seg"><span class="num mono">${String(m).padStart(2,'0')}</span><span class="unit">min</span></div>
        <div class="clock-seg"><span class="num mono">${String(s).padStart(2,'0')}</span><span class="unit">seg</span></div>
      </div>
    `;
  }

  function matchTeamsHtml(m){
    return `
      <div class="match-teams">
        <span class="match-team left">${esc(m.teamA)}</span>
        <span class="match-vs">VS</span>
        <span class="match-team right">${esc(m.teamB)}</span>
      </div>
    `;
  }

  // "Por jugar": open for voting, live countdown
  // MS2 · «Siguiente paso»: lo que este admin puede hacer ahora, calculado con
  // el estado real de la quiniela (jornadas, participantes, resultados). Refleja
  // un estado; no es un consejo, así que no se oculta.
  async function nextStepInfo(){
    const published = meta.rounds.filter(r => r.published !== false).sort((a, b) => a.number - b.number);
    if(!published.length){
      // The setup draft lives only in this tab (sessionStorage): say so only
      // when this tab has one.
      return {
        title: "Publica tu primera jornada",
        text: loadSetupDraft(meta)
          ? "Lo que ya configuraste en esta pestaña sigue aquí. Nada se publica hasta que lo confirmes."
          : "Elige tus reglas, tus pagos y tu primera jornada. Nada se publica hasta que lo confirmes.",
        actions: [{ id: "continue", label: "Continuar" }],
      };
    }
    const open = published.filter(r => !isRoundLocked(r));
    const others = meta.participants.filter(p => p.id !== currentUser.id);
    if(open.length && !others.some(p => p.hasPin)){
      const r = open[0];
      const when = fmtWhenTz(r.deadline);
      return {
        title: "Invita a tus amigos",
        text: others.length
          ? `Ya añadiste ${others.length} ${others.length === 1 ? "nombre" : "nombres"}, pero nadie ha entrado todavía. La Jornada ${r.number} cierra el ${when}.`
          : `Todavía nadie ha entrado. La Jornada ${r.number} cierra el ${when}.`,
        actions: [{ id: "invite", label: "🔗 Invitar" }],
      };
    }

  // MS2 · Las preguntas del torneo, en una sola tarjeta. Cada una dice hasta
  // cuándo se responde (la jornada de cierre, con fecha, hora y zona), si la
  // respuesta quedó guardada y si ya cerró. El servidor rechaza una respuesta
  // que llega después del cierre (bet_locked), y la pantalla lo dice.
  // MS2 · D4: from the question's own close (betCloseInfo), never from a
  // round looked up by number. `at`: its close in ms, or null if it has none.
  function tournamentBetClose(bet){
    const c = betCloseInfo(bet);
    if(c.kind === "own"){
      const when = fmtWhenTz(new Date(c.at).toISOString());
      const r = c.round && c.round.published !== false && sameInstantMs(c.round.deadline, c.at) ? c.round : null;
      return { at: c.at, round: r, text: r ? `Cierra con la Jornada ${r.number}: ${when}.` : `Cierra el ${when}.` };
    }
    if(c.kind === "none") return { at: null, round: null, text: "No tiene fecha de cierre: se cierra cuando termine el torneo." };
    const r = c.round;
    if(!r || r.published === false || c.at == null) return { at: null, round: null, text: `Cierra con la Jornada ${bet.closesAtRound} (fecha por confirmar).` };
    return { at: c.at, round: r, text: `Cierra con la Jornada ${r.number}: ${fmtWhenTz(r.deadline)}.` };
  }
  function savedBetGuess(betId){
    const a = currentUser && currentUser.customBetAnswers && currentUser.customBetAnswers[betId];
    return a && a.guess ? a.guess : "";
  }
  function tournamentBetStatus(bet){
    const locked = customBetsLocked(bet);
    const guess = savedBetGuess(bet.id);
    const close = tournamentBetClose(bet);
    const when = close.at != null ? fmtWhenTz(new Date(close.at).toISOString()) : "";
    if(locked){
      // Closed for protection by the migration: that time is the cutoff, not
      // when the question was meant to close, so it is not said as such.
      if(bet.closeSource === "migration_cutoff" || bet.closeSource === "protective" || !when){
        return guess ? `Ya está cerrada. Tu respuesta: «${guess}».` : "Ya está cerrada y no respondiste. Aun así puedes jugar las jornadas abiertas.";
      }
      return guess
        ? `Cerró el ${when}. Tu respuesta: «${guess}».`
        : `Cerró el ${when} y no respondiste. Aun así puedes jugar las jornadas abiertas.`;
    }
    if(guess) return when ? `✅ Guardada: «${guess}». Puedes cambiarla hasta el ${when}.` : `✅ Guardada: «${guess}».`;
    return "Todavía no respondes.";

  // H1: what a participant typed in an answer and has not saved yet, per

  // («j:roundId:betId»). Kept in this tab across repaints and reloads, so

  // answer's own «Guardar» sends it.
  function answerDraftKey(){ return "qracks_answer_drafts:" + (SLUG || "root") + ":" + ((currentUser && currentUser.id) || "anon"); }
  function loadAnswerDrafts(){
    try{
      const d = JSON.parse(window.sessionStorage.getItem(answerDraftKey()) || "{}");
      return d && typeof d === "object" && !Array.isArray(d) ? d : {};
    }catch(e){ return {}; }
  }
  function answerDraft(k){ const v = loadAnswerDrafts()[k]; return typeof v === "string" ? v : null; }
  function setAnswerDraft(k, v){
    try{
      const d = loadAnswerDrafts();
      if(v == null) delete d[k]; else d[k] = String(v).slice(0, 200);
      window.sessionStorage.setItem(answerDraftKey(), JSON.stringify(d));

  }
  // Whether the tournament card was left open or closed by the participant

  let tournamentBetsOpen = null;
  function tournamentBetRowHtml(bet){

  function tournamentBetsCardHtml(bets){
    const answered = bets.filter(b => savedBetGuess(b.id)).length;

  function wireTournamentBets(main){
    const card = document.getElementById("qz-bets-card");
    if(card) card.addEventListener("toggle", () => { tournamentBetsOpen = card.open; });
    root.querySelectorAll("[data-cb-save]").forEach(btn => {
      const betId = btn.dataset.cbSave;
      const input = document.getElementById("qz-cb-input-" + betId);
      const statusEl = document.getElementById("qz-cb-status-" + betId);
      if(input) input.addEventListener("input", () => {
        const same = input.value.trim() === savedBetGuess(betId);
        setAnswerDraft("t:" + betId, same ? null : input.value);
        statusEl.textContent = same ? tournamentBetStatus(meta.customBets.find(b => b.id === betId) || { id: betId }) : "Cambios sin guardar. Toca «Guardar respuesta».";
      });
      btn.addEventListener("click", async () => {
        const val = input.value.trim();
        if(!val){ statusEl.textContent = "Escribe una respuesta."; input.focus(); return; }
        btn.disabled = true;
        btn.textContent = "Guardando…";
        statusEl.textContent = "Guardando…";
        const result = await apiSubmitBetAnswer(currentUser.id, betId, val);
        if(result.ok){
          if(!currentUser.customBetAnswers) currentUser.customBetAnswers = {};
          const prev = currentUser.customBetAnswers[betId];
          currentUser.customBetAnswers[betId] = { guess: val, correct: prev ? prev.correct : null };
          // Only this answer's draft goes (unless it changed while saving);
          // the others stay as typed.
          const d = answerDraft("t:" + betId);
          if(d == null || d.trim() === val) setAnswerDraft("t:" + betId, null);
          toast("✅ Listo, tu respuesta quedó guardada.");
          await renderJornada(main);
          const back = document.getElementById("qz-cb-input-" + betId);
          if(back) back.focus({ preventScroll: true });

        btn.textContent = "Guardar respuesta";
        if(result.error === "bet_locked"){
          // Closed while it was on its way: nothing changed on the server,
          // and nothing typed there can be saved any more.
          setAnswerDraft("t:" + betId, null);
          statusEl.textContent = "Esta pregunta acaba de cerrar y tu respuesta no se guardó." + (savedBetGuess(betId) ? ` Tu respuesta anterior («${savedBetGuess(betId)}») se conserva.` : "");
          input.disabled = true;
          btn.remove();
        } else {
          statusEl.textContent = "No se pudo guardar. Revisa tu conexión e intenta de nuevo.";

    });

      const ok = await attemptSavePicks(statusEl, round, null, true, runManualSave);

        saveBtn.classList.remove("qz-save-success");

  // "Jugados": results known, show correct/wrong

  // Shared by renderTabla and renderSpectatorView — a single source of truth

  function feeSummaryHtml(fee, paidCount, totalP){
    const feeIsValid = typeof fee === "number" && !isNaN(fee);

    const recaudadoDisplay = feeIsValid
      ? `$${paidCount*fee} <span class="muted" style="font-family:'Manrope';font-size:13px;">de $${totalP*fee}</span>`
      : `<span style="font-size:16px;">Pendiente</span>`;
    return { feeDisplay, recaudadoDisplay };

  function drawResultsCardCanvas(list){
    const shown = list; // show everyone, not just a cut-off top
    const width = 800;
    const rowH = 58;
    const headerH = 210;
    const footerH = 60;
    const height = headerH + shown.length * rowH + footerH;
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    const F = "'Manrope', Arial, sans-serif";

    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, "#0F2E22");
    grad.addColorStop(1, "#173A2B");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#D6A73C";
    ctx.fillRect(0, 0, width, 6);

    ctx.textAlign = "center";
    ctx.fillStyle = "#D6A73C";
    ctx.font = `800 18px ${F}`;
    ctx.fillText("QRACKS", width / 2, 46);

    const context = currentRoundContext();
    ctx.fillStyle = "#F7F5EC";
    ctx.font = `800 34px ${F}`;
    ctx.fillText(meta.groupName, width / 2, 90, width - 80);
    ctx.fillStyle = "rgba(247,245,236,0.75)";
    ctx.font = `600 17px ${F}`;
    ctx.fillText("TABLA DE POSICIONES" + (context ? " · " + roundTitle(context).toUpperCase() : ""), width / 2, 120);

    ctx.strokeStyle = "rgba(214,167,60,0.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(60, 150);
    ctx.lineTo(width - 60, 150);
    ctx.stroke();

    const hasPendingPayments = shown.some(p => !p.paid);
    const rightMargin = width - 60; // 740 — mismo margen derecho ya usado por la línea divisoria de arriba
    const puntosColStart = hasPendingPayments ? 480 : 600; // igual que el encabezado, sin tocarlo
    const pagoColStart = 650; // igual que el encabezado, sin tocarlo
    const puntosColEnd = hasPendingPayments ? pagoColStart : rightMargin;
    // Centro real de cada columna: columnStart + columnWidth / 2 — ya no valores fijos aproximados.
    const puntosX = puntosColStart + (puntosColEnd - puntosColStart) / 2;
    const pagoX = pagoColStart + (rightMargin - pagoColStart) / 2;

    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(247,245,236,0.55)";
    ctx.font = `700 13px ${F}`;
    ctx.fillText("PARTICIPANTE", 105, 178);
    ctx.textAlign = "center";
    ctx.fillText("PUNTOS", puntosX, 178);
    if(hasPendingPayments) ctx.fillText("PAGO", pagoX, 178);

    const ranks = computeDenseRanks(shown);
    const medalColor = (rank) => rank===1 ? "#D6A73C" : rank===2 ? "#C9CDD3" : rank===3 ? "#B9784A" : null;

    shown.forEach((p, i) => {
      const rank = ranks[i];
      const rowY = headerH + i * rowH;
      if(i % 2 === 0){
        ctx.fillStyle = "rgba(255,255,255,0.035)";
        ctx.fillRect(40, rowY, width - 80, rowH);
      }
      const textY = rowY + rowH / 2 + 8;
      const mColor = medalColor(rank);
      if(mColor){
        ctx.beginPath();
        ctx.arc(76, rowY + rowH / 2, 17, 0, Math.PI * 2);
        ctx.fillStyle = mColor;
        ctx.fill();
        ctx.fillStyle = "#0F2E22";
        ctx.font = `800 16px ${F}`;
        ctx.textAlign = "center";
        ctx.fillText(String(rank), 76, rowY + rowH / 2 + 5);
      } else {
        ctx.fillStyle = "rgba(247,245,236,0.55)";
        ctx.font = `700 18px ${F}`;
        ctx.textAlign = "center";
        ctx.fillText(String(rank), 76, textY - 1);
      }
      ctx.textAlign = "left";
      ctx.fillStyle = mColor ? mColor : "#F7F5EC";
      ctx.font = `800 24px ${F}`;
      ctx.fillText(p.name, 105, textY, hasPendingPayments ? 340 : (width - 260));
      ctx.textAlign = "center";
      ctx.fillStyle = "#F7F5EC";
      ctx.font = `800 26px ${F}`;
      ctx.fillText(String(p.pts), puntosX, textY);
      if(hasPendingPayments){
        ctx.font = `800 22px ${F}`;
        ctx.fillText(p.paid ? "✅" : "❌", pagoX, textY);
      }
    });

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(247,245,236,0.5)";
    ctx.font = `600 13px ${F}`;
    ctx.fillText("QRACKS · " + new Date().toLocaleDateString("es-MX", {year:"numeric", month:"long", day:"numeric"}), width / 2, height - 24);

    return canvas;
  }

  async function shareResultsCard(list){
    if(!list.length){ toast("Todavía no hay nada que compartir"); return; }
    try{
      if(document.fonts && document.fonts.load){
        await Promise.all([
          document.fonts.load("800 34px Manrope"),
          document.fonts.load("700 18px Manrope"),
          document.fonts.load("600 17px Manrope")
        ]);
      }
    }catch(e){ /* fall back to system font if this fails */ }
    const canvas = drawResultsCardCanvas(list);
    canvas.toBlob(async (blob) => {
      if(!blob){ toast("No se pudo generar la imagen"); return; }
      const filename = "tabla-" + slugify(meta.groupName) + ".png";
      const file = new File([blob], filename, { type: "image/png" });
      if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file] });
          trackEvent("standings_shared", { source: "native_share" });
          return;
        }catch(e){ /* user cancelled or share failed — fall back to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      trackEvent("standings_shared", { source: "download" });
      toast("✅ Listo, la imagen se descargó.");
    }, "image/png");
  }

  // Sprint 13.6.1 — series[id] now holds the participant's OFFICIAL rank
  // (same dense-rank tie-break as the standings table, via computeDenseRanks)
  // as of each played round, instead of raw cumulative points. Uses the same
  // pointsFor() formula (with its new optional cutoff) so this can never
  // drift from the official table — it's the exact same points, just
  // evaluated "as of round N" instead of "right now".
  function progressData(){
    const played = meta.rounds.filter(r => r.resultsPublished).slice().sort((a,b)=>a.number-b.number);
    const participantMap = new Map(meta.participants.map(p => [p.id, p]));
    const series = {};
    meta.participants.forEach(p => { series[p.id] = []; });
    played.forEach(r => {
      const standingsAsOfRound = meta.participants
        .map(p => ({ id: p.id, pts: pointsFor(p.id, participantMap, r.number).pts }))
        .sort((a,b) => b.pts - a.pts);
      const ranks = computeDenseRanks(standingsAsOfRound);
      standingsAsOfRound.forEach((p, i) => { series[p.id].push(ranks[i]); });
    });
    return { rounds: played.map(r=>r.number), series };
  }

  function renderProgressChart(orderedList){
    const legendEl = document.getElementById("qz-chart-legend");
    const svgEl = document.getElementById("qz-chart-svg");
    if(!legendEl || !svgEl) return;
    const { rounds, series } = progressData();

    if(!rounds.length){
      legendEl.innerHTML = "";
      svgEl.innerHTML = `<p class="muted">Aún no hay jornadas jugadas para mostrar el progreso.</p>`;
      return;
    }
    if(chartSelectedIds === null){
      chartSelectedIds = new Set(orderedList.slice(0,5).map(p=>p.id));
    }
    const colorOf = (pid) => CHART_COLORS[orderedList.findIndex(p=>p.id===pid) % CHART_COLORS.length];

    legendEl.innerHTML = orderedList.map(p => {
      const on = chartSelectedIds.has(p.id);
      const color = colorOf(p.id);
      return `<button class="btn btn-sm" data-chip="${esc(p.id)}" style="border:1.5px solid ${on?color:'var(--line)'};background:${on?color+'22':'var(--chalk)'};color:${on?'var(--ink)':'var(--ink-soft)'};">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:5px;"></span>${esc(p.name)}
      </button>`;
    }).join("");
    legendEl.querySelectorAll("[data-chip]").forEach(chip => {
      chip.addEventListener("click", () => {
        const id = chip.dataset.chip;
        if(chartSelectedIds.has(id)) chartSelectedIds.delete(id); else chartSelectedIds.add(id);
        renderProgressChart(orderedList);
      });
    });

    const W = Math.max(420, rounds.length * 60), H = 240, padL = 34, padR = 14, padT = 14, padB = 28;
    // La escala se basa en la posición máxima REAL observada en el historial
    // completo (todos los participantes, todas las jornadas) — no en cuántos
    // participantes existen ni en cuáles chips están activos ahora mismo.
    const maxRank = Math.max(1, ...Object.values(series).flat());
    const x = (i) => padL + (i * (W - padL - padR) / Math.max(1, rounds.length-1));
    // Position 1 belongs at the top of the chart; the last place at the bottom
    // — the opposite direction from a points chart, where higher is better and
    // also higher on screen. Here higher RANK NUMBER (worse) sits lower.
    const y = (rank) => maxRank <= 1 ? (padT + (H-padT-padB)/2) : padT + ((rank-1) * (H - padT - padB) / (maxRank-1));

    const ranksToLabel = [];
    if(maxRank <= 20){
      for(let rank=1; rank<=maxRank; rank++) ranksToLabel.push(rank);
    } else {
      // Reduce automáticamente la cantidad de marcas (ej. 25 participantes -> 1,5,10,15,20,25)
      // sin tocar la escala/posición real de ninguna línea — solo qué se etiqueta.
      const rawStep = Math.ceil(maxRank / 5);
      const step = Math.max(5, Math.ceil(rawStep / 5) * 5);
      const seen = new Set([1]);
      for(let rank = step; rank < maxRank; rank += step) seen.add(rank);
      seen.add(maxRank);
      ranksToLabel.push(...Array.from(seen).sort((a,b)=>a-b));
    }
    const gridLines = [];
    ranksToLabel.forEach(rank => {
      const yy = y(rank);
      gridLines.push(`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`);
      gridLines.push(`<text x="${padL-8}" y="${yy+4}" font-size="10" text-anchor="end" fill="var(--ink-soft)" font-family="Manrope, sans-serif">${rank}°</text>`);
    });
    const xLabels = rounds.map((rn,i) => `<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--ink-soft)" font-family="Manrope, sans-serif">J${esc(rn)}</text>`).join("");

    const lines = Array.from(chartSelectedIds).map(id => {
      const pts = (series[id]||[]).map((v,i) => `${x(i)},${y(v)}`).join(" ");
      const dots = (series[id]||[]).map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${colorOf(id)}"/>`).join("");
      return `<polyline points="${esc(pts)}" fill="none" stroke="${colorOf(id)}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
    }).join("");

    svgEl.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;">
        ${gridLines.join("")}
        ${xLabels}
        ${lines}
      </svg>
    `;
  }

  // ---------- HISTORIAL ----------
  // MS2 · D4: the extra questions archived with a past tournament, with their
  // close, how many answered and how many got it right (and, for the person
  // looking, their own answer). They no longer count in the current table.
  function archivedBetsHtml(t){
    const bets = Array.isArray(t.customBets) ? t.customBets.filter(b => b && typeof b === "object" && typeof b.label === "string") : [];
    if(!bets.length) return "";
    const answers = t.betAnswers && typeof t.betAnswers === "object" ? t.betAnswers : {};
    const me = currentUser && currentUser.id;
    const rounds = Array.isArray(t.rounds) ? t.rounds : [];
    const line = (b) => {
      if(b.scope !== "temporada"){
        let hits = 0;
        rounds.forEach(r => { const res = r && r.customBetResults && r.customBetResults[b.id]; if(res) Object.keys(res).forEach(pid => { if(res[pid] === true) hits++; }); });
        return `${scopeLabel(b.scope)} · ${hits} ${hits === 1 ? "acierto" : "aciertos"}`;
      }
      const people = Object.keys(answers).filter(pid => answers[pid] && answers[pid][b.id]);
      const hits = people.filter(pid => answers[pid][b.id].correct === true).length;
      const graded = people.filter(pid => answers[pid][b.id].correct === true || answers[pid][b.id].correct === false).length;
      const closed = b.closeFlag === "closed_by_round" ? "cerró con su jornada, antes del fin del torneo"
        : b.closeSource === "protective" ? "cerrada por protección"
        : typeof b.closesAt === "string" && Number.isFinite(Date.parse(b.closesAt)) ? `cerró el ${fmtWhenTz(b.closesAt)}` : "cerrada";
      const mine = me && answers[me] && answers[me][b.id];
      return `${scopeLabel(b.scope)} · ${closed} · ${people.length} ${people.length === 1 ? "respuesta" : "respuestas"} · ${people.length && !graded ? "sin calificar" : `${hits} ${hits === 1 ? "acierto" : "aciertos"}`}`
        + (mine && mine.guess ? ` · tu respuesta: «${mine.guess}»${mine.correct === true ? " ✅" : ""}` : "");
    };
    return `
      <details class="qz-archived-bets">
        <summary class="muted" style="cursor:pointer;">Preguntas extra (${esc(bets.length)})</summary>
        <ul class="qz-sum-qs">${bets.map(b => `<li><strong>${esc(b.label)}</strong><span class="muted"> · +${esc(b.points)} ${esc(pointsWord(b.points))} · ${esc(line(b))}</span></li>`).join("")}</ul>
      </details>`;
  }
  function pastTournamentsHtml(){
    if(!meta.pastTournaments || !meta.pastTournaments.length) return "";
    const list = meta.pastTournaments.slice().reverse();
    return `
      <div class="card">
        <div class="eyebrow">Torneos anteriores</div>
        ${list.map(t => {
          const date = new Date(t.closedAt).toLocaleDateString("es-MX", {year:"numeric", month:"long", day:"numeric"});
          return `
            <div style="padding:10px 0;border-bottom:1px solid var(--line);">
              <div>
                ${t.champion ? `<strong>🏆 ${esc(t.champion.name)}</strong> <span class="muted">· ${esc(t.champion.pts)} pts</span>` : `<span class="muted">Sin campeón (no se jugaron jornadas)</span>`}
              </div>
              <div class="muted" style="margin-bottom:6px;">Cerrado el ${date} · ${esc(t.rounds.length)} jornadas jugadas</div>
              ${archivedBetsHtml(t)}
              ${t.standings && t.standings.length ? `
                <details>

                  <table style="margin-top:6px;">

                      ${(() => {
                        const tRanks = computeDenseRanks(t.standings);
                        return t.standings.map((s,i) => `<tr><td class="pos ${tRanks[i]===1?'top1':''}">${tRanks[i]}</td><td>${esc(s.name)}</td><td style="text-align:right;font-weight:700;">${esc(s.pts)}</td></tr>`).join("");
                      })()}

    `;
  }

  async function renderHistorial(main){
    // AUTO-001: resultsPublished and published are independent (see
    // classifyRound/visibleRounds above) — an admin could technically
    // capture/publish results on a still-unpublished imported round before
    // making it visible, so this also excludes those for participants.
    const published = meta.rounds.filter(r => r.resultsPublished && (currentUser.isAdmin || r.published !== false)).slice().reverse();
