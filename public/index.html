<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">QRACKS</title>
<meta name="description" content="Crea quinielas privadas, compite con tu grupo y deja que QRACKS controle el tiempo, los resultados y la tabla.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="QRACKS">
<meta property="og:title" content="QRACKS" id="og-title">
<meta property="og:description" content="Crea quinielas privadas, compite con tu grupo y deja que QRACKS controle el tiempo, los resultados y la tabla." id="og-description">
<meta property="og:image" content="https://qracks.net/og-image.png">
<meta property="og:url" content="https://qracks.net" id="og-url">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://qracks.net/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --pitch-dark:#0F2E22;
    --pitch:#173A2B;
    --pitch-light:#2D6A4F;
    --chalk:#F7F5EC;
    --paper:#FFFFFF;
    --gold:#D6A73C;
    --gold-dim:#B58F34;
    --red:#C1443A;
    --ink:#10231C;
    --ink-soft:#4B5B53;
    --line: rgba(16,35,28,0.12);
    --shadow: 0 6px 20px rgba(15,46,34,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{ margin:0; }
  #quiniela-root{
    font-family:'Manrope', sans-serif;
    background:var(--chalk);
    color:var(--ink);
    min-height:100%;
    line-height:1.4;
  }
  #quiniela-root .display{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  #quiniela-root .mono{
    font-family:'Manrope', sans-serif;
    font-variant-numeric:tabular-nums;
    font-weight:700;
  }
  #quiniela-root button{
    font-family:inherit;
    cursor:pointer;
  }
  #quiniela-root .btn{
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-weight:600;
    font-size:14px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  #quiniela-root .btn:active{ transform:scale(0.97); }
  #quiniela-root .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  #quiniela-root .btn-primary{ background:var(--pitch-dark); color:var(--chalk); }
  #quiniela-root .btn-primary:hover{ background:var(--pitch); }
  #quiniela-root .btn-gold{ background:var(--gold); color:var(--pitch-dark); }
  #quiniela-root .btn-gold:hover{ background:var(--gold-dim); }
  #quiniela-root .btn-ghost{ background:transparent; color:var(--pitch-dark); border:1.5px solid var(--line); }
  #quiniela-root .btn-ghost:hover{ background:rgba(15,46,34,0.06); }
  #quiniela-root .btn-danger{ background:var(--red); color:#fff; }
  #quiniela-root .btn-danger:hover{ opacity:0.88; }
  #quiniela-root .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  /* Sprint 13.6.3: el botón "Guardar mis picks" permanece disabled durante
     los ~2s de confirmación exitosa (para impedir una segunda petición),
     pero necesita verse con contraste completo, no apagado — esta clase
     acotada (mismos colores que .btn-primary habilitado) es la única
     excepción a la regla global de arriba, y solo aplica mientras está
     presente en el propio botón de guardado manual. */
  #quiniela-root .btn.qz-save-success:disabled{ opacity:1; cursor:default; background:var(--pitch-dark); color:var(--chalk); }
  #quiniela-root .btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:8px; }

  /* header / scoreboard */
  #quiniela-root .qz-header{
    background: linear-gradient(180deg, var(--pitch-dark), var(--pitch));
    color:var(--chalk);
    padding:16px 20px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow:var(--shadow);
  }
  #quiniela-root .qz-header-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  #quiniela-root .qz-brand-mark{
    font-weight:800; font-size:15px; letter-spacing:0.08em; color:var(--gold);
    display:block; margin-bottom:2px;
  }
  #quiniela-root .qz-brand-context{
    font-weight:700; font-size:19px; line-height:1.25; color:var(--chalk);
  }
  /* MON-003: la etiqueta del plan confirmado, debajo del nombre (o al lado, en
     móvil, si cabe). */
  #quiniela-root .qz-brand-line{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  #quiniela-root .qz-plan-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800;
    letter-spacing:0.04em; padding:2px 9px; border-radius:999px;
    background:var(--gold); color:#1a1a1a; line-height:1.4; white-space:nowrap;
  }
  /* `hidden` tiene que ganar al display de arriba: sin esto la etiqueta se veía
     en quinielas Gratis. */
  #quiniela-root .qz-plan-badge[hidden]{ display:none; }
  @media (max-width: 640px){
    #quiniela-root .qz-brand-line{ flex-direction:row; flex-wrap:wrap; align-items:center; gap:4px 8px; }
  }
  /* MON-003: la línea del plan y su botón fijo a la oferta Plus. En móvil el
     botón baja debajo de la línea en vez de apretarla. */
  #quiniela-root .qz-plan-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:8px 12px; margin:0 0 12px;
  }
  #quiniela-root .qz-brand-round{
    font-weight:600; font-size:12.5px; color:rgba(247,245,236,0.65); margin-top:1px;
  }
  /* R5: a valid name or question with no spaces (up to its limit) wraps inside
     its own box instead of widening the page. Text is never hidden; tables keep
     their own horizontal scroll. */
  #quiniela-root .qz-header-top > div:first-child{ min-width:0; }
  #quiniela-root .qz-brand-context{ overflow-wrap:anywhere; }
  #quiniela-root :is(.card p, .card li, .card h2, .card h3, .card dd, .card label, .card legend, .card summary, .card blockquote,
    .qz-qcard-text, .qz-qcard-meta, .qz-qcard-close, .qz-bet-q, .qz-wz-callout, .qz-wz-note, .qz-wz-warn, .qz-wz-alert, .qz-wz-line,
    .qz-sum-qs li, .qz-sum-list li, .qz-sheet-note, .qz-modal-message, .toast){ overflow-wrap:anywhere; }
  #quiniela-root .card select{ max-width:100%; }
  #quiniela-root th.qz-bet-th{ min-width:140px; max-width:240px; overflow-wrap:anywhere; white-space:normal; }
  #quiniela-root .qz-user-dropdown{ position:relative; flex-shrink:0; }
  #quiniela-root .qz-user-toggle{
    display:flex; align-items:center; gap:6px;
    background:rgba(247,245,236,0.1);
    border:1px solid rgba(247,245,236,0.18);
    padding:7px 12px; border-radius:999px; color:var(--chalk);
    font-size:13px; font-weight:700;
  }
  #quiniela-root .qz-user-menu{
    position:absolute; right:0; top:calc(100% + 6px); z-index:30;
    background:var(--paper); border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,0.25);
    min-width:180px; overflow:hidden; border:1px solid var(--line);
  }
  #quiniela-root .qz-user-menu button{
    display:block; width:100%; text-align:left; padding:11px 14px; background:none; border:none;
    color:var(--ink); font-size:13.5px; font-weight:600;
  }
  #quiniela-root .qz-user-menu button:hover{ background:var(--chalk); }
  #quiniela-root .qz-user-menu button + button{ border-top:1px solid var(--line); }
  #quiniela-root .qz-tabs{
    display:flex; gap:4px; margin-top:14px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  #quiniela-root .qz-tabs::-webkit-scrollbar{ display:none; }
  #quiniela-root .qz-tab{
    background:transparent; border:none; color:rgba(247,245,236,0.65);
    padding:8px 4px; font-weight:600; font-size:13.5px; white-space:nowrap;
    border-bottom:3px solid transparent; letter-spacing:0.01em;
  }
  #quiniela-root .qz-tab.active{ color:var(--chalk); border-bottom-color:var(--gold); }
  #quiniela-root .qz-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--red); margin-left:5px; vertical-align:middle;
  }
  #quiniela-root .qz-help-btn{ width:30px; height:30px; flex-shrink:0; }
  #quiniela-root .qz-tab + .qz-tab{ margin-left:14px; }

  /* UX-001: with the scrollbar hidden above, this is the only cue that a tab
     bar has more tabs off-screen — a soft fade at whichever edge still has
     content, toggled by wireTabScrollFade() below. */
  #quiniela-root .qz-tabs.qz-has-more-right{
    mask-image: linear-gradient(to right, black calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, black calc(100% - 22px), transparent 100%);
  }
  #quiniela-root .qz-tabs.qz-has-more-left{
    mask-image: linear-gradient(to left, black calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(to left, black calc(100% - 22px), transparent 100%);
  }
  #quiniela-root .qz-tabs.qz-has-more-left.qz-has-more-right{
    mask-image: linear-gradient(to right, transparent 0%, black 22px, black calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 22px, black calc(100% - 22px), transparent 100%);
  }

  #quiniela-root .qz-main{ max-width:760px; margin:0 auto; padding:20px 16px 80px; }

  /* cards */
  #quiniela-root .card{
    background:var(--paper); border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
  }
  #quiniela-root .card-primary{
    background:var(--paper); border-radius:var(--radius); border:1.5px solid var(--pitch-dark);
    box-shadow:0 8px 24px rgba(15,46,34,0.16); padding:22px; margin-bottom:16px;
  }
  #quiniela-root .card-info{
    background:transparent; border-radius:var(--radius); border:1px dashed var(--line);
    box-shadow:none; padding:14px 18px; margin-bottom:16px;
  }
  #quiniela-root .card h3{ margin:0 0 4px; font-size:15px; }
  #quiniela-root .muted{ color:var(--ink-soft); font-size:13px; }
  #quiniela-root .eyebrow{
    text-transform:uppercase; letter-spacing:0.08em; font-size:11px; font-weight:700;
    color:var(--pitch-light); margin-bottom:6px;
  }

  /* clock */
  #quiniela-root .clock-card{
    background: linear-gradient(180deg, var(--pitch-dark), var(--pitch));
    color:var(--chalk); border-radius:var(--radius); padding:7px 14px; margin-bottom:10px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  #quiniela-root .clock-card::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 90% -10%, rgba(227,178,60,0.25), transparent 55%);
    pointer-events:none;
  }
  #quiniela-root .clock-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.1em; opacity:0.75; margin-bottom:5px; }
  #quiniela-root .clock-digits{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  #quiniela-root .clock-seg{
    background:rgba(0,0,0,0.28); border:1px solid rgba(227,178,60,0.35);
    border-radius:8px; padding:5px 8px; min-width:54px; text-align:center;
  }
  #quiniela-root .clock-seg .num{ font-size:18px; font-weight:700; color:var(--gold); display:block; }
  #quiniela-root .clock-seg .unit{ font-size:9px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.7; }
  #quiniela-root .clock-closed{ font-size:15px; font-weight:600; color:var(--gold); }

  /* match card */
  #quiniela-root .match-card{
    background:var(--paper); border-radius:var(--radius); border:1px solid var(--line);
    padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  #quiniela-root .match-teams{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;
  }
  #quiniela-root .match-team{ font-weight:700; font-size:16px; flex:1; text-align:center; }
  #quiniela-root .match-team.left{ text-align:right; }
  #quiniela-root .match-team.right{ text-align:left; }
  #quiniela-root .match-vs{
    font-family:'Manrope', sans-serif; font-weight:700; font-size:11px; color:var(--ink-soft);
    background:var(--chalk); border-radius:6px; padding:3px 7px; flex-shrink:0;
  }
  #quiniela-root .pick-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  #quiniela-root .pick-btn{
    border:1.5px solid var(--line); background:var(--chalk); border-radius:10px;
    padding:10px 6px; font-weight:600; font-size:13px; color:var(--ink); text-align:center;
  }
  #quiniela-root .pick-btn.selected{ background:var(--pitch-dark); border-color:var(--pitch-dark); color:var(--chalk); }
  #quiniela-root .pick-btn.correct{ background:#DCEFE1; border-color:#2D6A4F; color:#1B4332; }
  #quiniela-root .pick-btn.wrong{ background:#F6E1DE; border-color:var(--red); color:#7d251d; }
  #quiniela-root .pick-btn:disabled{ cursor:default; }
  #quiniela-root .result-tag{
    margin-top:8px; font-size:12px; font-weight:700; text-align:center;
    color:var(--pitch-light);
  }

  /* liguilla (sprint de liguilla) */
  #quiniela-root .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  #quiniela-root .lg-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  #quiniela-root .lg-phase{ font-weight:800; font-size:19px; line-height:1.2; color:var(--pitch-dark); }
  #quiniela-root .lg-sub{ font-size:12.5px; margin-top:2px; }
  #quiniela-root .lg-strip{ background:#FFF6DF; border:1px solid #EAD9A6; border-radius:10px; padding:8px 11px; font-size:13px; display:flex; flex-direction:column; gap:2px; margin-bottom:12px; }
  #quiniela-root .lg-banner[hidden]{ display:none; }
  #quiniela-root .lg-banner{ background:#F6E1DE; border:1px solid var(--red); color:#7d251d; border-radius:10px; padding:8px 11px; margin-bottom:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-weight:600; }
  #quiniela-root .lg-match{ display:flex; flex-direction:column; gap:8px; }
  #quiniela-root .lg-line{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; max-width:300px; }
  #quiniela-root label.lg-team{ font-weight:700; font-size:15px; overflow-wrap:anywhere; min-width:0; text-transform:none; letter-spacing:0; color:var(--ink); margin:0; }
  #quiniela-root input[type=text].lg-goal{ width:56px; height:44px; text-align:center; font-size:20px; font-weight:800; border:1.5px solid var(--line); border-radius:10px; background:var(--chalk); color:var(--ink); padding:0; font-variant-numeric:tabular-nums; }
  #quiniela-root input[type=text].lg-goal:focus{ outline:3px solid var(--gold); outline-offset:1px; border-color:var(--pitch-light); }
  #quiniela-root .lg-goal[aria-invalid="true"]{ border-color:var(--red); }
  #quiniela-root .lg-goal:disabled{ opacity:.7; }
  #quiniela-root .lg-state{ font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-height:20px; }
  #quiniela-root .lg-ok{ color:var(--pitch-light); font-weight:700; }
  #quiniela-root .lg-bad{ color:#9b2c22; font-weight:600; }
  #quiniela-root .lg-warn{ color:#7a5a12; font-weight:600; }
  #quiniela-root .lg-result{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center; font-weight:700; }
  #quiniela-root .lg-result > span:first-child{ text-align:right; overflow-wrap:anywhere; }
  #quiniela-root .lg-result > span:last-child{ overflow-wrap:anywhere; }
  #quiniela-root .lg-result strong{ background:var(--chalk); border-radius:8px; padding:3px 10px; font-variant-numeric:tabular-nums; }
  #quiniela-root .lg-sum{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; }
  #quiniela-root .lg-chip{ font-size:12px; font-weight:800; border-radius:999px; padding:2px 9px; border:1px solid var(--line); color:var(--ink-soft); background:var(--paper); white-space:nowrap; }
  #quiniela-root .lg-chip.on{ color:#1B4332; background:#DCEFE1; border-color:#2D6A4F; }
  #quiniela-root .lg-status{ font-size:12px; font-weight:800; color:var(--pitch-dark); background:var(--chalk); border-radius:999px; padding:2px 9px; }
  #quiniela-root .lg-fieldset{ border:0; padding:0; margin:0 0 10px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  #quiniela-root .lg-fieldset legend{ font-weight:800; margin-bottom:6px; padding:0; }
  #quiniela-root .lg-opt, #quiniela-root label.lg-opt{ display:flex; text-transform:none; letter-spacing:0; font-size:14px; font-weight:500; color:var(--ink); margin:0; gap:10px; align-items:flex-start; border:1.5px solid var(--line); border-radius:10px; padding:10px; background:var(--paper); cursor:pointer; }
  #quiniela-root .lg-opt.on{ border:2px solid var(--pitch-light); background:#F1F8F3; }
  #quiniela-root .lg-opt.na{ border-style:dashed; background:transparent; cursor:default; }
  #quiniela-root .lg-opt input[type=radio], #quiniela-root .lg-opt input[type=checkbox]{ width:20px; height:20px; margin:2px 0 0; flex:none; accent-color:var(--pitch-light); }
  #quiniela-root .lg-opt-txt, #quiniela-root label.lg-opt-txt{ text-transform:none; letter-spacing:0; font-size:14px; font-weight:500; color:var(--ink); margin:0; display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; cursor:inherit; }
  #quiniela-root .lg-opt-state{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--pitch-light); }
  #quiniela-root .lg-opt.na .lg-opt-state, #quiniela-root .lg-opt:not(.on) .lg-opt-state{ color:var(--ink-soft); }
  #quiniela-root input[type=text].lg-pts{ flex:none; width:64px; padding:0; height:40px; text-align:center; font-weight:800; font-size:16px; border:1.5px solid var(--line); border-radius:8px; }
  #quiniela-root input[type=text].lg-pts:disabled{ background:var(--chalk); color:var(--ink-soft); }
  #quiniela-root .lg-example-wrap{ display:flex; flex-direction:column; gap:8px; margin:6px 0 10px; }
  #quiniela-root .lg-table-wrap{ overflow-x:auto; max-width:100%; }
  #quiniela-root table.lg-example{ width:100%; }
  #quiniela-root table.lg-example td, #quiniela-root table.lg-example th{ font-size:13px; padding:5px 6px; font-variant-numeric:tabular-nums; }
  #quiniela-root .lg-seg{ grid-template-columns:1fr 1fr; }
  #quiniela-root .lg-seg label{ cursor:pointer; margin:0; display:block; }
  #quiniela-root .lg-seg label:focus-within{ outline:3px solid var(--gold); outline-offset:1px; }
  #quiniela-root .lg-status-row{ grid-template-columns:repeat(4, minmax(0,1fr)); }
  #quiniela-root .lg-status-row .pick-btn{ font-size:12px; padding:9px 2px; }
  #quiniela-root .lg-org-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  #quiniela-root .lg-org-row > span:first-child{ min-width:0; overflow-wrap:anywhere; flex:1 1 180px; }
  #quiniela-root .lg-org-place{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #quiniela-root .lg-org-row select{ max-width:100%; }
  #quiniela-root .lg-org-group{ margin-bottom:10px; }
  #quiniela-root .lg-scroll-hint{ display:none; font-size:12.5px; }
  #quiniela-root .lg-h-wrap{ overflow-x:auto; max-width:100%; }
  #quiniela-root table.lg-h-table{ border-collapse:separate; border-spacing:0; }
  #quiniela-root table.lg-h-table th, #quiniela-root table.lg-h-table td{ vertical-align:top; padding:8px 10px; text-align:left; }
  #quiniela-root .lg-h-cell{ min-width:150px; font-size:13px; line-height:1.35; }
  #quiniela-root table.lg-h-table .lg-h-name{ white-space:normal; overflow-wrap:anywhere; width:128px; min-width:118px; max-width:140px; text-align:left; font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink); font-size:13px; }
  #quiniela-root .lg-h-name strong{ display:block; font-size:14px; }
  #quiniela-root .lg-h-total{ display:block; font-weight:800; font-size:15px; color:var(--pitch-dark); }
  #quiniela-root table.lg-h-table thead .lg-h-name{ text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); font-size:11px; }
  #quiniela-root .lg-h-sum{ display:block; font-size:11.5px; color:var(--ink-soft); font-weight:500; text-transform:none; letter-spacing:0; }
  #quiniela-root .lg-h-real td, #quiniela-root .lg-h-real th{ background:var(--chalk); }
  #quiniela-root .lg-h-pts.ok{ color:#1B4332; }
  #quiniela-root .lg-h-pts.no{ color:#7d251d; }

  .qz-wait-notice{

  .qz-wait-notice .qz-wait-left{ font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* HOTFIX-001: aviso de reconciliación. Igual que el modal de abajo, va
     colgado de document.body y por eso NO se escopa bajo #quiniela-root: un
     re-render (root.innerHTML se reemplaza entero al cambiar de pantalla) lo
     borraría justo cuando hace falta leerlo. */
  .qz-notice{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    width:max-content; max-width:min(520px, calc(100vw - 28px));
    background:#0f2e22; color:#f6f7f4; padding:12px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; line-height:1.4; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.28); z-index:300;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .qz-notice.show{ opacity:1; transform:translateX(-50%) translateY(4px); }

  /* UX-018: reusable confirmation modal — deliberately NOT scoped under
     #quiniela-root, since it's appended to document.body so a re-render
     elsewhere in the app (root.innerHTML gets replaced wholesale on most
     screen changes) can never silently close it out from under someone. */
  .qz-modal-overlay{
    position:fixed; inset:0; background:rgba(15,46,34,0.55); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation: qzModalFadeIn .15s ease;
  }
  @keyframes qzModalFadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* A11Y-003: respects the OS-level "reduce motion" preference. Collapses
     every animation/transition duration to effectively zero instead of
     removing them individually — end states (final opacity, colors,
     positions) are unchanged, so layout and visual appearance stay
     identical; only the motion itself goes away. Covers qzModalFadeIn plus
     the handful of short hover/focus transitions already in this file. */
  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
      scroll-behavior:auto !important;
    }
  }
  .qz-modal-card{

  .qz-modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .qz-modal-actions button{

    font-weight:700; font-size:14px; cursor:pointer;
  }

  .qz-modal-cancel:hover{ background:#E5E2D4; }

  .qz-modal-confirm.qz-modal-not-destructive{ background:#0F2E22; }
  .qz-modal-confirm:hover{ opacity:0.9; }
  /* Secondary action inside a modal ("¿Olvidaste tu PIN?"): a link, not a third button. */
  .qz-modal-alt{
    display:block; margin:12px auto 0; padding:6px 8px; background:none; border:none; cursor:pointer;
    font-family:'Manrope', sans-serif; font-size:13.5px; font-weight:700; color:#1C5233; text-decoration:underline;
  }
  /* MS2 · D4: a decision with no preselected answer, inside a dialog. */
  .qz-modal-choice{ border:0; padding:0; margin:12px 0 0; min-width:0; }
  .qz-modal-choice legend{ font-family:'Manrope', sans-serif; font-size:14px; font-weight:800; color:#10231C; padding:0; margin-bottom:4px; }
  .qz-modal-choice label{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-family:'Manrope', sans-serif; font-size:14px; line-height:1.45; color:#10231C; cursor:pointer; }
  .qz-modal-choice input{ margin-top:3px; flex:0 0 auto; width:18px; height:18px; }
  .qz-modal-confirm:disabled{ opacity:.45; cursor:not-allowed; }
  .qz-modal-input{
    width:100%; padding:9px 11px; border-radius:8px; border:1.5px solid #E7E3D6;
    font-family:'Manrope', sans-serif; font-size:16px; background:#FFFFFF; color:#10231C;
    box-sizing:border-box; margin-top:4px;
  }
  .qz-modal-input:focus{ outline:2px solid #D6A73C; outline-offset:1px; }
  /* «Mostrar / Ocultar» next to a password, in a modal or in a screen. It only
     reveals what is being typed; a stored password never comes back. */
  .qz-pass-toggle-row{ display:flex; gap:8px; align-items:stretch; margin-top:4px; }
  .qz-pass-toggle-row .qz-modal-input{ flex:1; min-width:0; margin-top:0; }

  .qz-modal-overlay.qz-modal-scroll{ overflow-y:auto; align-items:flex-start; }
  .qz-modal-scroll .qz-modal-card{ margin:auto; }
  .qz-modal-card:focus{ outline:none; }

  /* ---------- Marketing Hero (renderHome) ---------- */
  /* .qz-home-fold wraps just .qz-hero-section + .qz-home-trust (see renderHome()).
     Column flex lets the hero and the trust bar split one viewport-height
     naturally: the trust bar is measured by the browser (flex-shrink:0, its real
     rendered height, whatever that is at any width/font-size/wrap), and the hero
     (flex:1) simply gets whatever is left. No hardcoded reserved height anywhere.
     Scoping this flex context to a dedicated wrapper (instead of #quiniela-root
     itself) keeps it a fixed, always-2-item flex formatting context — any section
     added below (HOME-003, HOME-004, ...) is a plain sibling in normal document
     flow and can never compete with the Hero/Trust Bar for space. */
  #quiniela-root .qz-home-fold{

    #quiniela-root .qz-setup-aside{ display:block; grid-column:2; grid-row:1 / span 2; position:sticky; top:16px; align-self:start; }
    #quiniela-root .qz-setup-aside[hidden]{ display:none; }
    #quiniela-root .qz-setup-bar{ grid-column:1; grid-row:2; align-self:start; position:static; background:transparent; border-top:none; padding:0 0 40px; }
    #quiniela-root .qz-setup-bar-inner{ max-width:none; margin:0; }
    #quiniela-root .qz-setup-next{ flex:0 0 auto; min-width:220px; }
    #quiniela-root .qz-sum-grid{ grid-template-columns:minmax(0, 1fr) 340px; gap:24px; align-items:start; }
    /* not sticky: «Qué pasa al publicar» grows down and must stay reachable */
    #quiniela-root .qz-sum-side{ position:static; }
    #quiniela-root .qz-wz-title{ font-size:32px; }
  }
  /* the invitation sheet: a bottom sheet on a phone, a centered card on a laptop */
  .qz-sheet{ position:relative; max-width:480px; }
  /* R5b: the invitation sheet, the dialogs and the notice hang from <body>,
     outside #quiniela-root, so the R5 rules there never reached them. A long
     word with no spaces (a question of 194 characters) wraps inside them too;
     nothing is hidden. overflow-wrap is inherited by everything inside. */
  .qz-modal-card, .qz-sheet, .qz-notice{ overflow-wrap:anywhere; min-width:0; }
  .qz-sheet .qz-sheet-note, .qz-sheet .qz-sheet-note ul, .qz-modal-message{ max-width:100%; min-width:0; }
  .qz-sheet-title{ font-size:22px; line-height:1.25; margin:0 28px 8px 0; font-weight:800; }
  .qz-sheet-x{ position:absolute; top:10px; right:10px; width:44px; height:44px; border:none; background:transparent; font-size:18px; cursor:pointer; }
  .qz-sheet-actions{ display:flex; flex-direction:column; gap:8px; margin:14px 0 8px; }
  .qz-sheet-actions .btn{ min-height:48px; font-size:15px; }
  .qz-sheet-close{ align-self:center; }
  .qz-sheet-feedback{ min-height:20px; font-size:14px; font-weight:600; color:#1B4332; margin:4px 0 8px; }
  .qz-select-all{ user-select:all; word-break:break-all; font-weight:700; }
  @media (max-width:640px){
    .qz-sheet-overlay{ align-items:flex-end !important; padding:0 !important; }
    .qz-sheet-overlay .qz-sheet{ max-width:none; width:100%; margin:0 !important; border-radius:18px 18px 0 0; padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
    /* never taller than the screen: on a short phone the sheet scrolls inside,
       so its title, ✕ and notes stay reachable instead of going off the top */
    .qz-sheet-overlay .qz-sheet{ max-height:100vh; max-height:100dvh; overflow-y:auto; overscroll-behavior:contain; }
  }
  /* The sheet lives in <body>, outside #quiniela-root: its buttons need their own look. */
  .qz-sheet{ font-family:'Manrope', sans-serif; color:#10231C; }
  .qz-sheet p{ font-size:14px; line-height:1.5; margin:0 0 6px; }
  .qz-sheet .muted{ color:#4B5B53; font-size:13px; }
  .qz-sheet .qz-tight{ margin:2px 0 6px; }
  .qz-sheet .qz-sheet-note ul{ margin:4px 0 6px; padding-left:18px; font-size:14px; line-height:1.45; }
  .qz-sheet .qz-sheet-note{ background:#FFF9EC; border:1px solid #F0D79A; border-left:4px solid #D6A73C; border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.45; color:#3F2D00; }
  .qz-sheet .btn{ font-family:inherit; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; }
  .qz-sheet .btn:focus-visible, .qz-sheet .qz-linkbtn:focus-visible, .qz-sheet-x:focus-visible{ outline:3px solid #D6A73C; outline-offset:2px; }
  .qz-sheet .btn-primary{ background:#0F2E22; color:#F7F5EC; }
  .qz-sheet .btn-ghost{ background:transparent; color:#0F2E22; border:1.5px solid rgba(16,35,28,0.12); }
  .qz-sheet .qz-linkbtn{ font-family:inherit; background:none; border:none; padding:8px; min-height:44px; color:#2D6A4F; font-weight:700; font-size:14px; text-decoration:underline; cursor:pointer; }
</style>

  const pathParts = window.location.pathname.split("/").filter(Boolean);
  let ROUTE = "root";
  let SLUG = null;
  // MON-003: "/a/:slug" es la misma quiniela, abierta directamente en Admin. Es
  // a donde vuelve el organizador desde el pago. No da ningún permiso: entrar
  // como admin sigue exigiendo una sesión de admin que el servidor reconozca.
  let ADMIN_ENTRY = false;
  if(pathParts.length === 0){ ROUTE = "root"; }
  else if(pathParts[0] === "q" && pathParts[1]){ ROUTE = "quiniela"; SLUG = decodeURIComponent(pathParts[1]); }
  else if(pathParts[0] === "a" && pathParts[1]){ ROUTE = "quiniela"; SLUG = decodeURIComponent(pathParts[1]); ADMIN_ENTRY = true; }
  else if(pathParts[0] === "crear"){ ROUTE = "crear"; }
  else if(pathParts[0] === "panel-plataforma"){ ROUTE = "platform"; }
  // ONB-14 · «Ver cómo se juega»: una página propia, sin indexar.
  else if(pathParts[0] === "demo" && pathParts.length === 1){ ROUTE = "demo"; }
  else { ROUTE = "unknown"; }

  // Una vuelta del pago que entró por la ruta antigua (/q/…?qz_pago=…, de un
  // checkout abierto antes de que existiera /a/) se trata igual: se pasa a /a/
  // sin recargar, con sus parámetros intactos.
  if(ROUTE === "quiniela" && !ADMIN_ENTRY){
    try{
      const qs = new URLSearchParams(window.location.search);
      if(qs.has("qz_pago") || qs.has("qz_pago_cancelado")){
        ADMIN_ENTRY = true;
        window.history.replaceState({}, "", "/a/" + encodeURIComponent(SLUG) + window.location.search + window.location.hash);
      }
    }catch(e){}
  }

  function currentMetaKey(){ return SLUG ? ("quiniela:" + SLUG + ":meta") : "quiniela_meta_v1"; }
  // Post-creation continuity: /crear redirects here with ?setup=1 right
  // after a successful creation. Read once at load — renderAdminSetupPin()
  // strips it from the URL bar itself once the PIN is saved, so a later
  // hard reload never re-enters this branch.
  const IS_SETUP_FLOW = ROUTE === "quiniela" && new URLSearchParams(window.location.search).has("setup");
  function currentPicksKey(pid){ return SLUG ? ("quiniela:" + SLUG + ":picks:" + pid) : ("quiniela_picks_" + pid + "_v1"); }
  function metaKeyFor(slug){ return "quiniela:" + slug + ":meta"; }

  function slugify(str){
    return (str || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // strip accents
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 40) || "quiniela";
  }

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

  // ---------- platform-level storage (list of all quinielas, jornada limit/pricing settings) ----------
  async function getPlatformIndex(){
    try{
      const creds = platformPasswordCache ? { platform: platformPasswordCache } : undefined;
      const r = await kvGet(PLATFORM_INDEX_KEY, creds);
      return r.found ? r.value : { quinielas: [] };
    }catch(e){ console.error("getPlatformIndex failed", e); return { quinielas: [] }; }
  }
  // MON-001F: the panel loads these rows once and every later edit re-sends
  // that same snapshot, so the server now rejects a write whose `version` is
  // no longer current (409 stale_version) instead of silently overwriting
  // whatever changed in between. Recovery is always the same and never a
  // blind retry of the stale snapshot: say what happened, then re-render the
  // dashboard, which re-reads everything from the server.
  // The flag lets a caller skip its own generic "no se pudo guardar" toast
  // when this already explained the real reason.
  let platformStaleHandled = false;
  async function savePlatformRow(key, value){
    platformStaleHandled = false;
    try{
      const r = await kvSetWithError(key, value, { platform: platformPasswordCache });
      if(r.ok){
        // The panel keeps this object in memory and edits it again (each
        // checkbox toggle re-sends it), so it has to carry forward the
        // version the server just wrote — otherwise the very next edit would
        // look stale and 409 for no real reason.
        if(value && typeof value === "object" && Number.isSafeInteger(r.version)) value.version = r.version;
        return true;
      }
      if(r.error === "stale_version"){
        platformStaleHandled = true;
        toast(ERROR_MESSAGES.stale_version);
        renderPlatformDashboard();
      }
      return false;
    }catch(e){ console.error("savePlatformRow failed", key, e); return false; }
  }
  async function setPlatformIndex(idx){
    return savePlatformRow(PLATFORM_INDEX_KEY, idx);
  }
  // MON-002B: read WITH the platform password. The unauthenticated read used
  // to work because the server handed this row to anyone who asked, minus
  // only the password — which meant depositInfo (bank, CLABE, account
  // holder) went out with it. The public projection is empty now, so the
  // dashboard has to identify itself, which it always should have.
  //
  // jornadaLimit / pricePerParticipant / depositInfo are gone with the rest
  // of the legacy cobro model: the real numbers live in commercial_config.
  async function getPlatformSettings(){
    try{
      const r = await kvGet(PLATFORM_SETTINGS_KEY, { platform: platformPasswordCache });
      return r.found ? r.value : {};
    }catch(e){ console.error("getPlatformSettings failed", e); return {}; }
  }
  const COMMERCIAL_CONFIG_KEY = "commercial_config";
  // The live commercial SSOT: what Gratis and Plus mean, and what Plus costs.
  // Every enforcement decision on the server reads this same row, so editing
  // it here is a real change everywhere, with no deploy.
  async function getCommercialConfig(){
    try{
      const r = await kvGet(COMMERCIAL_CONFIG_KEY, { platform: platformPasswordCache });
      return r.found ? r.value : null;
    }catch(e){ console.error("getCommercialConfig failed", e); return null; }
  }
  async function setCommercialConfig(cfg){
    return savePlatformRow(COMMERCIAL_CONFIG_KEY, cfg);
  }
  async function setPlatformSettings(s){
    return savePlatformRow(PLATFORM_SETTINGS_KEY, s);
  }
  const PLATFORM_PAYMENTLOG_KEY = "platform_payment_log";
  async function getPlatformPaymentLog(){
    try{
      const creds = platformPasswordCache ? { platform: platformPasswordCache } : undefined;
      const r = await kvGet(PLATFORM_PAYMENTLOG_KEY, creds);
      return r.found ? r.value : { payments: [] };
    }catch(e){ console.error("getPlatformPaymentLog failed", e); return { payments: [] }; }
  }


  // MON-001F.2 — operaciones Admin que tocan más de una fila.
  // Se mandan como INTENCIÓN (los campos que cambian), no como el documento
  // completo que el panel trae en memoria: el servidor las aplica sobre el
  // estado actual dentro de una sola transacción, así que no existe snapshot
  // obsoleto que rechazar y no pueden quedar a medias.
  function newGrantId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    return "grant" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }
  async function platformPost(path, body){
    try{
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Qracks-Platform-Auth": platformPasswordCache || "" },
        credentials: "same-origin",
        body: JSON.stringify(body)
      });

    if(s < 3600) return Math.floor(s / 60) + ":" + two(s % 60) + "\u00a0min";

  async function promptCredential(message, opts, waitKey, check){
    while(true){

      if(raw === QZ_PROMPT_ALT) return { alt: true };
      const value = raw.trim();
