<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRACKS — Hero (Producción)</title>
<style>
  :root{
    --pitch-dark:#0F2E22;
    --pitch:#173A2B;
    --pitch-light:#2D6A4F;
    --chalk:#F7F5EC;
    --paper:#FFFFFF;
    --gold:#D6A73C;
    --gold-dim:#B58F34;
    --red:#C1443A;
    --ink:#10231C;
    --ink-soft:#4B5B53;
    --line: rgba(16,35,28,0.12);
    --shadow: 0 6px 20px rgba(15,46,34,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Manrope', -apple-system, sans-serif;
    background:var(--chalk); color:var(--ink);
  }
  .display{ font-family:'Manrope', sans-serif; font-weight:800; letter-spacing:-0.01em; }
  img{ max-width:100%; display:block; }

  /* ---------- HERO SECTION ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(ellipse 780px 620px at 76% 42%, rgba(45,106,79,0.5) 0%, transparent 60%),
      linear-gradient(180deg, var(--pitch-dark) 0%, var(--pitch) 58%, var(--pitch) 74%, var(--chalk) 100%);
    padding: 28px 6vw 0;
    overflow:hidden;
  }
  .hero-nav{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1180px; margin:0 auto 0; padding-bottom:34px; position:relative; z-index:2;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-icon{ height:30px; width:auto; display:block; }
  .brand-word{ font-weight:800; font-size:17px; letter-spacing:0.08em; color:var(--gold); }
  .nav-cta{
    border:1.5px solid rgba(247,245,236,0.3); color:var(--chalk);
    background:transparent; border-radius:10px; padding:9px 18px;
    font-weight:600; font-size:13.5px; font-family:inherit; cursor:pointer;
  }

  .hero-grid{
    max-width:1180px; margin:0 auto; padding-bottom:0; position:relative; z-index:2;
    display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;
  }
  .hero-copy{ padding-bottom:56px; }
  .hero-headline{
    color:var(--chalk); font-size:44px; line-height:1.12; margin:0 0 18px;
  }
  .hero-sub{
    color:rgba(247,245,236,0.78); font-size:17px; line-height:1.55;
    max-width:440px; margin:0 0 30px; font-weight:500;
  }
  .hero-ctas{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .btn{
    border:none; border-radius:10px; padding:14px 26px;
    font-weight:700; font-size:15px; font-family:inherit; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-gold{ background:var(--gold); color:var(--pitch-dark); box-shadow:0 6px 16px rgba(214,167,60,0.25); }
  .btn-ghost-dark{ background:transparent; color:var(--chalk); border:1.5px solid rgba(247,245,236,0.3); padding:12.5px 24px; }

  .trust-bar{ margin-top:32px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .trust-item{ display:flex; align-items:center; gap:7px; color:rgba(247,245,236,0.65); font-size:12.5px; font-weight:600; line-height:1.3; }
  .trust-ico{ font-size:14px; }

  /* ---------- PHONE MOCKUP (real screenshots inside) ---------- */
  .stage{ position:relative; padding:26px 0 0; display:flex; justify-content:center; z-index:2; }

  .float-card{
    position:absolute; border-radius:var(--radius);
    box-shadow:0 10px 22px rgba(15,46,34,0.16); z-index:1; overflow:hidden;
    line-height:0;
  }
  .float-jornada{ top:8px; left:-8px; width:190px; }
  .float-jornada img{ width:100%; height:auto; display:block; }

  .float-participantes{ bottom:40px; right:-20px; width:180px; border:1px solid var(--line); }
  .float-participantes img{ width:100%; height:auto; display:block; }

  .phone{
    width:300px; height:612px; background:var(--pitch-dark); border-radius:38px;
    padding:12px; box-shadow:0 30px 60px rgba(15,46,34,0.4); position:relative; z-index:2;
  }
  .phone-notch{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:110px; height:20px; background:var(--pitch-dark); border-radius:0 0 14px 14px; z-index:3;
  }
  .phone-screen{
    width:100%; height:100%; background:var(--chalk); border-radius:28px; overflow:hidden;
  }
  .phone-screen img{
    width:100%; height:100%; object-fit:cover; object-position:top center; display:block;
  }

  @media (max-width:900px){
    .hero{ padding-left:5vw; padding-right:5vw; }
    .hero-grid{ grid-template-columns:1fr; gap:48px; }
    .hero-headline{ font-size:32px; }
    .hero-copy{ padding-bottom:0; text-align:left; }
    .stage{ padding:12px 0 40px; }
    .float-jornada{ width:150px; top:-6px; left:-4px; }
    .float-participantes{ width:140px; bottom:24px; right:-6px; }
    .phone{ width:250px; height:510px; }
  }
  @media (max-width:520px){
    .hero-nav{ padding-bottom:26px; }
    .hero-headline{ font-size:27px; }
    .hero-sub{ font-size:15px; }
    .trust-bar{ flex-direction:column; align-items:flex-start; gap:9px; }
    .float-jornada, .float-participantes{ display:none; }
    .phone{ width:230px; height:470px; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-nav">
    <div class="brand">
      <img src="official_icon.svg" alt="" class="brand-icon">
      <span class="brand-word">QRACKS</span>
    </div>
    <button class="nav-cta">Ya tengo una invitación</button>
  </div>

  <div class="hero-grid">
    <div class="hero-copy">
      <h1 class="hero-headline display">Organiza quinielas<br>sin complicaciones.</h1>
      <p class="hero-sub">Crea o únete a una quiniela, invita a tus amigos y deja que QRACKS se encargue del resto.</p>
      <div class="hero-ctas">
        <a href="#" class="btn btn-gold">Crear mi quiniela</a>
        <a href="#" class="btn btn-ghost-dark">Ya tengo una invitación</a>
      </div>
      <div class="trust-bar">
        <div class="trust-item"><span class="trust-ico">📱</span>Sin instalar aplicaciones</div>
        <div class="trust-item"><span class="trust-ico">🌐</span>Funciona desde cualquier dispositivo</div>
        <div class="trust-item"><span class="trust-ico">🔗</span>Comparte un enlace y todos pueden participar</div>
      </div>
    </div>

    <div class="stage">
      <div class="float-card float-jornada">
        <img src="hero_assets_jornada.png" alt="Cuenta regresiva de la jornada en QRACKS">
      </div>

      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <img src="hero_assets_tabla.png" alt="Tabla de posiciones real de QRACKS">
        </div>
      </div>

      <div class="float-card float-participantes">
        <img src="hero_assets_participantes.png" alt="Lista de participantes real de QRACKS">
      </div>
    </div>
  </div>
</section>

</body>
</html>
