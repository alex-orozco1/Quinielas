  function renderHistDetail(round){
    const detail = document.getElementById("qz-hist-detail");
    if(isLg(round)){
      renderLiguillaHistDetail(detail, round);
      detail.scrollIntoView({ behavior: window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      return;
    }
    const perParticipant = meta.participants.slice().sort((a,b) => a.name.localeCompare(b.name, "es", {sensitivity:"base"})).map(p => {
      const picks = (allPicksCache[p.id] || {})[round.id] || {};
      let correct = 0;
      const cells = round.matches.map(m => {
        const pick = picks[m.id];
        const result = round.results[m.id];
        const label = pick === 'A' ? m.teamA : pick === 'B' ? m.teamB : pick === 'D' ? 'Empate' : '—';
        const isCorrect = pick && result && pick === result;
        if(isCorrect) correct++;
        return `<td style="text-align:center;${isCorrect?'color:#1B4332;font-weight:700;':pick?'color:#7d251d;':'color:var(--ink-soft);'}">${esc(label)}</td>`;
      }).join("");
      return { name: p.name, correct, cellsHtml: cells };
    });
    const maxCorrect = Math.max(0, ...perParticipant.map(p => p.correct));
    const mvps = maxCorrect > 0 ? perParticipant.filter(p => p.correct === maxCorrect).map(p => p.name) : [];
    const rows = perParticipant.map(p => `<tr><td>${esc(p.name)} ${mvps.includes(p.name) ? '🏅' : ''}</td>${p.cellsHtml}<td style="font-weight:700;text-align:center;">${p.correct}</td></tr>`).join("");
    const resultRow = round.matches.map(m => {
      const r = round.results[m.id];
      const label = r==='A'? m.teamA : r==='B'? m.teamB : r==='D'?'Empate':'—';
      return `<td style="font-weight:700;text-align:center;">${esc(label)}</td>`;
    }).join("");
    detail.innerHTML = `
      ${mvps.length ? `
        <div class="card" style="border-color:var(--gold);background:#FFF9EC;">
          <div class="eyebrow" style="color:var(--gold-dim);">🏅 MVP de la Jornada ${esc(round.number)}</div>
          <p style="margin:4px 0 0;">${mvps.map(esc).join(", ")} — ${maxCorrect} de ${esc(round.matches.length)} aciertos</p>
        </div>
      ` : ``}
      <div class="card" style="overflow-x:auto;">
        <h3>Jornada ${esc(round.number)} — detalle</h3>
        <table>
          <thead><tr><th>Participante</th>${round.matches.map(m=>`<th style="text-align:center;">${esc(m.teamA)}<br>vs ${esc(m.teamB)}</th>`).join("")}<th style="text-align:center;">Pts</th></tr></thead>
          <tbody>
            <tr style="background:var(--chalk);"><td><strong>Resultado real</strong></td>${resultRow}<td></td></tr>
            ${rows}
          </tbody>
        </table>
      </div>
    `;
    // Scroll the newly-rendered detail into view, offset by the REAL sticky
    // header height (same measured-live approach as openRoundEditor) so
    // "Ver detalle" doesn't leave the top of the detail hidden under
    // .qz-header. detail.innerHTML above is synchronous, so the layout is
    // already up to date here -- no arbitrary delay or extra frame needed.
    // Re-measures on every call, so repeated clicks and switching between
    // jornadas each land correctly instead of relying on stale values from a
    // previous open.
    const scrollTarget = detail.firstElementChild || detail;
    const headerEl = document.querySelector("#quiniela-root .qz-header");
    const headerHeight = headerEl ? headerEl.getBoundingClientRect().height : 0;
    const BREATHING_ROOM_PX = 12;
    const targetTop = scrollTarget.getBoundingClientRect().top + window.scrollY - headerHeight - BREATHING_ROOM_PX;
    const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: Math.max(0, targetTop), behavior: reducedMotion ? "auto" : "smooth" });
  }

  // ---------- LIGUILLA (sprint de liguilla, D1–D7) ----------
  //
  // La puntuación vive en /liguillaScoring.js, el MISMO archivo que usa el
  // servidor: aquí sólo se pinta. Una jornada sin `stage` es fase regular y
  // nada de este bloque la toca.
  const LG = window.QracksLiguilla || null;
  function isLg(r){ return !!(LG && r && r.stage === "liguilla"); }
  function lgPhaseText(r){ return LG && r ? LG.phaseLabel(r.phase) : null; }
  // La fase primero; el número de jornada es dato secundario.
  function roundTitle(r){
    if(!isLg(r)) return "Jornada " + r.number;
    return lgPhaseText(r) || ("Liguilla · Jornada " + r.number);
  }
  function roundSubtitle(r){ return isLg(r) && lgPhaseText(r) ? "Jornada " + r.number : ""; }
  function lgRulesOf(r){ return isLg(r) ? LG.roundRules(r) : null; }
  function lgConfigRules(){
    if(!LG) return null;
    const v = LG.validateRules(meta.settings && meta.settings.liguilla);
    return v.ok ? v.rules : null;
  }
  function lgPts(n){ return n + " " + (Number(n) === 1 ? "pt" : "pts"); }
  function lgScoreText(s){ return s && LG && LG.isScore(s) ? `${s.a}–${s.b}` : ""; }
  function lgRulesSummary(rules){
    if(!rules) return "";
    if(!rules.exactBonus) return `Ganador o empate · ${lgPts(rules.resultPoints)} por acierto · sin extra por marcador exacto`;
    return `Ganador o empate · ${lgPts(rules.resultPoints)} · marcador exacto +${rules.exactBonus} (total ${rules.resultPoints + rules.exactBonus})`;
  }
  // `summary`: fuera de la votación (cerrada, jugados) se describen las reglas,
  // no se pide pronosticar.
  function lgRulesStripHtml(rules, summary){
    if(!rules) return "";
    const head = summary
      ? (rules.capture === "score" ? "Liguilla con marcador exacto." : "Liguilla: quién gana o si empatan.")
      : (rules.capture === "score" ? "Pronostica el marcador." : "Pronostica quién gana o si empatan.");
    const detail = rules.exactBonus
      ? `Ganador o empate ${lgPts(rules.resultPoints)} · marcador exacto +${rules.exactBonus} (total ${rules.resultPoints + rules.exactBonus}).`
      : `${lgPts(rules.resultPoints)} por atinarle al ganador o al empate.`;
    return `<div class="lg-strip"><strong>${esc(head)}</strong><span>${esc(detail)}</span><span>Cuenta la prórroga, no los penales.</span></div>`;
  }
  function lgLockedRoundLabel(lock){
    if(!lock) return "";
    const r = meta.rounds.find(x => x.id === lock.roundId);
    return r ? roundTitle(r) : ("la Jornada " + lock.roundNumber);
  }
  // Lo guardado (aceptado por el servidor) de UN partido en mis pronósticos.
  function lgAccepted(round, matchId){
    const rp = myPicks[round.id] || {};
    const rules = lgRulesOf(round);
    if(rules && rules.capture === "score"){
      const s = rp.__score && rp.__score[matchId];
      return LG.isScore(s) ? { a: s.a, b: s.b } : null;
    }
    return ["A","D","B"].includes(rp[matchId]) ? rp[matchId] : null;
  }
  function lgSetAccepted(round, matchId, value){
    const rules = lgRulesOf(round);
    if(!myPicks[round.id]) myPicks[round.id] = {};
    const rp = myPicks[round.id];
    if(value == null){ delete rp[matchId]; if(rp.__score) delete rp.__score[matchId]; return; }
    if(rules.capture === "score"){
      rp[matchId] = LG.outcomeOfScore(value);
      rp.__score = rp.__score || {};
      rp.__score[matchId] = { a: value.a, b: value.b };
    } else {
      rp[matchId] = value;
    }
  }
  function lgPickText(round, m, value){
    if(value == null) return "";
    if(typeof value === "object") return lgScoreText(value);
    return value === "A" ? m.teamA : value === "B" ? m.teamB : "Empate";
  }
  function lgOutcomeText(m, outcome){
    return outcome === "A" ? "Gana " + m.teamA : outcome === "B" ? "Gana " + m.teamB : outcome === "D" ? "Empate" : "";
  }
  function lgTime(iso){
    try{ return new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" }); }catch(e){ return ""; }
  }

  // ---- guardado por partido -------------------------------------------------
  //
  // Cada partido se guarda solo en cuanto tiene los dos goles (o el botón en
  // 1X2), y «Guardado» aparece sólo cuando el servidor lo confirma. Una sola
  // escritura en curso a la vez; si la persona sigue escribiendo, se envía lo
  // último. Un partido incompleto no se envía y no detiene a los demás.
  const lgDrafts = {};   // roundId -> matchId -> { a: "2", b: "" } lo escrito, sin confirmar
  const lgState = {};    // roundId -> matchId -> { st, at, error, current }
  const lgRejected = {}; // roundId -> matchId -> { value, at } lo que el cierre no aceptó
  const lgQueue = new Map(); // "rid|mid" -> { round, matchId, value }
  function lgSt(rid, mid){ return ((lgState[rid] || {})[mid]) || null; }
  function lgSetSt(rid, mid, st){ (lgState[rid] = lgState[rid] || {})[mid] = st; }
  function lgDraft(rid, mid){ return ((lgDrafts[rid] || {})[mid]) || null; }
  function lgSetDraft(rid, mid, d){ (lgDrafts[rid] = lgDrafts[rid] || {}); if(d) lgDrafts[rid][mid] = d; else delete lgDrafts[rid][mid]; }
  // "" -> null (vacío no es 0), "2" -> 2, cualquier otra cosa -> NaN.
  function lgParseGoal(v){
    const t = String(v == null ? "" : v).trim();
    if(t === "") return null;
    if(!/^\d{1,2}$/.test(t)) return NaN;
    const n = Number(t);
    return LG.isGoals(n) ? n : NaN;
  }
  // Cada trabajo nace con DUEÑO: la quiniela, el participante y la generación
  // de sesión de quien lo escribió. «Cambiar usuario» sube la generación
  // (lgResetSession), así que nada de la sesión anterior se envía con la
  // identidad nueva, ni se pinta en su pantalla, ni se reintenta como suyo. Una
  // respuesta tardía se descarta: lo que el servidor ya aceptó sigue en su fila
  // y se vuelve a leer al entrar (P1 de la revisión de e8fde8d).
  let lgGen = 0;
  let lgWorkingGen = null;
  // Guardados en camino, cada uno con la generación de quien lo envió: el
  // colgado de una sesión anterior no cuenta como pendiente de la actual (F3).
  const lgInFlightJobs = new Set();
  // Reloj lógico: ordena las lecturas de pronósticos entre sí.
  let lgSeq = 0;
  let lgSwitching = false;
  // Respuestas tardías (Technical QA de 602a38a, G1, y de b14c58c, H1–H3):
  // el valor que trae una respuesta de una sesión anterior NO manda; sólo
  // avisa que el servidor cambió. Si la misma persona está dentro, se vuelve a
  // leer del servidor (esa lectura sale después de que la escritura quedó
  // confirmada, así que trae ese valor o uno más nuevo) y se toma para los
  // partidos de liguilla que la sesión actual no tiene en camino, guardados,
  // en borrador ni confirmados por el servidor después de que salió la
  // relectura. Si no está dentro, su próxima entrada lee del servidor después:
  // no hace falta nada más. Una relectura que falla no cambia nada, y una que
  // termina en otra sesión no se aplica.
  // Por "quiniela|participante", la última relectura completada.
  const lgRefreshed = {};
  // Por "jornada|partido": cuándo (lgSeq) esta sesión recibió del servidor la
  // última respuesta sobre ese partido.
  const lgLocalSeq = {};
  // Copia a `into` lo de las jornadas de liguilla de `from` (lectura del
  // servidor hecha en `seq`), partido por partido, salvo lo que la sesión
  // actual tiene suyo o más nuevo. Devuelve los partidos que cambiaron.
  function lgMergeServer(into, from, seq){
    const changed = [];
    if(!into || !from) return changed;
    meta.rounds.filter(isLg).forEach(round => {
      const src = from[round.id] || {};
      (round.matches || []).forEach(m => {
        if(lgSt(round.id, m.id) || lgDraft(round.id, m.id)) return;
        if((lgLocalSeq[round.id + "|" + m.id] || 0) > seq) return;
        const has = Object.prototype.hasOwnProperty.call(src, m.id);
        const score = src.__score && src.__score[m.id];
        const cur = into[round.id] || {};
        const curScore = cur.__score && cur.__score[m.id];
        const same = (has ? cur[m.id] === src[m.id] : !Object.prototype.hasOwnProperty.call(cur, m.id))
          && (score ? !!curScore && curScore.a === score.a && curScore.b === score.b : !curScore);
        if(same) return;
        const rp = into[round.id] = into[round.id] || {};
        if(has) rp[m.id] = src[m.id]; else delete rp[m.id];
        if(score){ rp.__score = rp.__score || {}; rp.__score[m.id] = { a: score.a, b: score.b }; }
        else if(rp.__score) delete rp.__score[m.id];
        changed.push({ round, matchId: m.id });
      });
    });
    return changed;
  }
  // Pinta sólo los partidos que cambiaron, sin redibujar la jornada: no se
  // mueve el scroll ni se pierde el foco (H3 de b14c58c). También el campo
  // enfocado se actualiza (J1 de 9639ad1): un partido sólo llega aquí si no
  // tiene borrador, así que lo que muestra ese campo es el valor anterior y
  // no hay nada escrito que perder. El valor nuevo queda seleccionado.
  function lgPaintChanged(changed){
    changed.forEach(({ round, matchId }) => {
      const v = lgAccepted(round, matchId);
      ["a", "b"].forEach(side => {
        const input = document.getElementById("qz-lg-" + side + "-" + round.id + "-" + matchId);
        if(!input) return;
        const next = v && typeof v === "object" ? String(v[side]) : "";
        if(input.value === next) return;
        const focused = input === document.activeElement;
        input.value = next;
        // El valor enfocado cambió bajo el cursor: queda seleccionado, así lo
        // que se teclee lo reemplaza y nunca se suma a un número que la persona
        // no escribió (K1 de 3bea6f9; K2 y K3 de fc67921: campo vacío o cursor
        // dentro del valor anterior).
        if(focused){ try{ input.select(); }catch(e){} }
      });
      lgPaintMatch(round, matchId);
    });
  }
  // Lectura de los pronósticos propios que distingue un error (null) de «no
  // hay nada guardado» ({}): una relectura fallida no borra nada (H1).
  async function lgGetOwnPicks(pid){
    try{
      const r = await kvGet(currentPicksKey(pid), { owner: currentUserPinCache });
      return r.found ? r.value : {};
    }catch(e){ return null; }
  }
  // Carga los pronósticos de `pid` al entrar. Si mientras tanto se completó
  // una relectura más nueva (por una respuesta tardía), manda esa.
  async function lgReadPicks(pid){
    const since = ++lgSeq;
    const fresh = await getPicks(pid);
    const last = lgRefreshed[SLUG + "|" + pid];
    if(last && last.seq > since) lgMergeServer(fresh, last.picks, last.seq);
    return fresh;
  }
  async function lgRefreshAfterLate(owner){
    const key = owner.slug + "|" + owner.pid;
    const seq = ++lgSeq;
    const gen = lgGen;
    const fresh = await lgGetOwnPicks(owner.pid);
    if(!fresh) return;
    if(lgRefreshed[key] && lgRefreshed[key].seq > seq) return;
    lgRefreshed[key] = { seq, picks: fresh };
    // Salió y volvió a entrar mientras tanto: esa entrada ya leyó después (H2).
    if(gen !== lgGen) return;
    if(!(currentUser && currentUser.id === owner.pid && SLUG === owner.slug)) return;
    const changed = lgMergeServer(myPicks, fresh, seq);
    if(changed.length) lgPaintChanged(changed);
  }
  function lgOwnerNow(){ return currentUser ? { gen: lgGen, slug: SLUG, pid: currentUser.id } : null; }
  function lgSameOwner(o){ return !!o && o.gen === lgGen && o.slug === SLUG && !!currentUser && currentUser.id === o.pid; }
  function lgResetSession(){
    lgGen += 1;
    lgQueue.clear();
    Object.keys(lgTimers).forEach(k => { clearTimeout(lgTimers[k].t); delete lgTimers[k]; });
    [lgDrafts, lgState, lgRejected, lgLocalSeq].forEach(o => Object.keys(o).forEach(k => { delete o[k]; }));
  }
  // Partidos de ESTA sesión que todavía no quedan guardados: en cola, en
  // camino, esperando los 700 ms, con error, conflicto o guardando, o con
  // algo escrito sin guardar. Se cuentan partidos, no envíos (F4).
  function lgUnsavedKeys(){
    const keys = new Set();
    lgQueue.forEach((job, k) => keys.add(k));
    lgInFlightJobs.forEach(j => { if(j.gen === lgGen) keys.add(j.key); });
    Object.keys(lgTimers).forEach(k => keys.add(k));
    Object.keys(lgState).forEach(rid => Object.keys(lgState[rid]).forEach(mid => {
      const st = lgState[rid][mid];
      if(st && (st.st === "error" || st.st === "conflict" || st.st === "saving")) keys.add(rid + "|" + mid);
    }));
    Object.keys(lgDrafts).forEach(rid => Object.keys(lgDrafts[rid]).forEach(mid => {
      const d = lgDrafts[rid][mid];
      const typed = (v) => String(v == null ? "" : v).trim() !== "";
      if(d && (typed(d.a) || typed(d.b) || d.pick != null)) keys.add(rid + "|" + mid);
    }));
    return keys;
  }
  // «Cambiar usuario» (Technical QA de 6e12f12, H2, y de f7d4098, F2–F5):
  // antes de cerrar la sesión, lo que esta persona dejó pendiente se envía con
  // SU identidad (todavía en memoria) y se espera hasta 6 s, enviando también
  // lo que escriba mientras tanto. Lo que no quedó guardado se dice y se
  // pregunta: nunca se pierde en silencio. Devuelve true si se puede cambiar.
  async function lgBeforeSwitch(){
    const WAIT = "Guardando tus pronósticos antes de cambiar de usuario…";
    if(lgSwitching){ toast(WAIT, 6500); return false; }   // un solo diálogo a la vez
    lgSwitching = true;
    try{
      const gen = lgGen;
      const flushTimers = () => Object.keys(lgTimers).forEach(k => { const t = lgTimers[k]; clearTimeout(t.t); delete lgTimers[k]; t.go(); });
      const busy = () => lgQueue.size || Object.keys(lgTimers).length || [...lgInFlightJobs].some(j => j.gen === gen);
      flushTimers();
      if(busy()) toast(WAIT, 6500);
      const until = Date.now() + 6000;
      while(busy() && Date.now() < until){
        await new Promise(r => setTimeout(r, 150));
        flushTimers();
      }
      const t = document.getElementById("qz-toast");
      if(t){ clearTimeout(t._h); t.classList.remove("show"); }
      const unsaved = lgUnsavedKeys().size;
      if(!unsaved) return true;
      const one = unsaved === 1;
      return await qzConfirm(`Tienes ${unsaved} pronóstico${one ? "" : "s"} de liguilla que todavía no ${one ? "queda" : "quedan"} guardado${one ? "" : "s"} (enviándose, sin conexión, a medias o en conflicto). Si cambias de usuario ahora, ${one ? "se pierde" : "se pierden"}.`,
        { title: "¿Cambiar de usuario?", confirmLabel: "Cambiar de todos modos", cancelLabel: "Quedarme y revisar", destructive: true });
    } finally { lgSwitching = false; }
  }
  function lgEnqueue(round, matchId, value, force){
    const owner = lgOwnerNow();
    if(!owner) return;
    lgQueue.set(round.id + "|" + matchId, { round, matchId, value, owner, ...(force !== undefined ? { force } : {}) });
    lgSetSt(round.id, matchId, { st: "saving" });
    lgPaintMatch(round, matchId);
    lgPump();
  }
  // Una cola por generación: un guardado de la sesión anterior que no responde
  // no detiene los de la nueva.
  async function lgPump(){
    const gen = lgGen;
    if(lgWorkingGen === gen) return;
    lgWorkingGen = gen;
    try{
      while(gen === lgGen && lgQueue.size){
        const [key, job] = lgQueue.entries().next().value;
        lgQueue.delete(key);
        if(!lgSameOwner(job.owner)) continue;
        await lgSend(job);
      }
    } finally { if(lgWorkingGen === gen) lgWorkingGen = null; }
  }
  async function lgPost(owner, round, matchId, value, expected){
    // El PIN en memoria es del dueño: lgSameOwner() se comprobó justo antes.
    const headers = setAuthHeaders({ "Content-Type": "application/json" }, currentUserPinCache, owner.pid);
    try{
      const res = await fetch("/api/quinielas/" + encodeURIComponent(owner.slug) + "/picks/" + encodeURIComponent(owner.pid) + "/match", {
        method: "POST", headers, credentials: "same-origin",
        body: JSON.stringify({ roundId: round.id, matchId, value, expected }),
      });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, ...data };
    }catch(e){ return { status: 0, error: "network_error" }; }
  }
  async function lgSend({ round, matchId, value, force, owner }){
    if(!lgSameOwner(owner)) return;
    const expected = force !== undefined ? force : lgAccepted(round, matchId);
    const flight = { gen: owner.gen, key: round.id + "|" + matchId };
    lgInFlightJobs.add(flight);
    let r;
    try{ r = await lgPost(owner, round, matchId, value, expected); } finally { lgInFlightJobs.delete(flight); }
    if(!lgSameOwner(owner)){
      // Cambió la sesión mientras tanto: la respuesta no se aplica a nadie más
      // y su valor no manda (G1). Si quien está ahora es la MISMA persona, se
      // relee del servidor (H3); su cola y sus borradores anteriores no reviven.
      if(r.status === 200 && r.ok && currentUser && currentUser.id === owner.pid && SLUG === owner.slug) lgRefreshAfterLate(owner);
      return;
    }
    if(r.status !== 0) lgLocalSeq[round.id + "|" + matchId] = ++lgSeq;
    if(r.status === 200 && r.ok){
      lgSetAccepted(round, matchId, r.value);
      lgSetSt(round.id, matchId, { st: "saved", at: r.acceptedAt });
      const d = lgDraft(round.id, matchId);
      if(d && lgDraftEquals(d, r.value)) lgSetDraft(round.id, matchId, null);
      if(lgRejected[round.id]) delete lgRejected[round.id][matchId];
    } else if(r.status === 409 && r.error === "pick_conflict"){
      lgSetSt(round.id, matchId, { st: "conflict", current: r.current, mine: value });
    } else if(r.error === "round_locked"){
      if(r.current !== undefined) lgSetAccepted(round, matchId, r.current);
      (lgRejected[round.id] = lgRejected[round.id] || {})[matchId] = { value, at: new Date(serverNow()).toISOString() };
      lgSetSt(round.id, matchId, { st: "locked" });
      lgPaintMatch(round, matchId);
      toast("Se cerró la jornada. Tu último cambio no se aceptó; quedó lo que estaba guardado.", 5000);
      // El servidor ya la cerró: la pantalla la muestra cerrada (sólo en esta
      // pestaña; un participante nunca guarda la meta) y lleva a «En vivo».
      if(!isRoundLocked(round)) round.deadline = new Date(serverNow() - 1000).toISOString();
      jornadaFilter = "envivo";
      const main = document.getElementById("qz-main");
      if(main && activeTab === "jornada") renderJornada(main);
      return;
    } else {
      const msg = r.status === 0 ? "No se guardó: sin conexión." : (r.status >= 500 ? "No se guardó: el servidor no respondió." : humanizeError(r.error, r));
      lgSetSt(round.id, matchId, { st: "error", error: msg, value });
    }
    lgPaintMatch(round, matchId);
    lgPaintBanner(round);
  }
  function lgDraftEquals(d, v){
    if(v == null) return false;
    if(typeof v === "object") return lgParseGoal(d.a) === v.a && lgParseGoal(d.b) === v.b;
    return d.pick === v;
  }
  function lgRetryAll(round){
    Object.entries(lgState[round.id] || {}).forEach(([mid, st]) => {
      if(st && st.st === "error" && st.value != null) lgEnqueue(round, mid, st.value);
    });
  }
  function lgPaintBanner(round){
    const el = document.getElementById("qz-lg-banner-" + round.id);
    if(!el) return;
    const failed = Object.values(lgState[round.id] || {}).filter(s => s && s.st === "error").length;
    el.hidden = !failed;
    el.innerHTML = failed ? `<span>${failed} pronóstico${failed===1?"":"s"} sin guardar.</span> <button type="button" class="btn btn-ghost btn-sm" data-lg-retry-all="${esc(round.id)}">Reintentar todo</button>` : "";
    const btn = el.querySelector("[data-lg-retry-all]");
    if(btn) btn.addEventListener("click", () => lgRetryAll(round));
  }
  // El estado visible de UN partido, siempre desde lgState + lo aceptado.
  function lgStateHtml(round, m){
    const rules = lgRulesOf(round);
    const accepted = lgAccepted(round, m.id);
    const st = lgSt(round.id, m.id);
    const d = lgDraft(round.id, m.id);
    const acceptedTxt = lgPickText(round, m, accepted);
    if(st && st.st === "conflict"){
      return `<span class="lg-warn">Desde otra sesión quedó <strong>${esc(lgPickText(round, m, st.current) || "sin pronóstico")}</strong>.</span>
        <button type="button" class="btn btn-ghost btn-sm" data-lg-use-mine="${esc(m.id)}">Usar el mío (${esc(lgPickText(round, m, st.mine))})</button>
        <button type="button" class="btn btn-ghost btn-sm" data-lg-keep-theirs="${esc(m.id)}">Quedarme con ${esc(lgPickText(round, m, st.current) || "ése")}</button>`;
    }
    if(st && st.st === "saving") return `<span class="muted">Guardando…</span>`;
    if(st && st.st === "error") return `<span class="lg-bad">${esc(st.error)}</span> <button type="button" class="btn btn-ghost btn-sm" data-lg-retry="${esc(m.id)}">Reintentar</button>`;
    if(rules.capture === "score" && d){
      const a = lgParseGoal(d.a), b = lgParseGoal(d.b);
      if(Number.isNaN(a) || Number.isNaN(b)) return `<span class="lg-bad">Escribe un número entero de 0 a 30.</span>`;
      if(a === null || b === null){
        if(a === null && b === null && !accepted) return `<span class="muted">Sin pronóstico</span>`;
        return accepted
          ? `<span class="lg-warn">Cambio incompleto. Sigue guardado: <strong>${esc(acceptedTxt)}</strong>.</span>`
          : `<span class="lg-warn">Falta un número. Los demás partidos se guardan igual.</span>`;
      }
    }
    if(accepted){
      const outcome = rules.capture === "score" ? lgOutcomeText(m, LG.outcomeOfScore(accepted)) : "";
      return `${outcome ? `<span>${esc(outcome)}</span>` : ``}<span class="lg-ok">✓ Guardado${st && st.at ? " " + esc(lgTime(st.at)) : ""}</span>`;
    }
    return `<span class="muted">Sin pronóstico</span>`;
  }
  function lgPaintMatch(round, matchId){
    const el = document.getElementById("qz-lg-st-" + round.id + "-" + matchId);
    const m = round.matches.find(x => x.id === matchId);
    if(!el || !m) return;
    el.innerHTML = lgStateHtml(round, m);
    lgWireStateButtons(el, round, m);
    const rules = lgRulesOf(round);
    if(rules.capture === "result"){
      const accepted = lgAccepted(round, m.id);
      const pending = lgDraft(round.id, m.id);
      const shown = pending ? pending.pick : accepted;
      document.querySelectorAll('[data-lg-row="' + CSS.escape(round.id + "|" + m.id) + '"] .pick-btn').forEach(b => {
        b.classList.toggle("selected", b.dataset.val === shown);

  }
  function lgWireStateButtons(el, round, m){
    const retry = el.querySelector("[data-lg-retry]");
    if(retry) retry.addEventListener("click", () => { const st = lgSt(round.id, m.id); if(st && st.value != null) lgEnqueue(round, m.id, st.value); });
    const mine = el.querySelector("[data-lg-use-mine]");
    if(mine) mine.addEventListener("click", () => {
      const st = lgSt(round.id, m.id);
      lgEnqueue(round, m.id, st.mine, st.current == null ? null : st.current);
    });
    const theirs = el.querySelector("[data-lg-keep-theirs]");
    if(theirs) theirs.addEventListener("click", () => {
      const st = lgSt(round.id, m.id);
      lgSetAccepted(round, m.id, st.current == null ? null : st.current);
      lgSetDraft(round.id, m.id, null);
      lgSetSt(round.id, m.id, { st: "saved" });

  }
  const lgTimers = {};
  function lgOnScoreInput(round, m, side, input, immediate){
    if(immediate && /^0\d$/.test(input.value.trim())) input.value = String(Number(input.value.trim()));
    if(isRoundLocked(round)){ renderJornada(document.getElementById("qz-main")); return; }
    const accepted = lgAccepted(round, m.id);
    const d = Object.assign({ a: accepted ? String(accepted.a) : "", b: accepted ? String(accepted.b) : "" }, lgDraft(round.id, m.id) || {});
    d[side] = input.value;
    const a = lgParseGoal(d.a), b = lgParseGoal(d.b);
    input.setAttribute("aria-invalid", Number.isNaN(side === "a" ? a : b) ? "true" : "false");
    if(accepted && a === accepted.a && b === accepted.b){ lgSetDraft(round.id, m.id, null); }
    else lgSetDraft(round.id, m.id, d);
    const prev = lgSt(round.id, m.id);
    if(prev && (prev.st === "error" || prev.st === "saved")) lgSetSt(round.id, m.id, null);
    lgPaintMatch(round, m.id);
    const key = round.id + "|" + m.id;
    if(lgTimers[key]){ clearTimeout(lgTimers[key].t); delete lgTimers[key]; }
    if(a === null || b === null || Number.isNaN(a) || Number.isNaN(b)) return;
    if(accepted && a === accepted.a && b === accepted.b) return;
    const owner = lgOwnerNow();
    const go = () => { if(!lgSameOwner(owner)) return; const dd = lgDraft(round.id, m.id); if(!dd) return; const aa = lgParseGoal(dd.a), bb = lgParseGoal(dd.b); if(LG.isGoals(aa) && LG.isGoals(bb)) lgEnqueue(round, m.id, { a: aa, b: bb }); };
    if(immediate) go(); else lgTimers[key] = { t: setTimeout(() => { delete lgTimers[key]; go(); }, 700), go };
  }

  function lgWireVoting(container, round){

  // ---- participante: resultados (Jugados) ------------------------------------
  function lgResultText(round, m){

  function lgMatchBreakdownHtml(round, m, out, pickValue){

  // ---- Historial: detalle de una jornada de liguilla -------------------------
  // Historial de liguilla: cada celda separa el pronóstico, los puntos y por
  // qué; el nombre y el total quedan fijos a la izquierda (revisión de e8fde8d:

  function lgRulesSentence(rules){
    if(!rules) return "";
    return rules.exactBonus
      ? `Atinarle al ganador o al empate: ${lgPts(rules.resultPoints)}. Marcador exacto: +${rules.exactBonus} extra (en total ${lgPts(rules.resultPoints + rules.exactBonus)}).`
      : `Atinarle al ganador o al empate: ${lgPts(rules.resultPoints)}. Sin puntos extra por marcador exacto.`;
  }
  function lgHitSummary(res){
    const hits = res.resultHits;
    let txt = !res.scored ? "Aún sin partidos calificados"
      : hits ? `${hits} partido${hits === 1 ? "" : "s"} acertado${hits === 1 ? "" : "s"}` : "Ningún partido acertado";
    if(res.exactHits) txt += ` (${res.exactHits} exacto${res.exactHits === 1 ? "" : "s"})`;

    if(waiting) txt += ` · ${waiting} sin calificar`;

  // Una celda: «Pronóstico: 2–1» / «2 pts · Marcador exacto» / desglose.
  function lgHistCellHtml(round, m, out, pickValue){
    const rules = lgRulesOf(round);
    const pick = pickValue == null ? null : lgPickText(round, m, pickValue);
    const pickLine = pick ? `<div class="lg-h-pick">Pronóstico: <strong>${esc(pick)}</strong></div>` : `<div class="lg-h-pick muted">Sin pronóstico</div>`;
    if(out.state === "pending") return `${pickLine}<div class="lg-h-state">Pendiente · aún no se califica</div>`;
    if(out.state === "postponed") return `${pickLine}<div class="lg-h-state">Aplazado · se califica cuando se juegue</div>`;
    if(out.state === "void") return `${pickLine}<div class="lg-h-state">Anulado · no cuenta para nadie</div>`;
    if(!pick) return `${pickLine}<div class="lg-h-pts">0 pts</div>`;
    let kind;
    if(out.exactHit) kind = "Marcador exacto";
    else if(out.resultHit) kind = round.results[m.id] === "D" ? "Empate acertado" : "Resultado acertado";
    else kind = "No acertó";
    const pts = `<div class="lg-h-pts ${out.total ? "ok" : "no"}"><strong>${esc(lgPts(out.total))}</strong> · ${esc(kind)}</div>`;
    const why = out.exactHit && rules && rules.exactBonus
      ? `<div class="lg-h-why">${esc(out.base)} por resultado + ${esc(out.bonus)} extra por exacto = ${esc(lgPts(out.total))}</div>` : ``;
    return pickLine + pts + why;
  }
  function renderLiguillaHistDetail(detail, round){

              <tr class="lg-h-real"><th scope="row" class="qz-sticky-col lg-h-name"><strong>Resultado real</strong></th>${round.matches.map(m => `<td class="lg-h-cell"><strong>${esc(lgResultText(round, m))}</strong></td>`).join("")}</tr>

  // ---- admin: reglas de liguilla ---------------------------------------------
  function lgFormFromSettings(){
    const r = lgConfigRules();
    if(!r) return { resultPts: "1", bonusOn: false, bonusPts: "1" };
    return { resultPts: String(r.resultPoints), bonusOn: r.exactBonus > 0, bonusPts: String(r.exactBonus || 1) };
  }
  // De lo que hay en el formulario a una regla (o un error escrito).
  function lgRulesFromForm(f){
    const num = (v) => /^\d{1,2}$/.test(String(v).trim()) ? Number(String(v).trim()) : NaN;
    const rp = num(f.resultPts);
    if(Number.isNaN(rp) || rp < 1) return { error: "Escribe cuántos puntos da atinarle al ganador o al empate: un número entero de 1 a 99." };
    const bp = f.bonusOn ? num(f.bonusPts) : 0;
    if(f.bonusOn && (Number.isNaN(bp) || bp < 1)) return { error: "Escribe los puntos extra por marcador exacto: un número entero de 1 a 99." };
    const v = LG.validateRules({ resultPoints: rp, exactBonus: bp });
    if(!v.ok) return { error: "Escribe un número entero de 1 a 99." };
    return { rules: v.rules };
  }
  function lgExampleHtml(rules){
    if(!rules) return `<p class="muted qz-tight">Escribe los puntos para ver el ejemplo.</p>`;
    const s = (a, b) => ({ a, b });
    const rows = rules.capture === "score"
      ? [[s(2,1), s(3,1)], [s(2,1), s(2,1)], [s(1,1), s(2,2)], [s(1,1), s(1,1)], [s(2,1), s(0,1)]]
      : [[s(2,1), "A"], [s(1,1), "D"], [s(2,1), "B"]];
    const body = rows.map(([real, pick]) => {
      const pickScore = typeof pick === "object" ? pick : null;
      const out = LG.scoreMatch({ rules, pickScore, pick: pickScore ? LG.outcomeOfScore(pickScore) : pick, result: LG.outcomeOfScore(real), resultScore: real, published: true });
      const pickTxt = pickScore ? lgScoreText(pickScore) : (pick === "A" ? "Gana local" : pick === "B" ? "Gana visitante" : "Empate");
      const pts = rules.exactBonus ? out.base + " + " + out.bonus + " = " : "";
      return `<tr><td>${esc(lgScoreText(real))}</td><td>${esc(pickTxt)}</td><td>${esc(pts)}<strong>${esc(out.total)}</strong></td></tr>`;
    }).join("");
    const head = `<tr><th>Termina</th><th>Pronóstico</th><th>${rules.exactBonus ? "Ganador + exacto" : "Pts"}</th></tr>`;
    return `<div class="lg-table-wrap"><table class="lg-example"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  // Lleva la vista a la tarjeta de liguilla, por debajo del encabezado fijo.

  // ---- admin: publicar una jornada de liguilla -------------------------------
  // Un solo flujo: sin reglas, se configuran primero; con reglas y sin
  // candado, se confirma que quedan fijas. El servidor revisa lo mismo.
  async function lgPublishGate(round){
    if(!isLg(round)) return true;
    const pending = round.matches.filter(m => !m.teamA || !m.teamB).length;
    if(pending){ toast(`Falta confirmar ${pending} rival${pending===1?"":"es"} para publicar.`, 5000); return false; }
    const rules = lgConfigRules();
    if(!rules){
      const go = await qzConfirm(`Es la primera jornada de liguilla. Elige cómo se juega: las reglas valen para cuartos, semifinal y final, y quedan fijas al publicar.`,
        { title: "Antes de publicar, configura la liguilla", confirmLabel: "Configurar liguilla", cancelLabel: "Ahora no", destructive: false });
      if(go){
        renderAdminReglas._lgReturn = { roundId: round.id, title: roundTitle(round) };
        adminSubTab = "reglas";
        await renderAdmin(document.getElementById("qz-main"));
        lgScrollToCard();
      }
      return false;
    }
    if(meta.liguillaLock) return true;
    return qzConfirm(`Reglas: ${lgRulesSummary(rules)}.\n• Al publicar, las reglas de liguilla quedan fijas para todo el torneo.\n• No cambian aunque después borres esta jornada.`,
      { title: `¿Publicar ${roundTitle(round)}?`, confirmLabel: "Publicar", cancelLabel: "Cancelar", destructive: false });
  }
  async function lgAfterPublish(){
    try{
      const fresh = await getMeta({ owner: adminOrOwnerCred() });
      if(fresh) adoptFreshMeta(meta, fresh);
    }catch(e){ console.error("refresh tras publicar liguilla falló", e); }
    renderAdminReglas._lgReturn = null;
  }

  // ---- admin: organizar ida y vuelta (D4) ------------------------------------
  function lgDrafts_rounds(){ return meta.rounds.filter(r => isLg(r) && r.published === false); }
  function lgEarliest(round){
    const t = round.matches.map(m => Date.parse(m.kickoffAt)).filter(Number.isFinite);
    return t.length ? new Date(Math.min(...t)).toISOString() : null;
  }
  function lgOrganizerHtml(plan){
    const target = (mid) => plan.assign[mid];
    const groups = [...plan.rounds, { key: "__new", title: "Jornada nueva (borrador)" }].map(r => {
      const ms = plan.matches.filter(m => target(m.id) === r.key);
      if(r.key === "__new" && !ms.length) return "";
      const ko = ms.map(m => Date.parse(m.kickoffAt)).filter(Number.isFinite);
      const close = ko.length ? fmtWhenTz(new Date(Math.min(...ko)).toISOString()) : null;
      return `<div class="card lg-org-group">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;"><strong>${esc(r.title)}</strong><span class="muted">${esc(ms.length + (ms.length === 1 ? " partido" : " partidos"))}</span></div>
        <div class="muted">${close ? `Cierra ${esc(close)} (primer partido)` : (ms.length ? "Sin fecha de partido: revisa el cierre al guardar" : "Quedaría vacía")}</div>
        ${ms.map(m => `<div class="lg-org-row"><span>${esc(m.teamA || "Por definir")} vs ${esc(m.teamB || "Por definir")}<br><span class="muted">${m.kickoffAt ? esc(fmtWhenTz(m.kickoffAt)) : "sin fecha"}</span></span>
          <label class="sr-only" for="qz-org-${esc(m.id)}">Mover partido</label><select id="qz-org-${esc(m.id)}" data-org-match="${esc(m.id)}">${plan.rounds.map(r => `<option value="${esc(r.key)}" ${target(m.id) === r.key ? "selected" : ""}>${esc(r.title)}</option>`).join("")}<option value="__new" ${target(m.id) === "__new" ? "selected" : ""}>Jornada nueva (borrador)</option></select></div>`).join("")}
      </div>`;
    }).join("");
    return `<div class="card" id="qz-lg-organizer">
      <div class="eyebrow">Organizar partidos de liguilla</div>
      <p class="muted">Sólo borradores: nada publicado ni con pronósticos se mueve. Revisa qué partidos quedan en cada jornada y su cierre antes de confirmar.</p>
      ${groups}
      <p class="qz-field-error" id="qz-org-err" role="alert" hidden></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" id="qz-org-confirm">Confirmar organización</button><button class="btn btn-ghost" id="qz-org-cancel">Cancelar</button></div>
    </div>`;
  }
  function lgOrganizerPlan(){
    if(renderAdminRondas._org) return renderAdminRondas._org;
    const rounds = lgDrafts_rounds().sort((a,b) => a.number - b.number);
    const plan = { rounds: rounds.map(r => ({ key: r.id, title: roundTitle(r) + " (J" + r.number + ")" })), matches: [], assign: {} };
    rounds.forEach(r => r.matches.forEach(m => { plan.matches.push({ ...m, from: r.id }); plan.assign[m.id] = r.id; }));
    renderAdminRondas._org = plan;
    return plan;
  }
  function wireOrganizer(body){
    const plan = renderAdminRondas._org;
    body.querySelectorAll("[data-org-match]").forEach(sel => sel.addEventListener("change", () => {
      plan.assign[sel.dataset.orgMatch] = sel.value;
      renderAdminRondas(body).then(() => document.getElementById("qz-org-" + sel.dataset.orgMatch)?.focus());
    }));
    document.getElementById("qz-org-cancel").addEventListener("click", () => { renderAdminRondas._org = null; renderAdminRondas(body); });
    document.getElementById("qz-org-confirm").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      // Se arma sobre una COPIA del tablero: si algo no cuadra, el tablero de
      // la pestaña no se toca.
      const work = JSON.parse(JSON.stringify(meta.rounds));
      const byId = new Map(work.map(r => [r.id, r]));
      // Ninguno de los borradores puede haberse publicado mientras tanto.
      if(plan.rounds.some(r => !byId.get(r.key) || byId.get(r.key).published !== false)){
        renderAdminRondas._org = null; toast("Una de las jornadas ya no es borrador. Vuelve a abrir Organizar."); renderAdminRondas(body); return;
      }
      let fresh = null;
      if(Object.values(plan.assign).includes("__new")){
        const src = byId.get(plan.matches.find(m => plan.assign[m.id] === "__new").from);
        fresh = { id: uid("r"), number: Math.max(...work.map(r => r.number)) + 1, matches: [], deadline: src.deadline,
          results: {}, resultsPublished: false, published: false, stage: "liguilla",
          ...(src.provider ? { provider: src.provider } : {}), ...(src.syncGroupKey ? { syncGroupKey: src.syncGroupKey } : {}),
          ...(src.externalRoundId != null ? { externalRoundId: src.externalRoundId } : {}),
          ...(src.phase && src.phase.round ? { phase: { round: src.phase.round, leg: null, source: "admin" } } : {}) };
        work.push(fresh);
        byId.set(fresh.id, fresh);
      }
      const matchById = new Map(plan.matches.map(m => [m.id, m]));
      plan.rounds.forEach(r => { byId.get(r.key).matches = []; });
      plan.matches.forEach(m => {
        const dest = plan.assign[m.id] === "__new" ? fresh : byId.get(plan.assign[m.id]);
        const { from, ...clean } = matchById.get(m.id);
        dest.matches.push(clean);
      });
      // El cierre de cada borrador: su primer partido, si tiene fecha.
      [...plan.rounds.map(r => byId.get(r.key)), ...(fresh ? [fresh] : [])].forEach(r => { const first = lgEarliest(r); if(first) r.deadline = first; });
      if(work.some(r => isLg(r) && r.published === false && !r.matches.length)){
        setupFieldError("qz-org-err", "Una jornada quedaría sin partidos. Mueve al menos uno o deja los partidos donde estaban.");
        return;
      }
      btn.disabled = true;
      const snapshot = meta.rounds;
      meta.rounds = work;
      const result = await setMetaWithError(meta);
      if(result.ok){
        renderAdminRondas._org = null;
        toast("✅ Listo, los partidos quedaron organizados. Revisa el cierre de cada jornada antes de publicar.", 5000);
        renderAdmin(document.getElementById("qz-main"));
      } else {
        if(!result.reconciled) meta.rounds = snapshot;
        btn.disabled = false;
        setupFieldError("qz-org-err", humanizeError(result.error, result));
      }
    });
  }

  // ---- admin: pendientes de colocar (D4) -------------------------------------
  function lgStagedHtml(){
    const staged = Array.isArray(meta.stagedFixtures) ? meta.stagedFixtures : [];
    if(!staged.length) return "";
    const drafts = meta.rounds.filter(r => r.published === false && !r.resultsPublished);
    const suggest = (f) => {
      const t = Date.parse(f.kickoffAt);
      if(!Number.isFinite(t)) return null;
      let best = null, bestD = Infinity;
      drafts.forEach(r => r.matches.forEach(m => { const d = Math.abs(Date.parse(m.kickoffAt) - t); if(Number.isFinite(d) && d < bestD){ bestD = d; best = r; } }));
      return best;
    };
    return `<div class="card" id="qz-lg-staged">
      <div class="eyebrow">Pendientes de colocar (${esc(staged.length)})</div>
      <p class="muted">Partidos que llegaron del calendario y no tienen una sola jornada posible. No los ubicamos solos: elige tú. Sólo se pueden colocar en borradores.</p>
      ${staged.map((f, i) => {
        const key = (f.provider || "") + "|" + (f.providerFixtureId || "");
        const s = suggest(f);
        return `<div class="lg-org-row"><span>${esc((f.home && f.home.name) || "Por definir")} vs ${esc((f.away && f.away.name) || "Por definir")}<br><span class="muted">${f.kickoffAt ? esc(fmtWhenTz(f.kickoffAt)) : "sin fecha del proveedor"}${s ? ` · parece de ${esc(roundTitle(s))}` : ``}</span></span>
          ${drafts.length ? `<span class="lg-org-place"><label class="sr-only" for="qz-stg-${i}">Jornada</label><select id="qz-stg-${i}">${drafts.map(r => `<option value="${esc(r.id)}" ${s && s.id === r.id ? "selected" : ""}>${esc(roundTitle(r))} (J${esc(r.number)})${s && s.id === r.id ? " · sugerida" : ""}</option>`).join("")}</select>
          <button class="btn btn-ghost btn-sm" data-stg-place="${esc(key)}" data-stg-sel="qz-stg-${i}">Colocar</button></span>` : `<span class="muted">Crea un borrador para colocarlo.</span>`}</div>`;
      }).join("")}
    </div>`;
  }
  function wireStaged(body){
    body.querySelectorAll("[data-stg-place]").forEach(btn => btn.addEventListener("click", async () => {
      const sel = document.getElementById(btn.dataset.stgSel);
      btn.disabled = true;

        const res = await fetch(`/api/quinielas/${encodeURIComponent(SLUG)}/staged/place`, {

        });

      }catch(e){ toast(humanizeError("network_error")); btn.disabled = false; }

  // ---- admin: resultados de liguilla (D2) ------------------------------------
  // Cada partido: con resultado (dos goles o 1X2, según la captura),
  // pendiente, aplazado o anulado. El 1X2 sale del marcador.
  function renderLiguillaResultados(body, form, round, extrasHtml, wireExtras){
    const rules = lgRulesOf(round);
    const isPublished = !!round.resultsPublished;
    const stillOpen = !isPublished && isRoundLocked(round) === false;
    const st = renderLiguillaResultados._st && renderLiguillaResultados._st.roundId === round.id ? renderLiguillaResultados._st : null;
    const editing = !isPublished || !!(st && st.correcting);
    // Lo editable vive en el borrador de la jornada (draft*), como en la fase regular.
    if(editing && !round.draftMatchStatus && !round.draftScores && !round.draftResults){
      round.draftResults = { ...(round.results || {}) };
      round.draftScores = JSON.parse(JSON.stringify(round.scores || {}));
      round.draftMatchStatus = { ...(round.matchStatus || {}) };
    }
    const dRes = editing ? (round.draftResults || (round.draftResults = {})) : (round.results || {});
    const dSco = editing ? (round.draftScores || (round.draftScores = {})) : (round.scores || {});
    const dSt = editing ? (round.draftMatchStatus || (round.draftMatchStatus = {})) : (round.matchStatus || {});
    const statusOf = (mid) => dSt[mid] || (dRes[mid] ? "result" : null);
    const resolved = round.matches.filter(m => {
      const s = statusOf(m.id);
      if(s === "void") return true;
      if(s !== "result") return false;
      return rules.capture === "score" ? LG.isScore(dSco[m.id]) : ["A","D","B"].includes(dRes[m.id]);
    }).length;

    const waiting = round.matches.filter(m => ["pending","postponed"].includes(statusOf(m.id))).length;

    form.innerHTML = `
      <div class="card">
        <p style="margin:0 0 12px;">${isPublished ? `<span class="badge paid" style="font-size:13px;padding:5px 10px;">🟢 Resultados publicados${waiting ? " (parciales)" : ""}</span>` : `<span class="badge" style="font-size:13px;padding:5px 10px;">⚪ Sin publicar</span>`}
          ${isPublished && editing ? `<span class="badge unpaid" style="margin-left:6px;">✏️ Corrigiendo — lo publicado no cambia hasta que confirmes</span>` : ``}</p>
        <div class="eyebrow" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <span>${esc(roundTitle(round))}${roundSubtitle(round) ? " · " + esc(roundSubtitle(round)) : ""}</span>
          ${editing ? `<button class="btn btn-ghost btn-sm" id="qz-autofill">🔎 Buscar resultados automáticos</button>` : ``}
        </div>
        <p class="muted" style="margin-top:4px;">${rules.capture === "score" ? "Marcador final con prórroga, sin la tanda de penales." : "Resultado del marcador final con prórroga, sin la tanda de penales."}</p>
        <p class="muted" id="qz-autofill-status"></p>
        ${round.matches.map(m => {
          const s = statusOf(m.id);
          const sc = dSco[m.id] || null;
          return `<div class="match-card lg-match" id="qz-rescard-${esc(m.id)}">
            <div class="pick-row lg-status-row" role="group" aria-label="Estado de ${esc(m.teamA)} vs ${esc(m.teamB)}">${seg(m, "result", "Con resultado")}${seg(m, "pending", "Pendiente")}${seg(m, "postponed", "Aplazado")}${seg(m, "void", "Anulado")}</div>
            ${s === "result" ? (rules.capture === "score" ? `
              <div class="lg-line"><label class="lg-team" for="qz-lgr-a-${esc(m.id)}">${esc(m.teamA)}</label><input class="lg-goal" id="qz-lgr-a-${esc(m.id)}" data-lgr="${esc(m.id)}" data-side="a" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Goles de ${esc(m.teamA)}" aria-describedby="qz-lgr-out-${esc(m.id)}" value="${sc ? esc(sc.a) : ""}" ${editing ? "" : "disabled"} autocomplete="off"></div>

              <div class="muted" id="qz-lgr-out-${esc(m.id)}" aria-live="polite">${sc && LG.isScore(sc) ? esc(lgOutcomeText(m, LG.outcomeOfScore(sc))) : "Escribe los dos goles."}</div>`
              : `<div class="pick-row" data-lgr-pick="${esc(m.id)}">
                  <button type="button" class="pick-btn ${dRes[m.id]==='A'?'selected':''}" data-val="A" ${editing ? "" : "disabled"}>${esc(m.teamA)}</button>
                  <button type="button" class="pick-btn ${dRes[m.id]==='D'?'selected':''}" data-val="D" ${editing ? "" : "disabled"}>Empate</button>
                  <button type="button" class="pick-btn ${dRes[m.id]==='B'?'selected':''}" data-val="B" ${editing ? "" : "disabled"}>${esc(m.teamB)}</button>

                 <div class="muted">${s === "pending" ? "Todavía no hay marcador (por jugarse o sin capturar). Sus pronósticos se conservan." : s === "postponed" ? "Sus pronósticos se conservan y siguen cerrados. Se califica cuando publiques su resultado." : s === "void" ? "Nadie gana ni pierde puntos. No cuenta como acierto ni como fallo." : "Elige «Con resultado» y captura el marcador, o marca su estado."}</div>`}

    const repaint = () => renderLiguillaResultados(body, form, round, extrasHtml, wireExtras);

          .then(ok => { if(ok){ dSt[mid] = "void"; delete dRes[mid]; delete dSco[mid]; repaint(); } });

      }

    form.querySelectorAll("[data-lgr]").forEach(inp => inp.addEventListener("input", () => {
      const mid = inp.dataset.lgr;

      else { delete dSco[mid]; delete dRes[mid]; if(out) out.textContent = (Number.isNaN(a) || Number.isNaN(b)) ? "Escribe un número entero de 0 a 30." : "Escribe los dos goles."; }
      const pub = document.getElementById("qz-publish-results");
      if(pub){
        const ok = !stillOpen && round.matches.every(x => { const s = statusOf(x.id); return s === "pending" || s === "postponed" || s === "void" || (s === "result" && (rules.capture === "score" ? LG.isScore(dSco[x.id]) : dRes[x.id])); })
          && round.matches.some(x => statusOf(x.id) === "void" || (statusOf(x.id) === "result" && (rules.capture === "score" ? LG.isScore(dSco[x.id]) : dRes[x.id])));
        pub.disabled = !ok;

    }));
    form.querySelectorAll("[data-lgr-pick]").forEach(row => row.querySelectorAll(".pick-btn").forEach(btn => btn.addEventListener("click", () => {
      dRes[row.dataset.lgrPick] = btn.dataset.val; repaint();
    })));
    const autofill = document.getElementById("qz-autofill");
    if(autofill) autofill.addEventListener("click", async () => {
      const statusEl = document.getElementById("qz-autofill-status");

      try{
        const data = await fetchSportsResults(round.id);
        if(!data.ok || data.reliabilityState){ statusEl.textContent = "⚠️ " + sportsDataFailureMessage(data.reliabilityState); return; }
        let found = 0;
        const byMatch = {}; (data.suggestions || []).forEach(s => { byMatch[s.matchId] = s; });
        const un = {}; (data.unscorable || []).forEach(u => { un[u.matchId] = u; });
        round.matches.forEach(m => {
          const tag = document.getElementById("qz-suggest-" + m.id);
          if(!tag) return;
          const hit = byMatch[m.id];
          if(hit && (rules.capture !== "score" || (hit.goals && LG.isScore(hit.goals)))){
            found++;
            const txt = rules.capture === "score" ? lgScoreText(hit.goals) : lgOutcomeText(m, hit.result);
            tag.innerHTML = `Sugerido: <strong>${esc(txt)}</strong> (terminó en los 90) <button type="button" class="btn btn-gold btn-sm" data-lg-accept="${esc(m.id)}">✓ Usar</button>`;
            tag.querySelector("[data-lg-accept]").addEventListener("click", () => {
              dSt[m.id] = "result";
              if(rules.capture === "score"){ dSco[m.id] = { ...hit.goals }; dRes[m.id] = LG.outcomeOfScore(hit.goals); } else dRes[m.id] = hit.result;
              repaint();
            });
          } else if(un[m.id]){
            tag.textContent = un[m.id].reason === "extra_time_or_penalties"
              ? "Hubo prórroga o penales y no podemos confirmar el marcador sin la tanda. Captúralo tú."
              : unscorableCopy(un[m.id].reason);
          } else tag.textContent = "Sin resultado automático todavía. Puedes capturarlo a mano.";
        });
        statusEl.textContent = found ? found + " de " + round.matches.length + " partidos con sugerencia. Revisa y confirma." : "Sin sugerencias por ahora. Captura los resultados a mano.";
      }catch(e){ statusEl.textContent = "⚠️ " + sportsDataFailureMessage(null); }
    });
    const saveDraft = document.getElementById("qz-save-draft");
    if(saveDraft) saveDraft.addEventListener("click", async () => {
      saveDraft.disabled = true;
      const result = await setMetaWithError(meta);
      toast(result.ok ? "✅ Listo, tu borrador quedó guardado." : humanizeError(result.error, result));
      saveDraft.disabled = false;
    });
    const pub = document.getElementById("qz-publish-results");
    if(pub) pub.addEventListener("click", async () => {
      const waitingNow = round.matches.filter(m => ["pending","postponed"].includes(statusOf(m.id)));
      const voided = round.matches.filter(m => statusOf(m.id) === "void");
      const lines = [`• Se califican los partidos con resultado${voided.length ? "; los anulados dan 0 a todos" : ""}.`];
      if(waitingNow.length) lines.push("• Quedan sin calificar: " + waitingNow.map(m => m.teamA + " vs " + m.teamB + " (" + (statusOf(m.id) === "postponed" ? "aplazado" : "pendiente") + ")").join(", ") + ".");
      lines.push("• La tabla se actualiza con estos puntos.");
      if(!(await qzConfirm(lines.join("\n"), { title: isPublished ? `¿Publicar la corrección de ${roundTitle(round)}?` : `¿Publicar resultados de ${roundTitle(round)}?`, confirmLabel: isPublished ? "Publicar corrección" : "Publicar", destructive: false }))) return;
      pub.disabled = true;
      const before = JSON.parse(JSON.stringify(round));
      const results = {}, scores = {}, status = {};
      round.matches.forEach(m => {
        const s = statusOf(m.id);
        if(s === "pending" || s === "postponed" || s === "void"){ status[m.id] = s; return; }
        results[m.id] = rules.capture === "score" ? LG.outcomeOfScore(dSco[m.id]) : dRes[m.id];
        if(rules.capture === "score") scores[m.id] = { ...dSco[m.id] };
      });
      round.results = results; round.matchStatus = status;
      if(rules.capture === "score") round.scores = scores; else delete round.scores;
      round.resultsPublished = true;
      delete round.draftResults; delete round.draftScores; delete round.draftMatchStatus;
      logAudit(before.resultsPublished ? "Corrigió resultados" : "Publicó resultados", roundTitle(round) + " (J" + round.number + ")");
      const result = await setMetaWithError(meta);
      if(result.ok){
        renderLiguillaResultados._st = null;
        allPicksCache = {};
        toast("✅ Listo, los resultados quedaron publicados y los puntos se actualizaron.");
        if(!before.resultsPublished) trackEvent("result_published", { source: "admin_resultados" });
      } else {
        if(!result.reconciled) meta.rounds = meta.rounds.map(r => r.id === round.id ? before : r);
        toast(humanizeError(result.error, result));
      }
      renderAdminResultados(body);
    });
    const startCorr = document.getElementById("qz-start-correction");
    if(startCorr) startCorr.addEventListener("click", () => {
      renderLiguillaResultados._st = { roundId: round.id, correcting: true };
      round.draftResults = { ...(round.results || {}) };
      round.draftScores = JSON.parse(JSON.stringify(round.scores || {}));
      round.draftMatchStatus = { ...(round.matchStatus || {}) };
      repaint();
    });
    const cancelCorr = document.getElementById("qz-cancel-correction");
    if(cancelCorr) cancelCorr.addEventListener("click", async () => {
      renderLiguillaResultados._st = null;
      delete round.draftResults; delete round.draftScores; delete round.draftMatchStatus;
      await setMeta(meta);
      renderAdminResultados(body);

    if(wireExtras) wireExtras();
  }

  // ---- admin: tipo y fase de la jornada en el editor -------------------------
  function lgEditorState(editingRound){
    const key = editingRound ? editingRound.id : "__new";
    const cur = renderAdminRondas._lgForm;
    if(cur && cur.key === key) return cur;
    const ph = editingRound && editingRound.phase;
    return (renderAdminRondas._lgForm = {
      key, stage: editingRound && editingRound.stage === "liguilla" ? "liguilla" : "regular",
      round: (ph && ph.round) || "", leg: (ph && ph.leg) || "", source: (ph && ph.source) || null,
      orig: ph ? JSON.stringify(ph) : null,
    });
  }
  function lgEditorHtml(editingRound){
    if(!LG) return "";
    const f = lgEditorState(editingRound);
    const fixed = !!(editingRound && editingRound.published !== false);
    const opt = (v, text, cur) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(text)}</option>`;
    const providerHint = editingRound && editingRound.phase && editingRound.phase.source === "provider" && f.stage !== "liguilla"
      ? `<p class="muted qz-tight">El calendario la marca como ${esc(LG.phaseLabel(editingRound.phase))}. Si es de liguilla, márcala aquí.</p>` : ``;
    return `
      <fieldset class="lg-fieldset" style="margin-bottom:12px;"><legend>Fase de la jornada</legend>
        ${fixed ? `<p class="muted qz-tight">${f.stage === "liguilla" ? "Liguilla" : "Fase regular"} · ya publicada: conserva su tipo y sus reglas.</p>` : `
        <div class="pick-row lg-seg">
          <label class="pick-btn ${f.stage !== "liguilla" ? "selected" : ""}"><input type="radio" name="qz-lg-stage" value="regular" class="sr-only" ${f.stage !== "liguilla" ? "checked" : ""}>Regular${f.stage !== "liguilla" ? " ✓" : ""}</label>
          <label class="pick-btn ${f.stage === "liguilla" ? "selected" : ""}"><input type="radio" name="qz-lg-stage" value="liguilla" class="sr-only" ${f.stage === "liguilla" ? "checked" : ""}>Liguilla${f.stage === "liguilla" ? " ✓" : ""}</label>
        </div>${providerHint}`}
        ${f.stage === "liguilla" ? `
        <div class="row2 qz-row-narrow">
          <div class="field"><label for="qz-lg-round">Ronda</label><select id="qz-lg-round">${opt("", "Sin indicar", f.round)}${opt("quarter", "Cuartos de final", f.round)}${opt("semi", "Semifinal", f.round)}${opt("final", "Final", f.round)}</select></div>
          <div class="field"><label for="qz-lg-leg">Ida o vuelta</label><select id="qz-lg-leg">${opt("", "Sin indicar", f.leg)}${opt("ida", "Ida", f.leg)}${opt("vuelta", "Vuelta", f.leg)}${opt("unico", "Partido único", f.leg)}</select></div>
        </div>
        <p class="muted qz-tight">${f.source === "provider" && JSON.stringify({ round: f.round || null, leg: f.leg || null, source: "provider" }) === f.orig ? "Dato del calendario." : "Lo indicas tú. Si el calendario se actualiza, esto no se modifica."}</p>` : ``}
      </fieldset>`;
