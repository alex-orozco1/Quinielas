  // compact display the Panel shows. UNKNOWN (lastOutcome === null) is a
  // real, distinct state — it means we've simply never recorded an
  // attempt, and is never collapsed into OK. WARNING vs ERROR is decided
  // ONLY from the last recorded reliabilityState, per the same grouping
  // used for the Admin-facing messages (sportsDataFailureMessage) --
  // TEMPORARY states show WARNING, states that likely need QRACKS's own
  // review show ERROR. competition_not_supported never reaches this
  // function at all (the server never records it), so it can never turn
  // this into a false global ERROR just because one quiniela's league
  // isn't supported.
  function relativeTimeEs(iso){
    if(!iso) return null;
    const diffMs = Date.now() - new Date(iso).getTime();
    if(!Number.isFinite(diffMs) || diffMs < 0) return null;
    const mins = Math.floor(diffMs / 60000);
    if(mins < 1) return "hace un momento";
    if(mins < 60) return `hace ${mins} min`;
    const hours = Math.floor(mins / 60);
    if(hours < 24) return `hace ${hours} h`;
    const days = Math.floor(hours / 24);
    return `hace ${days} día${days === 1 ? "" : "s"}`;
  }
  // Qué le falta a Payments, en palabras. Los códigos vienen del servidor y

  function paymentsProblemText(code){
    const [kind, v, why] = String(code).split(":");
    const vars = { STRIPE_SECRET_KEY: "la clave secreta de Stripe (STRIPE_SECRET_KEY)",
      STRIPE_WEBHOOK_SECRET: "el signing secret del webhook (STRIPE_WEBHOOK_SECRET)",
      PUBLIC_BASE_URL: "la URL pública (PUBLIC_BASE_URL)" };
    const nom = vars[v] || v || "";
    const razones = {
      contains_whitespace: "tiene espacios dentro", looks_like_publishable_key: "parece una clave publicable (pk_), no la secreta",
      looks_like_webhook_secret: "parece el signing secret del webhook", looks_like_api_key: "parece una clave de API, no el signing secret",
      same_as_secret_key: "es igual a la clave secreta", unparseable: "no es una URL válida",
      not_http_or_https: "no empieza por https://", has_credentials: "lleva usuario o contraseña",
      has_path: "lleva una ruta: debe ser sólo el origen, p. ej. https://qracks.net",
      has_query_or_fragment: "lleva ? o #", http_only_for_localhost: "debe ser https (http sólo en localhost)",
      live_key_needs_public_https: "con claves live debe ser https y pública",
    };
    if(kind === "missing") return "Falta " + nom + ".";
    if(kind === "blank") return nom.charAt(0).toUpperCase() + nom.slice(1) + " está en blanco.";
    if(kind === "malformed" || kind === "invalid") return nom.charAt(0).toUpperCase() + nom.slice(1) + ": " + (razones[why] || why) + ".";
    if(kind === "provider_rejected") return "Stripe rechazó " + nom + ".";
    if(kind === "provider_mode_mismatch") return "El modo (test/live) de " + nom + " no coincide con lo que dice Stripe.";
    return String(code);
  }

    const rows = idx.quinielas.map(q => {

      const count = q.participantCount != null ? q.participantCount : null;

    const byMonth = {};

    const totalParticipants = rows.reduce((sum, r) => sum + (r.count || 0), 0);

    // Sprint 14.4.1 — "Activación" (ya no se llama funnel: las etapas no
    // comparten una unidad de conteo consistente entre sí como para mostrar

    const ev = analytics.events || {};
    function evTotal(key, windowKey){ return (ev[key] && ev[key][windowKey]) ? ev[key][windowKey].total : 0; }
    function evParticipants(key, windowKey){ return (ev[key] && ev[key][windowKey]) ? ev[key][windowKey].participants : 0; }
    const FUNNEL_STEPS = [
      { key: "landing_viewed", label: "Landing" },

    }));

    // "Jornada N/5" and "Cobrar $10 x participantes" — a threshold and a

    const PLAN_BADGE = { FREE: "badge", PLUS: "badge paid", GRANDFATHERED: "badge admin", MANUAL_GRANT: "badge admin" };
    const PLAN_TEXT = { FREE: "Gratis", PLUS: "Plus", GRANDFATHERED: "Sin límite", MANUAL_GRANT: "Especial" };
    function planOf(q){ return (q.entitlement && q.entitlement.plan) || null; }

      const badge = `<span class="${PLAN_BADGE[plan] || "badge"}">${esc(PLAN_TEXT[plan] || plan)}</span>`;
      // A failed commercial_config read must not blank the whole table: the
      // plan name is still true, only the numbers next to it are unknown.
      if(!config || !config.free || !config.plus) return badge;
      const limits = plan === "FREE"
        ? { p: config.free.participantLimit, r: config.free.manualRoundLimit }

      const bound = !!q.entitlement.competitionIdentity;
      // Misma regla que planLimits.roundBudgetApplies: Plus nunca cuenta

    root.querySelectorAll("[data-edit-slug]").forEach(btn => {

    const cancelEditBtn = root.querySelector("[data-cancel-edit]");
    if(cancelEditBtn){

    const saveEditBtn = root.querySelector("[data-save-edit]");

        saveEditBtn.disabled = true;
        try{
          // MON-001F.2: esto eran DOS escrituras independientes (meta primero,
          // índice después). Si la segunda perdía una carrera de versión, el

          // índice se quedaba atrás — nombre divergente. Ahora

    root.querySelectorAll("[data-delete-slug]").forEach(btn => {

        if(!(await qzConfirm("Se borran todas sus jornadas, resultados y picks. Esto NO se puede deshacer.", { title: `¿Eliminar "${q ? q.name : slug}" para siempre?`, confirmLabel: "Eliminar" }))) return;
        btn.disabled = true;
        try{
          const res = await fetch("/api/delete-quiniela", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Qracks-Platform-Auth": platformPasswordCache || "" },
            body: JSON.stringify({ slug })
          });
          if(!res.ok){ toast("No se pudo eliminar, intenta de nuevo"); btn.disabled = false; return; }
          toast("🗑️ Quiniela eliminada");
          renderPlatformDashboard();
        }catch(e){
          console.error(e);
          toast("No se pudo eliminar, intenta de nuevo");
          btn.disabled = false;

    // MON-002B: the two checkboxes that used to live here ("Exenta" and
    // "Pagado") wrote fields no enforcement path ever read — ticking Exenta
    // changed nothing about the limits a quiniela then hit, and ticking
    // Pagado recorded money without granting anything. Both are replaced by
    // one operation that actually changes what the quiniela is entitled to.
    async function runGrant(btn, slug, payload, confirmOpts){
      if(confirmOpts && !(await qzConfirm(confirmOpts.message, confirmOpts))) return;
      btn.disabled = true;
      // Held on the button, so a retry after a lost response reuses the SAME
      // id — the server recognises it in the history and writes nothing,
      // instead of granting twice and charging twice.
      const grantId = btn.dataset.grantId || (btn.dataset.grantId = newGrantId());
      const r = await grantEntitlement(slug, { ...payload, grantId });
      if(r.ok){
        // Tres desenlaces distintos, tres mensajes distintos. El de
        // reactivación importa: el operador tiene que saber que NO se volvió
        // a cobrar, porque ese torneo ya estaba pagado.
        toast(!r.applied
          ? "Ese cambio ya estaba aplicado."
          : (r.reason === "reactivated_existing_purchase"
              ? "✅ Se restauró el Plus que ya estaba pagado para este torneo. No se cobró de nuevo."
              : "✅ Listo, el plan quedó actualizado."));
        renderPlatformDashboard();
        return;
      }
      // The id is spent either way once the server has seen it; a fresh
      // attempt deserves a fresh one rather than replaying a rejected call
      // forever.
      delete btn.dataset.grantId;
      btn.disabled = false;
      toast(ERROR_MESSAGES[r.error] || "No se pudo cambiar el plan, intenta de nuevo");
    }

    root.querySelectorAll("[data-view-slug]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const slug = btn.dataset.viewSlug;
        const panel = document.getElementById("qz-inspect-panel");
        panel.innerHTML = `<div class="card"><p class="muted">Cargando resumen de /q/${esc(slug)}…</p></div>`;
        panel.scrollIntoView({behavior:"smooth", block:"nearest"});
        try{
          const r = await kvGet(metaKeyFor(slug));
          if(!r.found){ panel.innerHTML = `<div class="card"><p class="muted">No se encontró esa quiniela.</p></div>`; return; }
          const tenantMeta = r.value;
          const picksCache = {};
          await Promise.all(tenantMeta.participants.map(async p => {
            try{
              const pr = await kvGet("quiniela:" + slug + ":picks:" + p.id);
              picksCache[p.id] = pr.found ? pr.value : {};
            }catch(e){ picksCache[p.id] = {}; }
          }));
          function pointsForInspect(pid, participantMap){
            const perPick = (tenantMeta.settings && tenantMeta.settings.pointsPerCorrectPick != null) ? tenantMeta.settings.pointsPerCorrectPick : 1;
            let pts = 0;
            tenantMeta.rounds.forEach(rnd => {
              if(!rnd.resultsPublished) return;
              if(isLg(rnd)){ pts += LG.scoreRound(rnd, picksCache[pid] && picksCache[pid][rnd.id]).total; return; }
              rnd.matches.forEach(m => {
                const result = rnd.results ? rnd.results[m.id] : null;
                if(!result) return;
                const pick = picksCache[pid] && picksCache[pid][rnd.id] ? picksCache[pid][rnd.id][m.id] : null;
                if(pick && pick === result) pts += perPick;
              });
            });
            const p = participantMap.get(pid);
            (tenantMeta.customBets || []).forEach(bet => {
              if(bet.scope === "temporada"){
                const ans = p && p.customBetAnswers && p.customBetAnswers[bet.id];
                if(ans && ans.correct === true) pts += bet.points;
              } else if(bet.scope === "jornada"){
                tenantMeta.rounds.forEach(r => {
                  if(r.published === false) return; // AUTO-001 HOTFIX — same gap as customBetPointsFor, mirrored here
                  const res = r.customBetResults && r.customBetResults[bet.id];
                  if(res && res[pid] === true) pts += bet.points;
                });
              }
            });
            if(!tenantMeta.customBetsMigrated){
              // This quiniela hasn't opened its own app since the upgrade yet — fall back to the old field.
              const gsb = tenantMeta.golScorerBet;
              if(gsb && gsb.enabled && p && p.golScorerCorrect === true) pts += (gsb.bonusPoints != null ? gsb.bonusPoints : 3);
            }
            const penalty = tenantMeta.paymentPenalty;
            if(penalty && penalty.enabled && penalty.startsAtRound && p){
              // Mirrors the real penaltyPointsFor() ledger model (QA-corrected:
              // permanent per-round ledger, immune to reopen/deadline-edit/
              // round-deletion non-monotonicity) -- same fix as the main app,
              // applied here so this diagnostic view never disagrees with
              // what participants/admins actually see.
              const perRound = penalty.pointsPerRound != null ? penalty.pointsPerRound : 1;
              const ledger = p.penalizedRounds || {};
              Object.keys(ledger).forEach(roundId => { pts -= ledger[roundId]; });
              if(!p.paid){
                tenantMeta.rounds.forEach(r => {
                  if(r.published !== false && r.number >= penalty.startsAtRound && isRoundLocked(r) && !(r.id in ledger)) pts -= perRound;
                });
              }
            }
            return pts;
          }
          const inspectParticipantMap = new Map(tenantMeta.participants.map(p => [p.id, p]));
          const standings = tenantMeta.participants
            .map(p => ({ name: p.name, pts: pointsForInspect(p.id, inspectParticipantMap) }))
            .sort((a,b) => b.pts - a.pts);
          const roundsSummary = tenantMeta.rounds.slice().sort((a,b)=>a.number-b.number).map(r => {
            const status = r.resultsPublished ? "resultados publicados" : (new Date(r.deadline).getTime() < serverNow() ? "cerrada, sin resultados" : "abierta");
            return `Jornada ${r.number} (${r.matches.length} partidos) — ${status}`;
          });
          panel.innerHTML = `
            <div class="card">
              <div class="eyebrow" style="display:flex;justify-content:space-between;align-items:center;">
                <span>👁 ${esc(tenantMeta.groupName)} — solo lectura</span>
                <button class="btn btn-ghost btn-sm" id="qz-inspect-close">Cerrar</button>
              </div>
              <p class="muted">${esc(tenantMeta.participants.length)} participantes · ${esc(tenantMeta.rounds.length)} jornadas creadas</p>
              <div class="row2">
                <div>
                  <div class="eyebrow">Tabla</div>
                  <table>
                    <thead><tr><th>Participante</th><th>Pts</th></tr></thead>
                    <tbody>${standings.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.pts)}</td></tr>`).join("")}</tbody>
                  </table>
                </div>
                <div>
                  <div class="eyebrow">Jornadas</div>
                  ${roundsSummary.length ? `<ul style="margin:0;padding-left:18px;">${roundsSummary.map(s => `<li class="muted">${esc(s)}</li>`).join("")}</ul>` : `<p class="muted">Sin jornadas todavía.</p>`}
                </div>
              </div>
            </div>
          `;
          document.getElementById("qz-inspect-close").addEventListener("click", () => { panel.innerHTML = ""; });
        }catch(e){
          console.error(e);
          panel.innerHTML = `<div class="card"><p class="muted">No se pudo cargar el resumen.</p></div>`;
        }
      });
    });
  }

  function renderHome(){

  function renderMigratedNotice(slug){
    root.innerHTML = `

        </div>
      </div>
    `;
  }

  // "Solo ver": read-only view for people who aren't participants — no name, no PIN,
  // just the standings and a list of jornadas played. Reached via /q/slug?ver=1
  async function renderSpectatorView(){
    root.innerHTML = `<div class="login-wrap"><div class="login-card"><p class="muted" style="text-align:center;">Cargando…</p></div></div>`;
    await ensureAllPicksLoaded();
    const list = standingsList();
    const spectatorRanks = computeDenseRanks(list);
    const fee = meta.settings.entryFee;
    const paidCount = meta.participants.filter(p=>p.paid).length;
    const totalP = meta.participants.length;
    const { feeDisplay, recaudadoDisplay } = feeSummaryHtml(fee, paidCount, totalP);
    const published = meta.rounds.filter(r=>r.resultsPublished).slice().reverse();
    root.innerHTML = `
      <div class="qz-header">
        <div class="qz-header-top">
          <div class="qz-brand"><span class="display">${esc(meta.groupName)}</span><span class="display dot">.</span></div>
          <div class="qz-user-chip">👁 Solo ver</div>
        </div>
      </div>
      <div class="qz-main">
        <div class="section-title"><span class="display">Tabla de posiciones</span></div>
        <div class="card">
          <div class="row2">
            <div><div class="eyebrow">Cuota por persona</div><div class="display" style="font-size:26px;">${feeDisplay}</div></div>
            <div><div class="eyebrow">Recaudado</div><div class="display" style="font-size:26px;">${recaudadoDisplay}</div></div>
          </div>
        </div>
        <div class="card" style="padding:8px 12px;">
          <table>
            <thead><tr><th style="text-align:center;">#</th><th>Participante</th><th style="text-align:center;">Pts</th></tr></thead>
            <tbody>
              ${list.map((p,i) => `
                <tr>
                  <td class="pos ${spectatorRanks[i]===1?'top1':''}" style="text-align:center;">${spectatorRanks[i]}</td>
                  <td>${esc(p.name)} ${p.isAdmin?'<span class="badge admin">ADMIN</span>':''}</td>
                  <td style="text-align:center;font-weight:700;">${esc(p.pts)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        ${published.length ? `
          <div class="section-title" style="margin-top:20px;"><span class="display" style="font-size:22px;">Jornadas jugadas</span></div>
          <div class="card">
            ${published.map(r => `<div class="history-item"><div><strong>Jornada ${esc(r.number)}</strong> <span class="muted">· ${esc(r.matches.length)} partidos</span></div></div>`).join("")}
          </div>
        ` : ``}
        <p class="muted" style="text-align:center;margin-top:20px;">👁 Estás viendo esta quiniela en modo solo lectura — no puedes votar ni modificar nada.</p>
      </div>
    `;
  }

  async function boot(attempt){
    attempt = attempt || 1;

    if(ROUTE === "demo"){ renderDemo(); return; }
    if(ROUTE === "crear"){ renderCrear(); return; }
    if(ROUTE === "unknown"){ renderUnknownRoute(); return; }
    if(ROUTE === "platform"){ renderPlatformDashboard(); return; }

    root.innerHTML = `<div class="login-wrap"><div class="login-card"><p class="muted" style="text-align:center;">Cargando…</p></div></div>`;
    if(attempt === 1) syncServerTime(); // fire-and-forget, offset defaults to 0 until it resolves
    let m;
    try{
      m = await getMeta();
    }catch(e){
      console.error("boot: failed to load data", e);
      // Never initialize fresh data on a failed request — only retry.
      if(attempt < 3){
        setTimeout(() => boot(attempt + 1), 1200);
        return;
      }
      renderBootError("No pudimos cargar los datos de la quiniela. Puede ser que el servidor apenas esté despertando (tarda ~30-60 segundos la primera vez) o un problema de conexión.", () => boot(1));
      return;
    }
    if(ROUTE === "root"){
      renderHome();
      return;
    }
    if(m === null){
      if(ROUTE === "quiniela"){
        // A /q/:slug that doesn't exist — never silently create data under someone else's link.
        renderQuinielaNotFound();
        return;
      }
      // ROUTE === "root": nothing here anymore (or never was) — show the public home page.
      renderHome();
      return;
    }
    if(ROUTE === "root" && m.migratedTo){
      renderMigratedNotice(m.migratedTo);
      return;
    }
    meta = m;
    if(new URLSearchParams(window.location.search).has("ver")){
      renderSpectatorView();
      return;
    }
    if(ROUTE === "quiniela" && !accessLinkOpenedTracked){
      accessLinkOpenedTracked = true;
      trackEvent("access_link_opened");
    }
    // MON-003: la vuelta del checkout se resuelve DESPUÉS de pintar, y el
    // `await` es la parte que importa. render() es quien restaura la sesión
    // (checkSession -> currentUser), así que sin esperarlo la confirmación
    // arrancaba antes de saber que quien vuelve es el organizador, se daba por
    // no-admin y se salía en silencio: el pago se cobraba y la pantalla no
    // decía nada. Pintar primero también evita que el Admin mire una pantalla
    // en blanco mientras se confirma, y `notice()` sobrevive al re-render.
    await render();
    resolveCheckoutReturn().catch((e) => console.error("checkout return failed", e));
  }
  boot();
})();
